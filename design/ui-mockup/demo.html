  --u-card: var(--c-s1); --u-well: var(--c-s3); --u-bdr: var(--c-edge); --u-div: var(--c-edge);
  --u-pri: var(--c-inv); --u-on-pri: var(--c-on-inv); --u-r: 24px; --u-ri: 16px; --u-rbtn: 999px;
  --u-add: var(--c-add); --u-del: var(--c-del); --u-pad: 16px;
  --u-add-bg: color-mix(in srgb, var(--c-add) 14%, transparent);
  --u-del-bg: color-mix(in srgb, var(--c-del) 14%, transparent);
}
:root[data-look="clear"] {
  --u-card: transparent; --u-well: var(--c-surface); --u-bdr: var(--c-line); --u-div: var(--c-line);
  --u-pri: var(--c-acc); --u-on-pri: var(--c-on-acc); --u-r: 16px; --u-ri: 12px; --u-rbtn: 999px;
  --u-add: var(--c-add); --u-del: var(--c-del); --u-pad: 24px;
  --u-add-bg: color-mix(in srgb, var(--c-add) 11%, transparent);
  --u-del-bg: color-mix(in srgb, var(--c-del) 11%, transparent);
}
:root[data-look="plate"] {
  --u-card: var(--c-bg); --u-well: var(--c-tint); --u-bdr: var(--c-fg); --u-div: var(--c-line);
  --u-pri: var(--c-fg); --u-on-pri: var(--c-bg); --u-r: 0px; --u-ri: 0px; --u-rbtn: 0px;
  --u-add: var(--c-add-ink); --u-del: var(--c-danger); --u-pad: 18px;
  --u-add-bg: color-mix(in srgb, var(--c-add-ink) 12%, transparent);
  --u-del-bg: color-mix(in srgb, var(--c-danger) 12%, transparent);
}

/* 通用触感、图标定宽防抖动、图标旋转、行折叠移除、可点子代理 */
.ms { width: 1em; height: 1em; overflow: hidden; display: inline-flex !important; align-items: center; justify-content: center; flex: none; }
:root[data-look="plate"] .mast-top .ibtn { width: 34px; height: 34px; margin-left: auto; }
:root[data-look="plate"] .mast-top .sqbtn { width: 34px; height: 34px; margin-left: 0; }
@keyframes rc-spin { to { transform: rotate(360deg); } }
.spinning .ms { animation: rc-spin calc(680ms * var(--slow, 1)) linear infinite; }
.swipe.removing { transition: max-height calc(260ms * var(--slow, 1)) ease, opacity calc(200ms * var(--slow, 1)) ease; max-height: 0 !important; opacity: 0 !important; overflow: hidden; }
.agent { cursor: pointer; }
.agent:active { opacity: 0.7; }
.sitem[data-act], .sitem[data-m], .sitem[data-dir], .sitem[data-branch] { cursor: pointer; }
.sitem[data-act]:active, .sitem[data-m]:active, .sitem[data-dir]:active, .sitem[data-branch]:active { opacity: 0.72; }
.appbar .t[data-act="ctl"], .cbar .t[data-act="ctl"] { cursor: pointer; }
.appbar .t[data-act="ctl"] b, .cbar .t[data-act="ctl"] b { display: flex; align-items: center; gap: 2px; }
.appbar .t[data-act="ctl"] b .ms, .cbar .t[data-act="ctl"] b .ms { font-size: 16px; opacity: 0.5; flex: none; }
.me[data-mi] { cursor: pointer; transition: opacity 140ms ease; }
.me[data-mi]:active { opacity: 0.85; }
.tool-item[data-ti], .tline-item[data-ti], .task[data-task-i] { cursor: pointer; }
.tool-item[data-ti]:active, .tline-item[data-ti]:active, .task[data-task-i]:active { opacity: 0.68; }
[data-open-git] { cursor: pointer; padding: 2px 5px; border-radius: 6px; transition: background 140ms ease; }
[data-open-git]:hover { text-decoration: underline; }
.t-usage, :root[data-look="clear"] .usage, :root[data-look="plate"] .ruler { cursor: pointer; }

/* 提问自定义回答输入框 */
.opt-custom-box { display: none; padding: 0 12px 10px 44px; }
.opt.on + .opt-custom-box { display: block; }
:root[data-look="plate"] .opt-custom-box { padding: 4px 0 10px 28px; }
:root[data-look="ink"] .opt-custom-box, :root[data-look="clear"] .opt-custom-box { padding: 2px 8px 10px 40px; }
.opt-inp { width: 100%; height: 36px; padding: 0 10px; border-radius: var(--u-ri); border: 1.5px solid var(--u-div); background: var(--c-bg); color: var(--c-fg); font: 13.5px var(--font); outline: none; }
.opt-inp:focus { border-color: var(--u-pri); }
:root[data-look="plate"] .opt-inp { border-color: var(--c-fg); }

/* 排队消息条 & 已停止唤醒条 */
.queue-bar, .wake-bar { display: flex; align-items: center; gap: 8px; padding: 8px 14px; font-size: 13px; color: var(--c-fg2); border-bottom: 1px solid var(--u-div); }
.queue-bar span, .wake-bar span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.queue-bar b, .wake-bar b { color: var(--c-fg); font-weight: 600; }
.qbtn { padding: 4px 10px; border-radius: var(--u-rbtn); background: var(--u-well); color: var(--c-fg); font-size: 12px; font-weight: 600; flex: none; }
.qbtn.pri { background: var(--u-pri); color: var(--u-on-pri); }
:root[data-look="plate"] .qbtn { border: 1.5px solid var(--c-fg); background-color: var(--c-bg); color: var(--c-fg); font-weight: 800;
  background-image: linear-gradient(var(--c-fg), var(--c-fg)); background-position: left; background-size: 0 100%; background-repeat: no-repeat;
  transition: background-size var(--d-s) var(--ease-press), color var(--d-xs), transform var(--d-xs) var(--ease-press), box-shadow var(--d-xs) var(--ease-press); }
:root[data-look="plate"] .qbtn:active { background-size: 100% 100%; color: var(--c-bg); transform: translate(1px, 1px); }
:root[data-look="plate"] .qbtn.pri { background-color: var(--c-fg); background-image: none; color: var(--c-bg); box-shadow: 2px 2px 0 0 var(--c-bg), 3px 3px 0 0 var(--c-fg); }
:root[data-look="plate"] .qbtn.pri:active { transform: translate(2px, 2px); box-shadow: none; color: var(--c-bg); }

/* 聊天图片卡片与全屏看图弹层 */
.chat-img { align-self: flex-start; width: 224px; border-radius: var(--u-ri); overflow: hidden; border: 1px solid var(--u-div); background: var(--u-card); cursor: pointer; }
:root[data-look="plate"] .chat-img { border: 1.5px solid var(--c-fg); }
.chat-img svg { display: block; width: 100%; height: auto; }
.chat-img-cap { display: flex; align-items: center; justify-content: space-between; padding: 7px 10px; font-family: var(--mono); font-size: 11px; color: var(--c-fg2); }
.lightbox { position: absolute; inset: 0; z-index: 80; background: rgba(8, 9, 12, 0.92); color: #fff; display: flex; flex-direction: column; opacity: 0; transition: opacity 220ms ease; }
.lightbox.on { opacity: 1; }
.lb-top { display: flex; align-items: center; gap: 8px; padding: 50px 14px 10px; }
.lb-top .lb-t { flex: 1; min-width: 0; }
.lb-top b { display: block; font-size: 14px; font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lb-top span { display: block; font-size: 11.5px; opacity: 0.65; }
.lb-btn { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.12); color: #fff; display: grid; place-items: center; flex: none; }
.lb-btn:active { background: rgba(255,255,255,0.24); }
.lb-stage { flex: 1; display: grid; place-items: center; padding: 16px; }
.lb-stage svg { width: 100%; max-width: 348px; height: auto; border-radius: 14px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
.lb-foot { padding: 12px 20px 30px; display: flex; gap: 10px; justify-content: center; }
.lb-act { height: 42px; padding: 0 20px; border-radius: 999px; background: rgba(255,255,255,0.16); color: #fff; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.lb-act:active { background: rgba(255,255,255,0.28); }
.load-more-btn { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; padding: 14px 16px; font-size: 12.5px; color: var(--c-fg2); font-weight: 500; }
.load-more-btn:active { opacity: 0.65; }
.diff-foot { position: absolute; inset: auto 0 0; padding: 10px var(--u-pad) 24px; background: var(--c-bg); border-top: 1px solid var(--u-div); display: flex; gap: 10px; z-index: 4; }
.toast-btn { margin-left: 10px; text-decoration: underline; font-weight: 700; pointer-events: auto; }
.toast.has-act { pointer-events: auto; }

/* git 操作条与文件分组标题 */
.git-ops { display: flex; gap: 8px; padding: 0 var(--u-pad) 10px; }
.git-op { flex: 1; height: 36px; border-radius: var(--u-rbtn); background: var(--u-well); color: var(--c-fg); font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 5px; transition: transform 140ms ease, opacity 140ms ease; }
.git-op .ms { font-size: 17px; }
.git-op.pri { background: var(--u-pri); color: var(--u-on-pri); }
.git-op:active { transform: scale(0.96); }
:root[data-look="plate"] .git-op { border: 1.5px solid var(--c-fg); background-color: var(--c-bg); color: var(--c-fg); font-weight: 800;
  background-image: linear-gradient(var(--c-fg), var(--c-fg)); background-position: left; background-size: 0 100%; background-repeat: no-repeat;
  transition: background-size var(--d-m) var(--ease-press), color var(--d-xs), transform var(--d-xs) var(--ease-press), box-shadow var(--d-xs) var(--ease-press), background-color var(--d-xs); }
:root[data-look="plate"] .git-op:hover:not(.pri) { background-color: var(--c-tint); }
:root[data-look="plate"] .git-op:active { background-size: 100% 100%; color: var(--c-bg); transform: translate(1.5px, 1.5px); }
:root[data-look="plate"] .git-op.pri { background-color: var(--c-fg); background-image: none; color: var(--c-bg); box-shadow: 2px 2px 0 0 var(--c-bg), 3.5px 3.5px 0 0 var(--c-fg); }
:root[data-look="plate"] .git-op.pri:hover { transform: translate(-0.5px, -0.5px); box-shadow: 2.5px 2.5px 0 0 var(--c-bg), 4px 4px 0 0 var(--c-fg); }
:root[data-look="plate"] .git-op.pri:active { transform: translate(2px, 2px); box-shadow: none; color: var(--c-bg); }
:root[data-look="ink"] .git-op { background: var(--c-float); box-shadow: var(--c-shadow); }
:root[data-look="ink"] .git-op.pri { background: var(--c-inv); color: var(--c-on-inv); }
.fsec { display: flex; align-items: center; justify-content: space-between; padding: 12px var(--u-pad) 4px; font-size: 12px; font-weight: 600; color: var(--c-fg3); }
:root[data-look="tile"] .card .fsec { padding: 12px 16px 4px; }
:root[data-look="plate"] .fsec { color: var(--c-fg2); font-weight: 800; padding: 12px 18px 4px; letter-spacing: 0.04em; }
.fsec button { font-size: 12px; font-weight: 600; color: var(--u-pri); }
:root[data-look="plate"] .fsec button { font-weight: 800; padding: 2px 5px; border-bottom: 1.5px solid var(--c-fg); transition: background var(--d-xs), color var(--d-xs); }
:root[data-look="plate"] .fsec button:hover { background: var(--c-tint); }
:root[data-look="plate"] .fsec button:active { background: var(--c-fg); color: var(--c-bg); }
:root[data-look="plate"] [data-open-git] { border-radius: 0; padding: 1px 5px; border-bottom: 1px solid transparent; transition: background var(--d-xs), color var(--d-xs), border-color var(--d-xs); }
:root[data-look="plate"] [data-open-git]:hover { text-decoration: none; border-bottom-color: var(--c-fg); background: var(--c-tint); color: var(--c-fg); }
:root[data-look="plate"] [data-open-git]:active { background: var(--c-fg); color: var(--c-bg); }
:root[data-look="plate"] .load-more-btn { width: calc(100% - 36px); margin: 10px 18px 4px; padding: 11px 14px; border: 1.5px solid var(--c-fg); font-weight: 800; color: var(--c-fg);
  background: linear-gradient(var(--c-fg), var(--c-fg)) left / 0 100% no-repeat;
  transition: background-size var(--d-m) var(--ease-press), color var(--d-xs), transform var(--d-xs) var(--ease-press), background-color var(--d-xs); }
:root[data-look="plate"] .load-more-btn:hover { background-color: var(--c-tint); }
:root[data-look="plate"] .load-more-btn:active { opacity: 1; background-size: 100% 100%; color: var(--c-bg); transform: translate(1px, 1px); }
:root[data-look="plate"] .diff-foot { border-top: 2px solid var(--c-fg); padding: 12px 18px 26px; }
:root[data-look="plate"] .ro-bar { border-top: 2px solid var(--c-fg); font-weight: 700; }
:root[data-look="plate"] .ro-bar .dot { border-radius: 0; }
:root[data-look="ink"] .fsec button { color: var(--c-acc); }

/* 通用次级页面容器 */
.sub-scroll { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; padding: 106px 0 44px; }
.sub-scroll::-webkit-scrollbar { display: none; }
:root[data-look="ink"] .sub-scroll { padding-top: 112px; }
:root[data-look="plate"] .sub-scroll { padding-top: 108px; }
.sub-blk { margin: 0 var(--u-pad) 12px; padding: 14px 16px; background: var(--u-card); border-radius: var(--u-r); }
:root[data-look="ink"] .sub-blk { box-shadow: inset 0 0 0 1px var(--c-edge); }
:root[data-look="clear"] .sub-blk { padding: 4px 0 12px; border-bottom: 1px solid var(--c-line); border-radius: 0; }
:root[data-look="plate"] .sub-blk { border: 1.5px solid var(--c-fg); padding: 14px; }
.sub-blk.tight { padding: 0; overflow: hidden; }
:root[data-look="clear"] .sub-blk.tight { border-bottom: 0; }
.sub-h { margin: 16px var(--u-pad) 6px; font-size: 12.5px; font-weight: 600; color: var(--c-fg2); display: flex; align-items: center; justify-content: space-between; }
:root[data-look="plate"] .sub-h { letter-spacing: 0.04em; padding-bottom: 5px; border-bottom: 2px solid var(--c-fg); margin-bottom: 8px; }

/* 提交详情 */
.cm-subj { font-size: 19px; font-weight: 600; line-height: 1.35; margin: 0; }
.cm-body { margin: 8px 0 0; font-size: 13.5px; color: var(--c-fg2); line-height: 1.65; white-space: pre-wrap; }
.cm-refs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.meta-row { display: flex; align-items: baseline; gap: 12px; padding: 5px 0; font-size: 13.5px; }
.meta-row .mk { width: 52px; flex: none; color: var(--c-fg3); font-size: 12.5px; }
.meta-row .mv { flex: 1; min-width: 0; }
.parent-link { display: inline-block; font-family: var(--mono); font-size: 12px; padding: 2px 7px; border-radius: var(--u-ri); background: var(--u-well); color: var(--c-fg); margin-right: 6px; }
:root[data-look="plate"] .parent-link { border: 1.5px solid var(--c-fg); background-color: var(--c-bg); font-weight: 700;
  background-image: linear-gradient(var(--c-fg), var(--c-fg)); background-position: left; background-size: 0 100%; background-repeat: no-repeat;
  transition: background-size var(--d-s) var(--ease-press), color var(--d-xs), transform var(--d-xs) var(--ease-press), background-color var(--d-xs); }
:root[data-look="plate"] .parent-link:hover { background-color: var(--c-tint); }
:root[data-look="plate"] .parent-link:active { opacity: 1; background-size: 100% 100%; color: var(--c-bg); transform: translate(1px, 1px); }
.parent-link:active { opacity: 0.65; }

/* Diff 差异页 */
.diff-wrap { margin: 0 var(--u-pad) 16px; background: var(--u-card); border-radius: var(--u-r); overflow: hidden; }
:root[data-look="ink"] .diff-wrap { box-shadow: inset 0 0 0 1px var(--c-edge); }
:root[data-look="clear"] .diff-wrap { margin: 0; border-radius: 0; border-top: 1px solid var(--c-line); }
:root[data-look="plate"] .diff-wrap { border: 1.5px solid var(--c-fg); }
.diff-scroll { overflow-x: auto; font-family: var(--mono); font-size: 12px; line-height: 1.68; padding: 0 0 8px; }
.diff-inner { min-width: max-content; }
.diff-head { display: flex; align-items: center; padding: 6px 12px 5px 12px; border-bottom: 1px solid var(--u-div); font-size: 10.5px; color: var(--c-fg3); user-select: none; }
.diff-head .ln { width: 30px; flex: none; text-align: right; padding-right: 6px; }
.diff-head .ln:first-child { border-right: 1px solid color-mix(in srgb, var(--u-div) 65%, transparent); }
.diff-head .ln:nth-child(2) { border-right: 1px solid var(--u-div); margin-right: 6px; }
.dline { display: flex; padding: 0 12px 0 12px; }
.dline .ln { width: 30px; flex: none; text-align: right; padding-right: 6px; color: var(--c-fg3); user-select: none; font-size: 11px; font-variant-numeric: tabular-nums; }
.dline .ln:first-child { border-right: 1px solid color-mix(in srgb, var(--u-div) 55%, transparent); }
.dline .ln:nth-child(2) { border-right: 1px solid var(--u-div); margin-right: 6px; }
.dline .sg { width: 14px; flex: none; text-align: center; user-select: none; font-weight: 600; margin-right: 4px; }
.dline .tx { white-space: pre; padding-right: 12px; }
.dline.hunk { background: transparent; border-top: 1px solid var(--u-div); border-bottom: 1px solid var(--u-div); color: var(--c-fg3); padding: 4px 12px; margin: 4px 0; font-size: 11px; }
.diff-head + .dline.hunk { border-top: 0; margin-top: 0; }
.dline.add { background: transparent; color: var(--u-add); }
.dline.del { background: transparent; color: var(--u-del); }
.dgrp { margin: 4px 6px; padding: 2px 0; border-radius: 8px; background: transparent; }
:root[data-look="plate"] .dgrp { border-radius: 0; }
.dgrp.del { border: 1px solid color-mix(in srgb, var(--u-del) 58%, transparent); border-left: 3px solid var(--u-del); }
.dgrp.add { border: 1px solid color-mix(in srgb, var(--u-add) 58%, transparent); border-left: 3px solid var(--u-add); }
.dgrp.del:has(+ .dgrp.add) { margin-bottom: 0; border-bottom-left-radius: 0; border-bottom-right-radius: 0; border-bottom: 0; }
.dgrp.del + .dgrp.add { margin-top: 0; border-top-left-radius: 0; border-top-right-radius: 0; border-top: 1px solid var(--u-div); }
.dgrp .dline { padding-left: 3px; padding-right: 6px; }
.dgrp.del .dline .ln:first-child { border-right-color: color-mix(in srgb, var(--u-del) 22%, transparent); }
.dgrp.del .dline .ln:nth-child(2) { border-right-color: color-mix(in srgb, var(--u-del) 36%, transparent); }
.dgrp.add .dline .ln:first-child { border-right-color: color-mix(in srgb, var(--u-add) 22%, transparent); }
.dgrp.add .dline .ln:nth-child(2) { border-right-color: color-mix(in srgb, var(--u-add) 36%, transparent); }
.diff-bin { padding: 36px 24px; text-align: center; color: var(--c-fg2); font-size: 14px; }
.diff-bin .ms { font-size: 36px; color: var(--c-fg3); display: block; margin-bottom: 10px; }

/* 终端视图 */
.term-page { display: flex; flex-direction: column; }
.term-body { position: absolute; inset: 98px 0 64px; padding: 10px var(--u-pad); display: flex; flex-direction: column; }
:root[data-look="ink"] .term-body { top: 108px; }
.term-box { flex: 1; background: #101216; color: #E4E6EB; border-radius: var(--u-r); padding: 14px; font: 12px/1.62 var(--mono); overflow-y: auto; white-space: pre-wrap; word-break: break-word; }
:root[data-look="plate"] .term-box { background: var(--c-fg); color: var(--c-bg); border: 1.5px solid var(--c-fg); }
.term-box .t-dim { opacity: 0.55; }
.term-box .t-ok { color: #5BD08C; }
.term-box .t-acc { color: #7AA7FF; }
.term-box .t-warn { color: #F5C065; }
:root[data-look="plate"] .term-box .t-ok, :root[data-look="plate"] .term-box .t-acc, :root[data-look="plate"] .term-box .t-warn { color: var(--c-bg); text-decoration: underline; }
.term-cur { display: inline-block; width: 7px; height: 13px; background: currentColor; vertical-align: -2px; animation: rc-blink 1s steps(2) infinite; }
@keyframes rc-blink { 50% { opacity: 0; } }
.term-keys { position: absolute; inset: auto 0 0; height: 64px; padding: 8px var(--u-pad) 18px; display: flex; gap: 6px; align-items: center; background: var(--c-bg); }
.tkey { flex: 1; height: 36px; border-radius: var(--u-ri); background: var(--u-well); font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--c-fg); display: grid; place-items: center; }
.tkey:active { transform: scale(0.95); background: var(--u-pri); color: var(--u-on-pri); }
/* 差异化按钮：终端机械活字按键（下沿 2px 实体键帽阴影，按下垂直压平反墨；Ctrl+C 独享朱红警戒边） */
:root[data-look="plate"] .term-keys { border-top: 1.5px solid var(--c-fg); }
:root[data-look="plate"] .tkey { border: 1.5px solid var(--c-fg); background: var(--c-bg); font-weight: 800; box-shadow: 0 2.5px 0 0 var(--c-fg);
  transition: transform var(--d-xs) var(--ease-press), box-shadow var(--d-xs) var(--ease-press), background var(--d-xs), color var(--d-xs); }
:root[data-look="plate"] .tkey:hover { background: var(--c-tint); }
:root[data-look="plate"] .tkey:active { transform: translateY(2.5px); box-shadow: 0 0 0 0 var(--c-fg); background: var(--c-fg); color: var(--c-bg); }
:root[data-look="plate"] .tkey[data-tkey="ctrlc"] { border-color: var(--c-danger); color: var(--c-danger); box-shadow: 0 2.5px 0 0 var(--c-danger); }
:root[data-look="plate"] .tkey[data-tkey="ctrlc"]:active { background: var(--c-danger); color: var(--c-on-danger); box-shadow: none; }

/* 表单与弹窗（新建会话、改档位名、中转服务器、提交信息、清除配对确认） */

<script>

      self.pages.forEach(function (p) { p.remove(); });

      el.classList.add("page");

  K.swipe = function (wrap, reveal) {

  // 聊天输入：支持普通消息、多张附图芯片、工作中排队发送、/ 斜杠命令补全，消息持久化到 RC.chat
  K.composer = function (page, toast, s, onAfterSend, onSlash) {
    var RC = window.RC;
    page._atts = [];
    page._queue = [];
    function ensureChat() {
      if (!s) return null;
      if (!RC.chat[s.id]) RC.chat[s.id] = [{ k: "day", text: "今天" }, { k: "me", text: "继续" }, { k: "ai", text: s.detail || "好的。" }];

    }
    function hideSlash() {
      var pop = page.querySelector(".slash-pop");

    }

      bar.innerHTML = page._atts.map(function (name, i) {
        return '<span class="attach-chip">' + K.icon("image") + "<span>" + K.esc(name) + '</span><button type="button" data-rm-att="' + i + '">' + K.icon("close") + "</button></span>";

      if (!qb) { qb = K.h('<div class="queue-bar"></div>'); dock.insertBefore(qb, dock.firstChild); }

    function deliver(text, atts) {

      var wasStop = s && s.state === "stop";

          msgs.innerHTML = '<div class="cap">上下文已清空</div>';
          if (list) list.push({ k: "cap", text: "上下文已清空" });

        return;
      }

        setTimeout(function () {
          if (!page.isConnected) return;

          if (onAfterSend) onAfterSend({ ctxChanged: true });

      else if (text === "/status") reply = "当前目录 `" + (s ? s.dir : "clauderc-app") + "`" + (s && s.branch ? " · 分支 `" + s.branch + "`" : "") + " · 模型 `" + (s && s.model ? s.model : "Opus 4.6") + "`。";
      else if (atts && atts.length && !text) reply = "已收到 " + atts.length + " 张截图，我按图里的内容排查一下。";

    function send(forced) {
      var input = page.querySelector(".field input");

      hideSlash();

  K.buildGitGraph = function (commits, opts) {
    opts = opts || {};
    var ROW = opts.row || 62;
    var look = opts.look || "tile";
    var X0 = opts.x0 != null ? opts.x0 : (look === "plate" ? 12 : look === "tile" ? 20 : 28);
    var LX = opts.lx || 17;
    var maxLane = 0;
    commits.forEach(function (c) { if (c.lane > maxLane) maxLane = c.lane; });
    var gw = X0 + maxLane * LX + (look === "plate" ? 18 : 20);
    var totalH = commits.length * ROW;
    var idx = {};
    commits.forEach(function (c, i) { idx[c.h] = i; });

    function laneStroke(l) {
      if (look === "plate") return l === 0 ? "var(--c-fg)" : "var(--c-fg2)";
      if (look === "clear") return l === 0 ? "var(--c-fg)" : l === 1 ? "var(--c-acc)" : "var(--c-fg2)";
      if (look === "ink") return l === 0 ? "var(--c-fg2)" : l === 1 ? "var(--c-acc)" : "var(--c-ok)";
      return l === 0 ? "var(--c-fg)" : l === 1 ? "var(--c-acc)" : "var(--c-ok)";
    }
    var nodeBg = look === "tile" ? "var(--c-card)" : "var(--c-bg)";

    // 先收集所有边并按泳道分层，让彩色合并/分叉曲线浮在主干之上，视觉更醒目
    var edgeList = [];
    commits.forEach(function (c, i) {
      var x1 = X0 + c.lane * LX, y1 = i * ROW + ROW / 2;
      (c.p || []).forEach(function (ph) {
        var j = idx[ph];
        var d, laneColorIdx;
        if (j === undefined) {
          d = "M" + x1 + " " + y1 + " V" + totalH;
          laneColorIdx = c.lane;
        } else {
          var p = commits[j], x2 = X0 + p.lane * LX, y2 = j * ROW + ROW / 2;
          laneColorIdx = Math.max(c.lane, p.lane);
          if (p.lane === c.lane) {
            d = "M" + x1 + " " + y1 + " V" + y2;
          } else if (p.lane > c.lane) {
            var ye = y1 + ROW;
            d = "M" + x1 + " " + y1 + " C" + x1 + " " + (y1 + ROW * 0.56).toFixed(1) + " " + x2 + " " + (y1 + ROW * 0.44).toFixed(1) + " " + x2 + " " + ye + (y2 > ye ? " V" + y2 : "");
          } else {
            var ys = y2 - ROW;
            d = "M" + x1 + " " + y1 + (ys > y1 ? " V" + ys : "") + " C" + x1 + " " + (ys + ROW * 0.56).toFixed(1) + " " + x2 + " " + (ys + ROW * 0.44).toFixed(1) + " " + x2 + " " + y2;
          }
        }
        edgeList.push({ lane: laneColorIdx, d: d });
      });
    });
    edgeList.sort(function (a, b) { return a.lane - b.lane; });

    var edgesSvg = edgeList.map(function (e) {
      var sw = look === "plate" ? (e.lane === 0 ? 2.2 : e.lane === 1 ? 1.8 : 1.6) : 2;
      var dash = (look === "plate" && e.lane >= 2) ? ' stroke-dasharray="4 3"' : "";
      return '<path d="' + e.d + '" fill="none" stroke="' + laneStroke(e.lane) + '" stroke-width="' + sw + '" stroke-linecap="round"' + dash + "/>";
    }).join("");

    var nodesSvg = commits.map(function (c, i) {
      var cx = X0 + c.lane * LX, cy = i * ROW + ROW / 2;
      var col = (look === "ink" && c.lane === 0) ? "var(--c-fg)" : laneStroke(c.lane);
      var isHead = (c.refs || []).some(function (r) { return r.kind === "head"; });
      var isMerge = (c.p || []).length > 1;
      if (look === "plate") {
        if (isHead) return '<rect x="' + (cx - 5) + '" y="' + (cy - 5) + '" width="10" height="10" fill="' + nodeBg + '" stroke="' + col + '" stroke-width="2"/>';
        if (isMerge) return '<rect x="' + (cx - 5) + '" y="' + (cy - 5) + '" width="10" height="10" fill="' + nodeBg + '" stroke="' + col + '" stroke-width="1.8"/><rect x="' + (cx - 2) + '" y="' + (cy - 2) + '" width="4" height="4" fill="' + col + '"/>';
        return '<rect x="' + (cx - 4.5) + '" y="' + (cy - 4.5) + '" width="9" height="9" fill="' + nodeBg + '"/><rect x="' + (cx - 3.5) + '" y="' + (cy - 3.5) + '" width="7" height="7" fill="' + col + '"/>';
      }
      if (isHead) return '<circle cx="' + cx + '" cy="' + cy + '" r="6.5" fill="' + nodeBg + '"/><circle cx="' + cx + '" cy="' + cy + '" r="5" fill="' + nodeBg + '" stroke="' + col + '" stroke-width="2.2"/>';
      if (isMerge) return '<circle cx="' + cx + '" cy="' + cy + '" r="6.2" fill="' + nodeBg + '"/><circle cx="' + cx + '" cy="' + cy + '" r="4.8" fill="' + nodeBg + '" stroke="' + col + '" stroke-width="2"/><circle cx="' + cx + '" cy="' + cy + '" r="1.9" fill="' + col + '"/>';
      return '<circle cx="' + cx + '" cy="' + cy + '" r="5.3" fill="' + nodeBg + '"/><circle cx="' + cx + '" cy="' + cy + '" r="3.8" fill="' + col + '"/>';
    }).join("");

    var rowsHtml = commits.map(function (c) {
      var refsHtml = "";
      if (c.refs && c.refs.length) {
        var r0 = c.refs[0];
        var cls0 = r0.kind === "head" ? " head" : r0.kind === "tag" ? " tag" : "";
        var lbl0 = r0.kind === "head" ? "HEAD → " + r0.name : r0.name;
        var extra = c.refs.length > 1 ? '<span class="ref-tag">+' + (c.refs.length - 1) + "</span>" : "";
        refsHtml = '<span class="refs"><span class="ref-tag' + cls0 + '">' + K.esc(lbl0) + "</span>" + extra + "</span>";
      }
      return '<div class="cmt" data-commit="' + K.esc(c.h) + '"><div class="cmt-t"><div class="cmt-l1"><b>' + K.esc(c.s) + "</b>" + refsHtml + '</div><div class="cmt-meta">' + K.esc(c.h) + " · " + K.esc(c.a) + " · " + K.esc(c.t) + "</div></div></div>";
    }).join("");

    return '<div class="graph-list" style="--gw:' + gw + 'px"><svg class="graph-svg" width="' + gw + '" height="' + totalH + '" viewBox="0 0 ' + gw + " " + totalH + '">' + edgesSvg + nodesSvg + "</svg>" + rowsHtml + "</div>";
  };

  // 差异块 HTML：连续删/增行成组，用边框与分界线区分，不铺背景色
  K.diffHTML = function (lines) {
    if (!lines || !lines.length) return '<div class="diff-bin">' + K.icon("check_circle") + "没有文本差异</div>";
    var out = [], i = 0;
    function lineRow(l) {
      var sg = l.k === "add" ? "+" : l.k === "del" ? "−" : " ";
      return '<div class="dline ' + l.k + '"><span class="ln">' + (l.o || "") + '</span><span class="ln">' + (l.n || "") + '</span><span class="sg">' + sg + '</span><span class="tx">' + K.esc(l.text) + "</span></div>";
    }
    while (i < lines.length) {
      var l = lines[i];
      if (l.k === "hunk") {
        out.push('<div class="dline hunk">' + K.esc(l.text) + "</div>");
        i++;
      } else if (l.k === "add" || l.k === "del") {
        var kind = l.k, grp = [];
        while (i < lines.length && lines[i].k === kind) { grp.push(lineRow(lines[i])); i++; }
        out.push('<div class="dgrp ' + kind + '">' + grp.join("") + "</div>");
      } else {
        out.push(lineRow(l));
        i++;
      }
    }
    return '<div class="diff-scroll"><div class="diff-inner"><div class="diff-head"><span class="ln">旧</span><span class="ln">新</span><span>代码差异</span></div>' + out.join("") + "</div></div>";
  };

  // 待确认从哪里算：权限请求、提问，加上 Claude Code 自己说在等回复的
  K.needsYou = function (s) { return s.state === "need" || s.state === "reply"; };
  K.pendingAll = function (RC) {
    var online = {};
    RC.machines.forEach(function (m) { online[m.id] = m.online; });
    return RC.sessions.filter(function (s) { return online[s.machine] && K.needsYou(s); });
  };
  // 先排会卡住会话的（权限请求、提问），再排等回复的；同一类里当前目标机在前
  K.sortPending = function (list, machine) {
    return list.slice().sort(function (a, b) {
      return ((a.state === "need" ? 0 : 2) + (a.machine === machine ? 0 : 1)) - ((b.state === "need" ? 0 : 2) + (b.machine === machine ? 0 : 1));
    });
  };
  K.machine = function (RC, id) { return RC.machines.filter(function (m) { return m.id === id; })[0]; };
  K.session = function (RC, id) { return RC.sessions.filter(function (s) { return s.id === id; })[0]; };
  K.stateWord = function (s) {
    if (s.state === "need") return s.pending === "question" ? "等你选" : "等你允许";
    if (s.state === "reply") return "等你回复";
    if (s.state === "work") return "工作中";
    if (s.state === "stop") return "已停止";
    return "空闲";
  };

  // 换外观时手机里整个重搭，旧的浮层和左滑状态一起作废
  K.resetOverlays = function () { overlays.length = 0; openRow = null; };

  window.K = K;
})();
</script>
<script>
(function () {
  // 四套外观各是一个模块：挂上时自己搭手机里的外壳（顶栏、底栏、首页头部、弹层），返回页面栈和几个钩子。
  // 目标机、标签页、深浅色、折叠和筛选这些状态放在 S 里四套共用，换外观时原样带过去；主题色每套各记各的。
  var RC = window.RC, root = document.documentElement, phone = document.getElementById("phone");
  var LOOK_LIST = [["clear", "清玻"], ["plate", "印版"], ["tile", "素卡"], ["ink", "浮墨"]];
  var ACC_DEFAULT = { tile: "#007AFF", ink: "#D97757", clear: "#2A45E0" };

    accs: { tile: "#007AFF", ink: "#D97757", clear: "#2A45E0" }, acc: "#007AFF", ink: "black",
    one: false, folded: {}, gitPane: "log", gitDir: "clauderc-app", list: "active", dir: null,
    alwaysAnim: false, relayUrl: "wss://relay.example.com", relayConnected: true, paired: true, plateNav: "float" };
  var api = null, LOOKS = {};
  var A = {
    S: S, phone: phone, LOOK_LIST: LOOK_LIST,
    ACCENTS: { ink: [{ v: "#D97757", name: "陶土" }].concat(RC.accents), clear: [{ v: "#2A45E0", name: "钴蓝" }].concat(RC.accents) },
    statusHTML: '<div class="status"><span>15:12</span><span><span class="ms">signal_cellular_alt</span><span class="ms">wifi</span><span class="ms">battery_full</span></span></div>',
    machines: function () { return !S.paired ? [] : RC.machines.filter(function (m) { return !S.one || m.id === "m1"; }); },
    pendingAll: function () { return !S.paired ? [] : K.pendingAll(RC).filter(function (s) { return !S.one || s.machine === "m1"; }); },
    mini: mini, setAcc: setAcc, revealTheme: revealTheme, switchLook: switchLook, drawReview: drawReview
  };

  /* ---------- 四套共用的业务交互、次级页面与表单逻辑 ---------- */
  (function () {
    var h = K.h, ic = K.icon, esc = K.esc;

    function ensureChat(s) {
      if (!RC.chat[s.id]) RC.chat[s.id] = [{ k: "day", text: "今天" }, { k: "me", text: "继续" }, { k: "ai", text: s.detail || "好的。" }];
      return RC.chat[s.id];
    }
    A.repoFor = function (dir) { return RC.repos[dir] || { isGit: false, commits: [], files: [] }; };
    A.subBar = function (look, title, sub, rightHtml) {
      if (look === "ink") {
        return '<div class="top"><button class="orb" data-act="back">' + ic("arrow_back") + '</button><div class="pill"><span>' + esc(title) + (sub ? ' <span style="color:var(--c-fg3)">· ' + esc(sub) + "</span>" : "") + "</span></div>" + (rightHtml || '<span class="spacer"></span>') + "</div>";
      }
      if (look === "plate") {
        return '<div class="cbar"><div class="cbar-in"><button class="ibtn" data-act="back">' + ic("arrow_back") + '</button><div class="t"><b>' + esc(title) + "</b>" + (sub ? "<span>" + esc(sub) + "</span>" : "") + "</div>" + (rightHtml || "") + '</div><div class="ctxrule" style="--ctx:100%"><i></i></div></div>';
      }
      var barCls = look === "clear" ? "cbar" : "appbar";
      return '<div class="' + barCls + '"><button class="ibtn" data-act="back">' + ic("arrow_back") + '</button><div class="t"><b>' + esc(title) + "</b>" + (sub ? "<span>" + esc(sub) + "</span>" : "") + "</div>" + (rightHtml || "") + "</div>";
    };

    A.previewImgSvg = function (name) {
      var dark = /dark|error/i.test(name || "");
      var bg = dark ? "#14161D" : "#EFEFF4", card = dark ? "#1F222C" : "#FFFFFF", fg = dark ? "#EEF0F6" : "#16171D", acc = dark ? "#D97757" : "#2340A8";
      return '<svg viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg">' +
        '<rect width="320" height="180" fill="' + bg + '"/>' +
        '<rect x="18" y="18" width="128" height="144" rx="14" fill="' + card + '"/>' +
        '<rect x="30" y="34" width="66" height="10" rx="4" fill="' + fg + '" opacity="0.85"/>' +
        '<rect x="30" y="54" width="104" height="28" rx="8" fill="' + acc + '" opacity="0.16"/>' +
        '<rect x="38" y="64" width="54" height="8" rx="3" fill="' + acc + '"/>' +
        '<rect x="30" y="92" width="104" height="10" rx="4" fill="' + fg + '" opacity="0.18"/>' +
        '<rect x="30" y="110" width="84" height="10" rx="4" fill="' + fg + '" opacity="0.14"/>' +
        '<rect x="30" y="128" width="96" height="10" rx="4" fill="' + fg + '" opacity="0.12"/>' +
        '<rect x="160" y="18" width="142" height="144" rx="14" fill="' + card + '"/>' +
        '<path d="M180 34 V146 M180 68 C180 86 202 82 202 100 V120 C202 134 180 130 180 146" fill="none" stroke="' + acc + '" stroke-width="3" stroke-linecap="round"/>' +
        '<circle cx="180" cy="44" r="5" fill="' + card + '" stroke="' + fg + '" stroke-width="2.5"/>' +
        '<circle cx="180" cy="68" r="5" fill="' + card + '" stroke="' + acc + '" stroke-width="2.5"/>' +
        '<circle cx="202" cy="100" r="4.5" fill="' + acc + '"/>' +
        '<circle cx="180" cy="142" r="4.5" fill="' + fg + '"/>' +
        '<rect x="218" y="40" width="68" height="8" rx="3" fill="' + fg + '" opacity="0.7"/>' +
        '<rect x="218" y="64" width="58" height="8" rx="3" fill="' + fg + '" opacity="0.5"/>' +
        '<rect x="218" y="96" width="64" height="8" rx="3" fill="' + acc + '" opacity="0.75"/>' +
        '<rect x="218" y="138" width="52" height="8" rx="3" fill="' + fg + '" opacity="0.4"/>' +
        "</svg>";
    };

    A.openLightbox = function (name, sub, toast) {
      var layer = document.getElementById("layer"); if (!layer) return;
      var lb = h('<div class="lightbox"><div class="lb-top"><button class="lb-btn" data-lb="close">' + ic("close") + '</button><div class="lb-t"><b>' + esc(name) + "</b><span>" + esc(sub || "1280×720 · PNG") + '</span></div></div>' +
        '<div class="lb-stage">' + A.previewImgSvg(name) + '</div>' +
        '<div class="lb-foot"><button class="lb-act" data-lb="save">' + ic("download") + "保存到相册</button></div></div>");
      layer.appendChild(lb);
      requestAnimationFrame(function () { lb.classList.add("on"); });
      function close() {
        K.dropOverlay(close);
        lb.classList.remove("on");
        setTimeout(function () { lb.remove(); }, K.dur(220));
      }
      lb.addEventListener("click", function (e) {
        if (e.target === lb || e.target.closest('[data-lb="close"]')) { close(); return; }
        if (e.target.closest('[data-lb="save"]')) { if (toast) toast("已保存到相册 · " + name); }
      });
      K.pushOverlay(close);
    };

    A.renderMessages = function (s, look) {
      var list = ensureChat(s);
      return list.map(function (x, idx) {
        if (x.k === "day") return '<div class="day">' + esc(x.text) + "</div>";
        if (x.k === "me") {
          var arr = x.imgs || (x.img ? [x.img] : []);
          var imgs = arr.map(function (n) {
            return '<div class="msg-img" data-view-img="' + esc(n) + '">' + ic("image") + "<span>" + esc(n) + "</span></div>";
          }).join("");
          return '<div class="me" data-mi="' + idx + '" title="点此回溯或复制">' + imgs + (x.text ? esc(x.text) : "") + "</div>";
        }
        if (x.k === "ai") return '<div class="ai">' + K.md(x.text) + "</div>";
        if (x.k === "cap") return '<div class="cap">' + esc(x.text) + "</div>";
        if (x.k === "img") {
          return '<div class="chat-img" data-view-img="' + esc(x.name) + '" data-view-sub="' + esc((x.path || x.name) + " · " + (x.size || "1280×720")) + '">' + A.previewImgSvg(x.name) + '<div class="chat-img-cap"><span>' + esc(x.name) + "</span><span>" + esc(x.size || "PNG") + "</span></div></div>";
        }
        if (x.k === "code") return '<div class="code"><div class="code-h">' + esc(x.lang) + '<button class="copy" data-act="copy">' + ic("content_copy", "cp") + ic("check", "ok") + "</button></div><pre>" + esc(x.lines.join("\n")) + "</pre></div>";
        if (x.k === "tools") {
          if (look === "tile") {
            var single = x.items.length === 1;
            return '<div class="toolcard"><div class="tool-h" data-act="tools">' + ic(single ? "edit_note" : "build") + "<span>" + esc(x.sum) + "</span>" + (x.diff ? '<span class="diff">' + esc(x.diff) + "</span>" : "") + ic("chevron_right", "chev") + '</div><div class="tool-list"><div>' + x.items.map(function (t) { return '<div class="tool-item" data-ti="' + esc(t[0] + "|" + t[1]) + '"><b>' + esc(t[0]) + "</b><span>" + esc(t[1]) + "</span></div>"; }).join("") + "</div></div></div>";
          }
          return '<div class="tline"><span class="tline-h" data-act="tools">' + esc(x.sum) + (x.diff ? '<span class="diff">' + esc(x.diff) + "</span>" : "") + ic("chevron_right") + '</span><div class="tline-list"><div>' + x.items.map(function (t) { return '<div class="tline-item" data-ti="' + esc(t[0] + "|" + t[1]) + '"><b>' + esc(t[0]) + "</b><span>" + esc(t[1]) + "</span></div>"; }).join("") + "</div></div></div>";
        }
        return "";
      }).join("");
    };

    A.questionOptsHTML = function (pd) {
      return '<div class="opts">' + pd.options.map(function (o, i) {
        return '<div class="opt' + (i === 0 ? " on" : "") + '" data-act="opt"><i class="radio"></i><div><b>' + esc(o[0]) + "</b><span>" + esc(o[1]) + "</span></div></div>";
      }).join("") +
        '<div class="opt" data-act="opt" data-custom="1"><i class="radio"></i><div><b>其他回答</b><span>自己输入具体要求</span></div></div>' +
        '<div class="opt-custom-box"><input class="opt-inp" placeholder="输入自定义回答..." autocomplete="off"></div></div>';
    };

    A.getChosenAnswer = function (el) {
      var on = el.querySelector(".pend .opt.on");

        return v || "自定义方案";
      }
      var b = on && on.querySelector("b");
      return b ? b.textContent.trim() : "第一项";
    };

    A.wakeBarHTML = function (s) {
      if (s.state !== "stop") return "";
      return '<div class="wake-bar"><span><b>会话已停止</b> · 发送消息或点击唤醒</span><button type="button" class="qbtn pri" data-act="wake">唤醒会话</button></div>';
    };

    A.handleWake = function (ctx, el, s) {
      if (s.state !== "stop") return;
      s.state = "idle"; s.time = "刚刚";
      var wb = el.querySelector(".wake-bar"); if (wb) wb.remove();

    A.openRewindMenu = function (ctx, el, s, msgIndex, fromEl) {
      var list = ensureChat(s), msg = list[msgIndex];
      if (!msg || msg.k !== "me") return;
      var cls = ctx.look === "plate" ? "pmr" : ctx.look === "tile" ? "sitem" : "pm";
      var tx = ctx.look === "tile" ? "l" : "t";

        '<div class="' + cls + '" data-rw="chat">' + (ctx.look === "plate" ? '<i class="box">↶</i>' : ic("history")) + '<div class="' + tx + '"><b>回溯到此处（仅对话）</b><span>截断之后的对话，把这条内容放回输入框</span></div></div>' +
        '<div class="' + cls + '" data-rw="both">' + (ctx.look === "plate" ? '<i class="box solid">↶</i>' : ic("restore")) + '<div class="' + tx + '"><b>回溯对话和代码改动</b><span>同时还原该轮之后修改的文件</span></div></div>' +
        '<div class="' + cls + '" data-rw="copy">' + (ctx.look === "plate" ? '<i class="box">复</i>' : ic("content_copy")) + '<div class="' + tx + '"><b>复制消息内容</b></div></div>';

        m.close(function () {
          if (el.querySelector(".pend")) {
            ctx.openChat(s.id, true);
            var topEl = ctx.stack.top();
            var inp2 = topEl && topEl.querySelector(".field input");
            if (inp2) { inp2.value = origText; inp2.focus(); }

            el.querySelector(".msgs").innerHTML = A.renderMessages(s, ctx.look);

            if (inp) { inp.value = origText; inp.focus(); }

          }
          ctx.refreshAll(false);
          ctx.toast(cap);
        });
      });

    A.handleGitClick = function (ctx, page, dir, e, reRender, switchToLog) {
      var r = A.repoFor(dir);
      var st = e.target.closest("[data-stage]");
      if (st) {
        e.stopPropagation();
        var f = r.files[+st.dataset.stage];
        if (f) { f.staged = !f.staged; reRender(); ctx.toast(f.staged ? "已暂存 " + f.name : "已取消暂存 " + f.name); }
        return true;
      }
      var sta = e.target.closest("[data-stage-all]");
      if (sta) {
        e.stopPropagation();
        var v = sta.dataset.stageAll === "1";
        r.files.forEach(function (x) { x.staged = v; });
        reRender();
        ctx.toast(v ? "已全部暂存" : "已全部取消暂存");
        return true;
      }
      var df = e.target.closest("[data-diff]");
      if (df) {
        var fIdx = +df.dataset.diff, file = r.files[fIdx];
        if (file) A.openDiff(ctx, file.name, (file.staged ? "已暂存" : "未暂存") + " · " + (file.dir || "根目录"), file, { dir: dir, fileIdx: fIdx, onChanged: reRender }, df);
        return true;
      }
      var cm = e.target.closest("[data-commit]");
      if (cm) { A.openCommit(ctx, dir, cm.dataset.commit, cm); return true; }
      if (e.target.closest('[data-act="load-more"]')) {
        if (!r._loadedMore) {
          r._loadedMore = true;
          var tail = r.commits[r.commits.length - 1];
          var extra = JSON.parse(JSON.stringify(RC.olderCommits || []));
          if (tail && extra[0]) tail.p = [extra[0].h];
          r.commits = r.commits.concat(extra);
          reRender();
          ctx.toast("已加载 " + extra.length + " 条更早提交");
        }
        return true;
      }
      var op = e.target.closest("[data-gitop]");
      if (op) {
        var k = op.dataset.gitop;
        if (k === "pull") {
          K.spinBtn(op, 520);
          var had = r.behind || 0;
          r.behind = 0;
          if (RC.dirs[dir]) RC.dirs[dir].behind = 0;
          if (had > 0) {
            var prev = r.commits[0], hNew = Math.random().toString(16).slice(2, 9);
            r.commits.forEach(function (c) { c.refs = (c.refs || []).filter(function (x) { return x.kind !== "head"; }); });
            r.commits.unshift({ h: hNew, lane: 0, p: prev ? [prev.h] : [], s: "同步远端最新改动", body: "从 " + (r.upstream || "origin") + " 拉取 " + had + " 个提交。", a: "周遥", t: "刚刚", timeFull: "今天 刚刚", refs: [{ kind: "head", name: r.branch }], files: [{ x: "M", name: "AGENTS.md", dir: "", add: 6, del: 2, diff: RC.sampleDiffs["AGENTS.md"] }] });
          }
          setTimeout(function () { reRender(); ctx.refreshAll(false); ctx.toast(had ? "已拉取 " + had + " 个提交" : "已是最新"); }, K.dur(360));
        } else if (k === "push") {
          if (!r.ahead) { ctx.toast("没有需要推送的提交"); return true; }
          K.spinBtn(op, 520);
          var n = r.ahead;
          r.ahead = 0;
          if (RC.dirs[dir]) RC.dirs[dir].ahead = 0;
          var upName = r.upstream || ("origin/" + r.branch);
          r.upstream = upName;
          r.commits.forEach(function (c) { c.refs = (c.refs || []).filter(function (x) { return x.name !== upName; }); });
          if (r.commits[0]) r.commits[0].refs.push({ kind: "remote", name: upName });
          setTimeout(function () { reRender(); ctx.refreshAll(false); ctx.toast("已推送 " + n + " 个提交到 " + upName); }, K.dur(380));
        } else if (k === "commit") {
          var stagedCount = r.files.filter(function (x) { return x.staged; }).length;
          if (!stagedCount) { ctx.toast("先点右侧 + 暂存要提交的文件"); return true; }
          A.openCommitDialog(ctx, dir, op, function () { reRender(); if (switchToLog) switchToLog(); });
        }
        return true;
      }
      return false;
    };

    A.openCommit = function (ctx, dir, hash, fromEl) {
      var r = A.repoFor(dir);
      function buildCommitParts(c) {
        var totalAdd = (c.files || []).reduce(function (a, f) { return a + (f.add || 0); }, 0);
        var totalDel = (c.files || []).reduce(function (a, f) { return a + (f.del || 0); }, 0);
        var refsHtml = (c.refs && c.refs.length) ? '<div class="cm-refs">' + c.refs.map(function (rf) {
          var cls = rf.kind === "head" ? " head" : rf.kind === "tag" ? " tag" : "";
          return '<span class="ref-tag' + cls + '">' + esc(rf.kind === "head" ? "HEAD → " + rf.name : rf.name) + "</span>";
        }).join("") + "</div>" : "";
        var parentsHtml = (c.p && c.p.length) ? '<div class="meta-row"><span class="mk">父提交</span><span class="mv">' + c.p.map(function (ph) {
          return '<button class="parent-link" data-parent="' + esc(ph) + '">' + esc(ph) + "</button>";
        }).join("") + "</span></div>" : "";
        var filesHtml = (c.files || []).map(function (f, i) {
          var badge = ctx.look === "plate" ? '<i class="box' + (f.x === "A" ? " solid" : "") + '">' + f.x + "</i>" : '<span class="x x-' + f.x + '">' + f.x + "</span>";
          var stats = f.binary ? '<span style="color:var(--c-fg3)">二进制</span>' : '<span class="a">+' + f.add + "</span>" + (f.del ? '<span class="d">−' + f.del + "</span>" : "");
          return '<div class="file" data-cfile="' + i + '">' + badge + '<div class="n"><b>' + esc(f.name) + "</b><span>" + esc(f.dir || "根目录") + '</span></div><span class="pm pmv">' + stats + "</span></div>";
        }).join("");
        return { totalAdd: totalAdd, totalDel: totalDel, refsHtml: refsHtml, parentsHtml: parentsHtml, filesHtml: filesHtml };
      }
      var c0 = r.commits.filter(function (x) { return x.h === hash; })[0];
      if (!c0) { ctx.toast("找不到提交 " + hash); return; }

      // 浮墨：点时间线提交从该行原地长出悬浮详情面板，支持面板内跳转父提交与打开文件 Diff
      if (ctx.look === "ink") {
        var trail = [c0];
        function renderMorphBody(c) {
          var pt = buildCommitParts(c);
          return '<div class="cm-mp-head">' +
            (trail.length > 1 ? '<button type="button" class="cm-mp-btn" data-cmact="prev" title="上一条提交">' + ic("arrow_back") + "</button>" : "") +
            '<span class="cm-mp-t">' + esc(c.h) + " · " + esc(dir) + '</span>' +
            '<button type="button" class="cm-mp-btn" data-cmact="close" title="关闭">' + ic("close") + "</button></div>" +
            '<div class="cm-mp-sec"><h2 class="cm-subj">' + esc(c.s) + "</h2>" + (c.body ? '<p class="cm-body">' + esc(c.body) + "</p>" : "") + pt.refsHtml + "</div>" +
            '<div class="pn-line"></div><div class="cm-mp-sec">' +
            '<div class="meta-row"><span class="mk">作者</span><span class="mv">' + esc(c.a) + "</span></div>" +
            '<div class="meta-row"><span class="mk">时间</span><span class="mv">' + esc(c.timeFull || c.t) + "</span></div>" + pt.parentsHtml + "</div>" +
            '<div class="pn-sec"><span>' + (c.files || []).length + ' 个改动文件</span><span class="mono" style="margin-left:auto"><span style="color:var(--u-add)">+' + pt.totalAdd + "</span>" + (pt.totalDel ? ' <span style="color:var(--u-del)">−' + pt.totalDel + "</span>" : "") + "</span></div>" +
            '<div class="cm-mp-files">' + pt.filesHtml + "</div>";
        }
        var m = ctx.openModal("", '<div class="cm-mp-root">' + renderMorphBody(c0) + "</div>", fromEl);
        m.dataset.sub = "commit";
        m.dataset.commitHash = c0.h;
        m.addEventListener("click", function (e) {
          var b = e.target.closest("[data-cmact],[data-parent],[data-cfile]"); if (!b) return;
          if (b.dataset.cmact === "close") { m.close(); return; }
          if (b.dataset.cmact === "prev") {
            if (trail.length > 1) {
              trail.pop();
              var prevC = trail[trail.length - 1];
              m.dataset.commitHash = prevC.h;
              m.querySelector(".cm-mp-root").innerHTML = renderMorphBody(prevC);
              m.querySelector(".morph-body").scrollTop = 0;
            }
            return;
          }
          if (b.dataset.parent) {
            var nextC = r.commits.filter(function (x) { return x.h === b.dataset.parent; })[0];
            if (!nextC) { ctx.toast("找不到父提交 " + b.dataset.parent); return; }
            trail.push(nextC);
            m.dataset.commitHash = nextC.h;
            m.querySelector(".cm-mp-root").innerHTML = renderMorphBody(nextC);
            m.querySelector(".morph-body").scrollTop = 0;
            return;
          }
          if (b.dataset.cfile != null) {
            var curC = trail[trail.length - 1];
            var f = (curC.files || [])[+b.dataset.cfile];
            if (f) A.openDiff(ctx, f.name, curC.h + " · " + (f.dir || "根目录"), f, null, b);
          }
        });
        return;
      }

      var pt = buildCommitParts(c0);
      var el = h('<div class="page sub" data-sub="commit">' + A.subBar(ctx.look, c0.h, dir) +
        '<div class="sub-scroll">' +
        '<div class="sub-blk"><h2 class="cm-subj">' + esc(c0.s) + "</h2>" + (c0.body ? '<p class="cm-body">' + esc(c0.body) + "</p>" : "") + pt.refsHtml + "</div>" +
        '<div class="sub-blk"><div class="meta-row"><span class="mk">作者</span><span class="mv">' + esc(c0.a) + '</span></div><div class="meta-row"><span class="mk">时间</span><span class="mv">' + esc(c0.timeFull || c0.t) + "</span></div>" + pt.parentsHtml + "</div>" +
        '<div class="sub-h"><span>' + (c0.files || []).length + ' 个改动文件</span><span class="mono"><span style="color:var(--u-add)">+' + pt.totalAdd + "</span>" + (pt.totalDel ? ' <span style="color:var(--u-del)">−' + pt.totalDel + "</span>" : "") + "</span></div>" +
        '<div class="sub-blk tight">' + pt.filesHtml + "</div></div></div>");
      el.addEventListener("click", function (e) {
        var b = e.target.closest("[data-act],[data-parent],[data-cfile]"); if (!b) return;
        if (b.dataset.act === "back") ctx.stack.pop();
        else if (b.dataset.parent) A.openCommit(ctx, dir, b.dataset.parent);
        else if (b.dataset.cfile != null) {
          var f = c0.files[+b.dataset.cfile];
          if (f) A.openDiff(ctx, f.name, c0.h + " · " + (f.dir || "根目录"), f);
        }
      });
      ctx.stack.push(el);
    };

    A.openDiff = function (ctx, name, sub, fileObj, wt, fromEl) {
      var stats = fileObj.binary ? "" : '<span class="mono" style="padding:0 6px;font-size:12px;white-space:nowrap;flex:none"><span style="color:var(--u-add)">+' + (fileObj.add || 0) + "</span>" + (fileObj.del ? ' <span style="color:var(--u-del)">−' + fileObj.del + "</span>" : "") + "</span>";
      var isImg = /\.(png|jpg|jpeg|webp|svg)$/i.test(name);
      var body = fileObj.binary
        ? '<div class="diff-wrap"><div class="diff-bin">' + (isImg ? '<div style="max-width:260px;margin:0 auto 14px;cursor:pointer" data-dact="view-img">' + A.previewImgSvg(name) + "</div>" : ic("image")) +
          "<b>二进制" + (isImg ? "图片" : "文件") + "已更改</b><div style=\"margin:4px 0 14px\">不显示文本差异内容</div>" +
          (isImg ? '<div class="f-acts" style="max-width:240px;margin:0 auto"><button type="button" class="f-btn" data-dact="view-img">全屏查看</button><button type="button" class="f-btn pri" data-dact="save-img">保存</button></div>' : "") + "</div></div>"
        : '<div class="diff-wrap">' + K.diffHTML(fileObj.diff || RC.sampleDiffs[fileObj.name] || RC.sampleDiffs["AGENTS.md"]) + "</div>";

      function bindDiffActions(hostEl, closeFn) {
        hostEl.addEventListener("click", function (e) {
          if (e.target.closest('[data-act="back"]')) { closeFn(); return; }
          var da = e.target.closest("[data-dact]"); if (!da) return;
          var a = da.dataset.dact;
          if (a === "view-img") A.openLightbox(name, sub, ctx.toast);
          else if (a === "save-img") ctx.toast("已保存到相册 · " + name);
          else if (a === "toggle-stage" && wt) {
            fileObj.staged = !fileObj.staged;
            da.textContent = fileObj.staged ? "取消暂存" : "暂存此文件";
            var subEl = hostEl.querySelector("[data-diff-sub]");
            if (subEl) subEl.textContent = (fileObj.staged ? "已暂存" : "未暂存") + " · " + (fileObj.dir || "根目录");
            if (wt.onChanged) wt.onChanged();
            ctx.toast(fileObj.staged ? "已暂存 " + name : "已取消暂存 " + name);
          } else if (a === "discard" && wt) {
            var r = A.repoFor(wt.dir), ix = r.files.indexOf(fileObj);
            if (ix >= 0) r.files.splice(ix, 1);
            if (wt.onChanged) wt.onChanged();
            closeFn();
            ctx.toast("已放弃 " + name + " 的改动");
          }
        });
      }

      // 浮墨：工作区文件、提交详情里的改动文件、聊天工具编辑记录均原地 morph 浮现差异面板
      if (ctx.look === "ink") {
        var footHtml = wt ? '<div class="morph-foot"><button type="button" class="f-btn" data-dact="discard">放弃改动</button><button type="button" class="f-btn pri" data-dact="toggle-stage">' + (fileObj.staged ? "取消暂存" : "暂存此文件") + "</button></div>" : "";
        var morphHtml = '<div class="cm-mp-head"><div class="cm-mp-title"><b>' + esc(name) + '</b><span data-diff-sub>' + esc(sub) + "</span></div>" + stats + '<button type="button" class="cm-mp-btn" data-act="back" title="关闭">' + ic("close") + "</button></div>" +
          '<div class="morph-scroll">' + body + "</div>" + footHtml;
        var m = ctx.openModal("", morphHtml, fromEl, { box: wt ? { left: 4, right: 4, bottom: 14 } : { left: 4, right: 4, top: 56 }, fromTop: !wt, tall: true });
        m.dataset.sub = "diff";
        bindDiffActions(m, function () { m.close(); });
        return;
      }

      var foot = wt ? '<div class="diff-foot"><button type="button" class="f-btn" data-dact="discard">放弃改动</button><button type="button" class="f-btn pri" data-dact="toggle-stage">' + (fileObj.staged ? "取消暂存" : "暂存此文件") + "</button></div>" : "";
      var el = h('<div class="page sub" data-sub="diff">' + A.subBar(ctx.look, name, sub, stats) + '<div class="sub-scroll" style="' + (wt ? "padding-bottom:88px" : "") + '">' + body + "</div>" + foot + "</div>");
      bindDiffActions(el, function () { ctx.stack.pop(); });
      ctx.stack.push(el);
    };

    A.openTerm = function (ctx, s) {
      var m = K.machine(RC, s.machine);
      var statusLine = s.state === "work"
        ? '<span class="t-warn">✻ 工作中 · ' + esc(s.detail || "执行命令中...") + "</span>"
        : s.state === "need"
        ? '<span class="t-acc">? 等待确认 · ' + esc(s.detail || "") + "</span>"
        : '<span class="t-ok">● 就绪 · 上下文 ' + (s.ctx || 0) + "%</span>";
      var el = h('<div class="page sub term-page" data-sub="term">' + A.subBar(ctx.look, s.title, "终端 · " + s.dir) +
        '<div class="term-body"><div class="term-box" id="tbox">' +
        '<span class="t-dim">╭─ Claude Code ' + esc(m.ver) + " · " + esc(s.model || "Opus 4.6") + "</span>\n" +
        '<span class="t-dim">╰─ ' + esc((RC.dirs[s.dir] && RC.dirs[s.dir].path) || "~/" + s.dir) + (s.branch ? " (" + esc(s.branch) + ")" : "") + "</span>\n\n" +
        statusLine + "\n\n" +
        '<span class="t-dim">────────────────────────────────────</span>\n' +
        '❯ <span class="term-cur"></span></div></div>' +
        '<div class="term-keys">' +
        [["Esc", "esc"], ["Ctrl+C", "ctrlc"], ["Tab", "tab"], ["↑", "up"], ["↓", "down"], ["Enter", "enter"]].map(function (k) {
          return '<button class="tkey" data-tkey="' + k[1] + '">' + k[0] + "</button>";
        }).join("") + "</div></div>");
      var box = el.querySelector("#tbox");
      function appendTerm(htmlLine) {
        var cur = box.querySelector(".term-cur");
        if (cur) cur.remove();
        box.insertAdjacentHTML("beforeend", htmlLine + '\n❯ <span class="term-cur"></span>');
        box.scrollTop = box.scrollHeight;
      }
      el.addEventListener("click", function (e) {
        if (e.target.closest('[data-act="back"]')) { ctx.stack.pop(); return; }
        var k = e.target.closest("[data-tkey]"); if (!k) return;
        var key = k.dataset.tkey;
        if (key === "ctrlc") {
          if (s.state === "work") { s.state = "idle"; s.detail = ""; s.agents = null; ctx.refreshAll(false); }
          appendTerm('<span class="t-warn">^C  Interrupted</span>');
          ctx.toast("已发送 Ctrl+C");
        } else if (key === "esc") {
          appendTerm('<span class="t-dim">[Esc] 已退出当前浮层</span>');
        } else if (key === "tab") {
          var modes = ["默认询问", "自动编辑", "计划模式"];
          s.permMode = modes[(modes.indexOf(s.permMode || "默认询问") + 1) % modes.length];
          appendTerm('<span class="t-acc">[Tab] 权限模式 → ' + esc(s.permMode) + "</span>");
        } else if (key === "up") {
          appendTerm('<span class="t-dim">[↑] 上一条历史命令：go test ./...</span>');
        } else if (key === "down") {
          appendTerm('<span class="t-dim">[↓] 回到最新输入行</span>');
        } else if (key === "enter") {
          appendTerm('<span class="t-ok">[Enter] 已发送确认</span>');
        }
      });
      ctx.stack.push(el);
    };

    A.openAgent = function (ctx, s, idx) {
      var ag = (s.agents || [])[idx]; if (!ag) return;
      var steps = (ag.steps || []).map(function (st) {
        return '<div class="meta-row"><span class="mk">' + esc(st[0]) + '</span><span class="mv mono">' + esc(st[1]) + "</span></div>";
      }).join("");
      var el = h('<div class="page sub" data-sub="agent">' + A.subBar(ctx.look, ag.desc, ag.type + " · " + ag.ago) +
        '<div class="sub-scroll" style="padding-bottom:84px">' +
        '<div class="sub-h"><span>执行轨迹</span><span class="mono">' + (ag.steps || []).length + ' 步</span></div>' +
        '<div class="sub-blk">' + steps + "</div>" +
        '<div class="sub-h"><span>当前发现</span></div>' +
        '<div class="sub-blk"><p class="cm-body" style="margin:0;color:var(--c-fg)">' + esc(ag.note || "正在分析代码上下文...") + "</p></div>" +
        '</div><div class="ro-bar"><i class="dot"></i><span style="flex:1">子代理运行中 · 只读</span><button class="parent-link" data-act="go-parent">看主会话</button></div></div>');
      el.addEventListener("click", function (e) {
        if (e.target.closest('[data-act="back"]')) ctx.stack.pop();
        else if (e.target.closest('[data-act="go-parent"]')) { ctx.stack.pop(); setTimeout(function () { ctx.openChat(s.id); }, K.dur(120)); }
      });
      ctx.stack.push(el);
    };

    A.openNewSession = function (ctx, fromEl) {
      var m = K.machine(RC, S.machine);
      if (!m || !S.paired) { A.openPair(ctx, fromEl); return; }
      var dirKeys = Object.keys(RC.dirs).filter(function (d) { return RC.dirs[d].machine === m.id; });
      if (!dirKeys.length) dirKeys = Object.keys(RC.dirs);
      var selDir = S.dir && dirKeys.indexOf(S.dir) >= 0 ? S.dir : dirKeys[0], selProf = "default", useWt = false;
      var formInner = '<label class="f-lbl">工作目录</label><div class="f-chips" id="ns-dirs">' + dirKeys.map(function (d) {
          return '<button type="button" class="f-chip' + (d === selDir ? " on" : "") + '" data-ndir="' + esc(d) + '">' + esc(d) + "</button>";
        }).join("") + "</div>" +
        '<label class="f-lbl">启动档位</label><div class="f-chips" id="ns-profs">' + Object.keys(RC.profiles).map(function (pid) {
          return '<button type="button" class="f-chip' + (pid === selProf ? " on" : "") + '" data-nprof="' + esc(pid) + '">' + esc(RC.profiles[pid].name) + "</button>";
        }).join("") + "</div>" +
        '<label class="f-lbl">会话标题（可选）</label><input class="f-inp" id="ns-title" placeholder="例如：优化重连超时日志" autocomplete="off">' +
        '<label class="f-lbl">第一条消息</label><input class="f-inp" id="ns-prompt" placeholder="例如：先跑一遍 go test 看看哪里失败" autocomplete="off">' +
        '<div class="f-row"><div><b>独立 worktree 启动</b><span>新建隔离工作区，不干扰当前分支</span></div><button type="button" class="toggle" id="ns-wt"></button></div>';

      function bindForm(container, onDone) {
        container.addEventListener("click", function (e) {
          if (e.target.closest('[data-act="back"]') || e.target.closest('[data-act="cancel"]')) { onDone(null); return; }
          var nd = e.target.closest("[data-ndir]");
          if (nd) { selDir = nd.dataset.ndir; container.querySelectorAll("[data-ndir]").forEach(function (x) { x.classList.toggle("on", x === nd); }); return; }
          var np = e.target.closest("[data-nprof]");
          if (np) { selProf = np.dataset.nprof; container.querySelectorAll("[data-nprof]").forEach(function (x) { x.classList.toggle("on", x === np); }); return; }
          if (e.target.closest("#ns-wt")) { useWt = !useWt; container.querySelector("#ns-wt").classList.toggle("on", useWt); return; }
          if (e.target.closest('[data-act="create"]')) {
            var title = container.querySelector("#ns-title").value.trim();
            var prompt = container.querySelector("#ns-prompt").value.trim() || "先看一下这个目录的最近改动";
            var id = "s" + Math.floor(100 + Math.random() * 899);
            var g = RC.dirs[selDir] || {};
            var ns = {
              id: id, machine: m.id, profile: selProf,
              title: title || prompt.slice(0, 12), dir: selDir, state: "idle", time: "刚刚",
              ctx: 4, branch: useWt ? ("worktree-" + id) : g.branch, detail: "", forkOf: null,
              wt: useWt ? id : null, agents: null, model: "Opus 4.6", permMode: "默认询问"
            };
            RC.sessions.unshift(ns);
            RC.chat[id] = [{ k: "day", text: "刚刚" }, { k: "me", text: prompt }, { k: "ai", text: "好的，我先看一下 `" + selDir + "` 的目录结构和状态。" }];
            ctx.refreshAll(true);
            onDone(id);
            ctx.toast("已创建会话");
          }
        });
      }

      // 浮墨方案 A：从右上角 + 圆钮原地 morph 弹性长出悬浮「新建会话」面板
      if (ctx.look === "ink") {
        var body = '<div class="f-wrap" style="padding:2px 20px 10px">' + formInner +
          '<div class="f-acts"><button type="button" class="f-btn" data-act="cancel">取消</button><button type="button" class="f-btn pri" data-act="create">创建并进入</button></div></div>';
        var modal = ctx.openModal("新建会话 · " + m.name, body, fromEl, { fromTop: true });
        modal.dataset.sub = "new";
        bindForm(modal, function (newId) {
          modal.close(function () { if (newId) ctx.openChat(newId); });
        });
        return;
      }

      var el = h('<div class="page sub" data-sub="new">' + A.subBar(ctx.look, "新建会话", m.name) +
        '<div class="sub-scroll"><div class="sub-blk"><div class="f-wrap" style="padding:0">' + formInner +
        '<div class="f-acts"><button type="button" class="f-btn pri" data-act="create">创建并进入</button></div>' +
        "</div></div></div></div>");
      bindForm(el, function (newId) {
        ctx.stack.pop();
        if (newId) setTimeout(function () { ctx.openChat(newId); }, K.dur(140));
      });
      ctx.stack.push(el);
    };

    A.openPair = function (ctx, fromEl, opts) {
      opts = opts || {};
      function applyPairSuccess() {
        var addedName = "";
        if (!S.paired) {
          S.paired = true;
          addedName = K.machine(RC, "m1").name;
        } else {
          var m3 = K.machine(RC, "m3");
          if (m3 && !m3.online) {
            m3.online = true; m3.checked = "刚刚";
            m3.usage = { five: 9, fiveReset: "23:45", week: 24, weekReset: "周二 11:00" };
            if (!RC.sessions.some(function (x) { return x.machine === "m3"; })) {
              RC.sessions.push({ id: "s30", machine: "m3", profile: "default", title: "Linux 容器巡检", dir: "infra", state: "idle", time: "刚刚", ctx: 11, branch: "main", detail: "", forkOf: null, wt: null, agents: null, model: "Sonnet 4.6", permMode: "默认询问" });
            }
            addedName = m3.name + "（已上线）";
          } else if (!K.machine(RC, "m4")) {
            RC.machines.push({ id: "m4", name: "Mac Studio", short: "S", os: "macOS", online: true, ver: "2.1.330", checked: "刚刚",
              usage: { five: 12, fiveReset: "23:50", week: 19, weekReset: "周二 11:00" } });
            RC.sessions.push({ id: "s40", machine: "m4", profile: "default", title: "性能压测脚本", dir: "relay-svc", state: "idle", time: "刚刚", ctx: 9, branch: "main", detail: "", forkOf: null, wt: null, agents: null, model: "Opus 4.6", permMode: "默认询问" });
            addedName = "Mac Studio";
          } else {
            addedName = "已刷新目标机凭证";
          }
        }
        S.one = false;
        return addedName;
      }

      // 浮墨：侧栏左下扫码圆钮、设置页「配对新的目标机」、右下圆钮均原地 morph 展开极简扫码卡片
      if (ctx.look === "ink") {
        var body = '<div class="qr-morph">' +
          '<div class="qr-vf"><i></i><i></i><i></i><i></i><div class="qr-beam"></div></div>' +
          '<div class="qr-cap" id="qr-cap">二维码 5 分钟内有效，只能用一次</div>' +
          '<div id="qr-fail-slot"></div>' +
          '<div class="f-acts"><button type="button" class="f-btn" data-act="simfail">模拟过期</button><button type="button" class="f-btn pri" data-act="simscan">模拟扫码成功</button></div>' +
          "</div>";
        var modal = ctx.openModal("扫描配对二维码", body, fromEl, { fromTop: opts.fromTop });
        modal.dataset.sub = "pair";
        modal.addEventListener("click", function (e) {
          var t = e.target.closest("[data-act]"); if (!t) return;
          var a = t.dataset.act;
          if (a === "simfail") {
            var beam = modal.querySelector(".qr-beam"); if (beam) beam.style.display = "none";
            modal.querySelector("#qr-cap").textContent = "";

        "</div>" +

          }, K.dur(260));

    A.openBranch = function (ctx, dir, fromEl, onChanged) {
      var r = A.repoFor(dir);
      if (!r.isGit) { ctx.toast("不是 git 仓库"); return; }
      var remoteOnly = (r.branches.remote || []).filter(function (rb) {
        var short = rb.replace(/^origin\//, "");
        return r.branches.local.indexOf(short) < 0;
      });
      var cls = ctx.look === "plate" ? "pmr" : ctx.look === "tile" ? "sitem" : "pm";
      var tx = ctx.look === "tile" ? "l" : "t";
      var body = '<div class="m-sec">本地分支</div>' + r.branches.local.map(function (b) {
        var on = b === r.branch;
        return '<div class="' + cls + '" data-br="' + esc(b) + '">' + (ctx.look === "plate" ? '<i class="box' + (on ? " solid" : "") + '">⑂</i>' : ic("alt_route")) + '<div class="' + tx + '"><b class="mono">' + esc(b) + "</b></div>" + (on ? (ctx.look === "plate" ? "<em>当前</em>" : ic("check", "ok")) : "") + "</div>";
      }).join("") + (remoteOnly.length ? '<div class="m-sec">仅在远端</div>' + remoteOnly.map(function (rb) {
        var short = rb.replace(/^origin\//, "");
        return '<div class="' + cls + '" data-br="' + esc(short) + '" data-remote="1">' + (ctx.look === "plate" ? '<i class="box dash">⑂</i>' : ic("cloud_download")) + '<div class="' + tx + '"><b class="mono">' + esc(rb) + "</b><span>在本地创建 " + esc(short) + " 并跟踪</span></div></div>";
      }).join("") : "") +
        '<div class="f-wrap" style="border-top:1px solid var(--u-div);margin-top:8px;padding-top:10px"><label class="f-lbl" style="margin-top:0">新建分支</label><div style="display:flex;gap:8px"><input class="f-inp mono" id="new-br-name" placeholder="feat/new-branch" autocomplete="off"><button type="button" class="f-btn pri" style="flex:none;padding:0 16px;height:42px" data-mact="new-br">创建</button></div></div>' +
        '<div id="br-busy"></div>';
      var m = ctx.openModal("切换分支 · " + dir, body, fromEl);
      function applySwitch(br, isRemote, isNew) {
        if ((isRemote || isNew) && r.branches.local.indexOf(br) < 0) r.branches.local.unshift(br);
        r.branch = br;
        r.upstream = isNew ? null : ("origin/" + br);
        if (RC.dirs[dir]) RC.dirs[dir].branch = br;
        r.commits.forEach(function (c) { c.refs = (c.refs || []).filter(function (x) { return x.kind !== "head"; }); });
        var target = isNew ? r.commits[0] : (r.commits.filter(function (c) { return (c.refs || []).some(function (x) { return x.name === br; }); })[0] || r.commits[0]);
        if (target) target.refs.unshift({ kind: "head", name: br });
        m.close(function () { if (onChanged) onChanged(); ctx.refreshAll(false); ctx.toast((isNew ? "已新建并切到 " : "已切到分支 ") + br); });
      }
      m.addEventListener("click", function (e) {
        if (e.target.closest('[data-mact="new-br"]')) {
          var nb = m.querySelector("#new-br-name").value.trim().replace(/\s+/g, "-");
          if (!nb) { ctx.toast("先输入新分支名"); m.querySelector("#new-br-name").focus(); return; }
          applySwitch(nb, false, true);
          return;
        }
        var confirmBtn = e.target.closest("[data-force-br]");
        if (confirmBtn) { applySwitch(confirmBtn.dataset.forceBr, confirmBtn.dataset.forceRemote === "1", false); return; }
        if (e.target.closest('[data-mact="cancel-br"]')) { m.querySelector("#br-busy").innerHTML = ""; return; }
        var row = e.target.closest("[data-br]"); if (!row) return;
        var br = row.dataset.br, isRem = row.dataset.remote === "1";
        if (br === r.branch) { m.close(); return; }
        var busy = RC.sessions.filter(function (s) { return s.machine === S.machine && s.dir === dir && s.state === "work"; })[0];
        if (busy) {
          m.querySelector("#br-busy").innerHTML = '<div class="f-wrap" style="border-top:1px solid var(--u-div);margin-top:8px;padding-top:10px"><p class="f-note">会话「' + esc(busy.title) + "」正在 " + esc(dir) + ' 里运行，切换分支可能干扰正在执行的命令。</p><div class="f-acts"><button type="button" class="f-btn" data-mact="cancel-br">取消</button><button type="button" class="f-btn pri" data-force-br="' + esc(br) + '" data-force-remote="' + (isRem ? "1" : "0") + '">仍然切换</button></div></div>';
          return;
        }
        applySwitch(br, isRem, false);
      });
    };

  /* ==================== 印版 ==================== */

    /* ---------- 会话页 ---------- */

    var hex = S.accs[S.look];
    if (hex === ACC_DEFAULT[S.look]) return;
    var c = hex.replace("#", ""), r = parseInt(c.slice(0, 2), 16), g = parseInt(c.slice(2, 4), 16), b = parseInt(c.slice(4, 6), 16);
    st.setProperty("--c-acc", hex);
    st.setProperty("--c-on-acc", (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255 > 0.62 ? "#111111" : "#FFFFFF");
  }
  function setAcc(hex) {
    S.accs[S.look] = hex; S.acc = hex;
    applyAccentVars();
    if (api) api.syncAccent();
    drawReview();
  }
  var darkQuery = matchMedia("(prefers-color-scheme: dark)");
  function resolve(pref) { return pref === "system" ? (darkQuery.matches ? "dark" : "light") : pref; }
  function setTheme(pref) {
    S.themePref = pref; S.theme = resolve(pref);
    root.dataset.theme = S.theme;
    // 印版的油墨和纸每种都配了深浅两套，换深浅色时跟着换
    if (S.look === "plate" && api) api.syncAccent();
    phone.querySelectorAll("[data-mode]").forEach(function (b) { b.classList.toggle("on", b.dataset.mode === pref); });
    drawReview();
  }
  // 深浅色真的变了才画圆扩散；比如系统本来就是浅色时从「浅色」切到「跟随系统」，只换选中项
  function revealTheme(pref, x, y) {
    if (resolve(pref) === S.theme) { setTheme(pref); return; }
    K.reveal(x, y, function () { setTheme(pref); }, phone);
  }
  darkQuery.addEventListener("change", function () { if (S.themePref === "system") setTheme("system"); });

  /* ---------- 换外观 ---------- */
  function mount(k, reopen) {
    K.resetOverlays();
    S.look = k; S.acc = S.accs[k] || null;
    root.dataset.look = k; root.dataset.theme = S.theme; root.dataset.plateNav = S.plateNav;
    applyAccentVars();
    phone.className = "phone settling";
    api = null;
    api = LOOKS[k](A);
    if (reopen && K.session(RC, reopen)) api.openChat(reopen);
    phone.getBoundingClientRect();
    requestAnimationFrame(function () { requestAnimationFrame(function () { phone.classList.remove("settling"); }); });
    history.replaceState(history.state, "", "#" + k);
    drawReview();
  }
  // 换过去停在同一个标签页；聊天页开着时在新样式里重新打开同一个会话
  function switchLook(k, x, y) {
    if (k === S.look || !LOOKS[k]) return;
    var top = api && api.stack.top();
    var reopen = top && top.classList.contains("chat") ? top.dataset.s : null;
    if (x == null) { var r = phone.getBoundingClientRect(); x = r.right - 40; y = r.top + 60; }
    K.reveal(x, y, function () { mount(k, reopen); }, phone);
  }

  /* ---------- 审阅栏 ---------- */
  var LOOK_INFO = {
    tile: { name: "素卡", acc: "主题色", lead: "暖灰底上的白色大圆角块，打开就是这台目标机的概览和会话。", items: [
      "两张便当卡：左边点多瓣圆直接去下一个待确认，按下时形状收成圆",
      "两台以上目标机才出现的目标机条，点了原地切换",
      "聊天页批完待确认，托盘上方提示下一个",
      "托盘里的任务清单展开收起，待确认时托盘留着、只换输入框",
      "会话行左滑露出圆钮；fork 和子代理的画法",
      "git 的分段选择器；设置里换深浅色和主题色的扩散"] },
    ink: { name: "浮墨", acc: "点缀色", lead: "近黑的底，控件悬浮；面板从按下的那颗圆里长出来。", items: [
      "右下圆钮：有待确认时换成数字，点开长出面板，上半跨机待确认、下半目标机",
      "顶部中间的目标机胶囊长出用量和版本；左上圆钮开侧栏，主页缩成卡片推开",
      "「活跃 / 全部」的笔刷色块；底栏指示块整块弹过去，略冲过头再落回",
      "聊天页：输入岛里的任务清单，待确认时那一节长高，主按钮黑白反色",
      "聊天顶部「会话名 · 分支」胶囊长出会话控制；批完提示下一个",
      "设置里换深浅色和点缀色的扩散"] },
    clear: { name: "清玻", acc: "主题色", lead: "白纸面不套卡片，只有浮在内容上的操作层是玻璃。", items: [
      "大标题就是目标机名，点开从顶上落下玻璃面板切换",
      "有待确认时底栏上沿长出玻璃横条，三个首页都有，一点进下一个",
      "底栏保留一边先走一边跟上的拉伸；git 用玻璃分段透镜",
      "聊天底部是贴底整片玻璃，任务清单、工作中、输入框都在里面；待确认时任务清单还在",
      "「允许」是全 APP 唯一的实心钴蓝"] },
      plate: { name: "印版", acc: "油墨", lead: "高对比活字印刷品：默认碳黑油墨配素白棉纸，直角线条与机械压印动效。", items: [
      "刊头：字标切目标机，大数字跨机待确认一步直达；斜纹空槽+实墨框用量条；四角高对比裁切线",
      "默认碳黑高对比配色（深色为深黑纸配亮白墨），设置里可切换 8 种高对比印刷油墨",
      "方形悬浮底栏配机械滑动实墨印块（也可切贴底通栏中出画线）；git/设置右上角双层落章方印",
      "统一机械压印与油墨扫填动效，按按钮层级差异化：主确认双层落章、危险/拒绝朱红反向扫墨、新建 + 旋印、发送 ↑ 上冲、终端机械键帽",
      "git 时间线连续曲线、红绿边框分界线 Diff、提交详情与切换分支；聊天顶栏上下文标尺与 / 命令补全"] }
  };
  var REVIEW_ORDER = ["tile", "ink", "clear", "plate"];
  function byId(id) { return document.getElementById(id); }
  function drawReview() {
    if (!api) return;
    var info = LOOK_INFO[S.look], now = api.accNow();
    byId("rv-look").innerHTML = REVIEW_ORDER.map(function (k) { return '<button class="rbtn' + (k === S.look ? " on" : "") + '" data-look="' + k + '">' + LOOK_INFO[k].name + "</button>"; }).join("");
    byId("rv-lead").textContent = info.lead;
    byId("rv-mode").innerHTML = [["system", "跟随系统"], ["light", "浅色"], ["dark", "深色"]].map(function (x) { return '<button class="rbtn' + (S.themePref === x[0] ? " on" : "") + '" data-rmode="' + x[0] + '">' + x[1] + "</button>"; }).join("");
    byId("rv-acc-h").textContent = info.acc;
    byId("rv-acc").innerHTML = api.swatches().map(function (a) { return '<button class="rsw' + (a.v === now ? " on" : "") + '" data-racc="' + a.v + '" title="' + a.name + '" style="background:' + a.color + '"></button>'; }).join("");
    var s8 = K.session(RC, "s8");
    byId("rv-new").classList.toggle("on", !!(s8 && s8.state === "need"));
    byId("rv-clear").textContent = cleared.length ? "恢复待确认" : "清空待确认";
    byId("rv-one").classList.toggle("on", S.one);
    var pnavBtn = byId("rv-pnav");
    if (pnavBtn) {
      pnavBtn.style.display = S.look === "plate" ? "" : "none";
      pnavBtn.classList.toggle("on", S.plateNav === "float");
      pnavBtn.textContent = S.plateNav === "float" ? "印版底栏：方形悬浮" : "印版底栏：贴底通栏";
    }
    byId("rv-slow").classList.toggle("on", K.slow > 1);
    byId("rv-list").innerHTML = info.items.map(function (x) { return "<li>" + K.esc(x) + "</li>"; }).join("");
  }
  var cleared = [];
  document.querySelector(".review").addEventListener("click", function (e) {
    var t = e.target.closest("button"); if (!t || !api) return;
    if (t.dataset.look) switchLook(t.dataset.look);
    else if (t.dataset.rmode) { var p = phone.getBoundingClientRect(); revealTheme(t.dataset.rmode, p.right - 40, p.top + 60); }
    else if (t.dataset.racc) api.pickAcc(t.dataset.racc);
    else if (t.id === "rv-new") {
      var s = K.session(RC, "s8");
      if (!s) return;
      if (s.state === "need") { s.state = "idle"; s.pending = null; s.detail = ""; }
      else { s.state = "need"; s.pending = "question"; s.detail = "实验数据保留几位小数？"; RC.pendingDetail.s8 = { kind: "question", title: "实验数据保留几位小数？", options: [["两位", "和课本表格一致"], ["三位", "误差分析更细"], ["按原始精度", "不做取舍"]] }; }
      api.refresh(true);
      drawReview();
    }
    else if (t.id === "rv-clear") {
      if (cleared.length) { cleared.forEach(function (c) { var ss = K.session(RC, c[0]); if (ss) { ss.state = c[1]; ss.pending = c[2]; ss.detail = c[3]; } }); cleared = []; }
      else K.pendingAll(RC).forEach(function (s) { cleared.push([s.id, s.state, s.pending, s.detail]); s.state = "idle"; });
      api.refresh(true);
      drawReview();
    }
    else if (t.id === "rv-one") { S.one = !S.one; api.onOne(); drawReview(); }
    else if (t.id === "rv-pnav") {
      S.plateNav = S.plateNav === "float" ? "dock" : "float";
      root.dataset.plateNav = S.plateNav;
      phone.querySelectorAll("[data-pnav]").forEach(function (b) { b.classList.toggle("on", b.dataset.pnav === S.plateNav); });
      drawReview();
      api.toast(S.plateNav === "float" ? "印版底栏：方形悬浮" : "印版底栏：贴底通栏");
    }
    else if (t.id === "rv-slow") { K.setSlow(K.slow === 1); drawReview(); }
    else if (t.id === "rv-reset") {
      window.RC_RESET();
      cleared = [];
      S.machine = "m1"; S.dir = null; S.gitDir = "clauderc-app"; S.paired = true; S.one = false; S.folded = {}; S.relayUrl = "wss://relay.example.com"; S.relayConnected = true; S.plateNav = "float"; S.ink = "black";
      mount(S.look);
      api.toast("已重置演示数据");
    }
  });

  /* ---------- 启动 ---------- */
  // 四套的字体先都取回来，第一次换到某一套时字不会先用系统字顶着再跳
  [["Geist", "会话 abc"], ["Geist Mono", "abc"], ["Onest", "会话 abc"], ["JetBrains Mono", "abc"], ["Roboto", "会话 abc"], ["Roboto Mono", "abc"], ["Archivo", "会话 abc"], ["IBM Plex Mono", "abc"],
    ["Material Symbols Rounded", "forum"], ["Material Symbols Outlined", "forum"], ["Material Symbols Sharp", "forum"]].forEach(function (f) {
    document.fonts.load('16px "' + f[0] + '"', f[1]).catch(function () {});
  });
  // 这一版没换的页面点了弹提示；Esc 和浏览器后退都等于系统返回
  K.todo(phone, function (text) { if (api) api.toast(text); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && api) K.back(api.stack); });
  window.addEventListener("popstate", function () { if (api) K.back(api.stack); });
  var start = location.hash.slice(1);
  if (LOOK_INFO[start]) S.look = start;
  // 浮墨按深色设计，直接打开它时先给深色
  if (S.look === "ink") S.themePref = S.theme = "dark";
  mount(S.look);
})();
</script>
