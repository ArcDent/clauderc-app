<!doctype html>
<html lang="zh-CN" data-look="tile" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clauderc 可操作 demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300..400,0..1,0&family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@24,500,0..1,0&display=block">
<style>
/* 第十四轮：四套样式并进一个 demo。每套的规则都挂在 <html data-look> 上：清玻 clear、印版 plate、素卡 tile、浮墨 ink；
   深浅色挂在 <html data-theme> 上，只有 light 和 dark 两个值，选「跟随系统」时由脚本算好再写上去。
   各套的动画名都带上自己的前缀（tile-spin、plate-print-in），互相不串。下面先是四套共用的几条。 */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
/* 换外观：只给手机屏幕起名，新画面按圆形从点的位置露出来，旧画面留在底下 */
::view-transition-old(phone), ::view-transition-new(phone) { animation: none; mix-blend-mode: normal; }
/* 刚换上新样式的头两帧不播过渡，开着的聊天页直接停在原位，不从右边滑进来 */
.phone.settling, .phone.settling * { transition: none !important; }
</style>
<style>
/* ==================== 素卡（data-look="tile"） ==================== */
/* 素卡：暖灰底上放白色大圆角块，不描边、几乎不投影；数字放大加粗；强调色只上填充，不上文字。
   --c- 开头的变量对应以后 Compose 主题里的颜色，--r- 是圆角，--d- 是时长。 */
:root[data-look="tile"] {
  --c-bg: #EEEDF0;
  --c-card: #FFFFFF;
  --c-well: #F4F4F6;
  --c-line: #E7E6EA;
  --c-fg: #121214;
  --c-fg2: #67666D;
  --c-fg3: #A09FA6;
  --c-acc: #007AFF;
  --c-on-acc: #FFFFFF;
  --c-acc-soft: color-mix(in srgb, var(--c-acc) 14%, var(--c-card));
  --c-ok: #1F9D57;
  --c-add: #1F8A4C;
  --c-del: #D93A3F;
  --c-scrim: rgba(20, 20, 24, 0.28);
  --r-card: 24px;
  --r-inner: 14px;
  --r-tray: 26px;
  --font: "Geist", "Noto Sans SC", "PingFang SC", sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --slow: 1;
  --d-s: calc(160ms * var(--slow));
  --d-m: calc(280ms * var(--slow));
  --d-l: calc(380ms * var(--slow));
  --ease: cubic-bezier(0.2, 0.9, 0.25, 1);
  --spring: cubic-bezier(0.34, 1.4, 0.64, 1);
  --desk: #E4E3E7;
  --desk-fg: #1B1B1F;
  --desk-fg2: #6F6E75;
  --desk-line: #D5D4D9;
}
:root[data-look="tile"][data-theme="dark"] {
  --c-bg: #0F0F11;
  --c-card: #1B1B1F;
  --c-well: #25252A;
  --c-line: #2B2B30;
  --c-fg: #F3F3F5;
  --c-fg2: #A3A2AA;
  --c-fg3: #67666E;
  --c-ok: #3FCB7E;
  --c-add: #5BD08C;
  --c-del: #FF7A7E;
  --c-scrim: rgba(0, 0, 0, 0.55);
  --desk: #08080A;
  --desk-fg: #EDEDF0;
  --desk-fg2: #8B8A92;
  --desk-line: #222227;
  color-scheme: dark;
}
:root[data-look="tile"] body { background: var(--desk); color: var(--desk-fg); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
:root[data-look="tile"] .ms { font-family: "Material Symbols Rounded"; font-weight: normal; font-style: normal; font-size: 22px; line-height: 1; letter-spacing: normal; text-transform: none; white-space: nowrap; direction: ltr; font-variation-settings: "FILL" 0, "wght" 400, "opsz" 24; user-select: none; display: inline-block; }
:root[data-look="tile"] .ms.fill { font-variation-settings: "FILL" 1, "wght" 400, "opsz" 24; }
:root[data-look="tile"] code, :root[data-look="tile"] .mono { font-family: var(--mono); font-size: 0.92em; }

/* 审阅台 */
:root[data-look="tile"] .desk { display: flex; gap: 48px; align-items: center; justify-content: center; min-height: 100%; padding: 32px; }
:root[data-look="tile"] .review { width: 300px; align-self: stretch; display: flex; flex-direction: column; gap: 22px; padding-top: 24px; }
:root[data-look="tile"] .review h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
:root[data-look="tile"] .review .lead { color: var(--desk-fg2); margin: 4px 0 0; }
:root[data-look="tile"] .review h2 { font-size: 12px; font-weight: 600; color: var(--desk-fg2); margin: 0 0 8px; letter-spacing: 0.04em; }
:root[data-look="tile"] .review .rrow { display: flex; flex-wrap: wrap; gap: 8px; }
:root[data-look="tile"] .rbtn { border: 1px solid var(--desk-line); border-radius: 999px; padding: 6px 12px; font-size: 13px; }
:root[data-look="tile"] .rbtn.on { background: var(--desk-fg); color: var(--desk); border-color: var(--desk-fg); }
:root[data-look="tile"] .rsw { width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent; outline: 2px solid transparent; outline-offset: 1px; }
:root[data-look="tile"] .rsw.on { outline-color: var(--desk-fg); }
:root[data-look="tile"] .review ol { margin: 0; padding-left: 18px; color: var(--desk-fg2); }
:root[data-look="tile"] .review ol li { margin: 3px 0; }
:root[data-look="tile"] .review a { color: inherit; }

/* 手机 */
:root[data-look="tile"] .phone { position: relative; width: 390px; height: 844px; border-radius: 52px; background: var(--c-bg); overflow: hidden; color: var(--c-fg);
  box-shadow: 0 0 0 10px #111, 0 0 0 11px #2a2a2e, 0 40px 80px -30px rgba(0,0,0,.45); view-transition-name: phone; isolation: isolate; }
:root[data-look="tile"] .status { position: absolute; inset: 0 0 auto; height: 44px; padding: 14px 30px 0; display: flex; justify-content: space-between; font: 600 15px var(--font); z-index: 50; pointer-events: none; }
:root[data-look="tile"] .status .ms { font-size: 17px; margin-left: 4px; }
:root[data-look="tile"] .screen { position: absolute; inset: 0; }
:root[data-look="tile"] .page { position: absolute; inset: 0; background: var(--c-bg); isolation: isolate; overflow: hidden; transition: transform var(--d-l) var(--ease), filter var(--d-l) var(--ease); will-change: transform; }
:root[data-look="tile"] .page:not(:first-child) { box-shadow: -12px 0 32px -12px rgba(0, 0, 0, 0.22); }
:root[data-look="tile"] .page-in { transform: translateX(100%); }
:root[data-look="tile"] .page-out { transform: translateX(100%); transition-timing-function: cubic-bezier(0.4, 0, 1, 1); transition-duration: calc(300ms * var(--slow)); }
:root[data-look="tile"] .page-under { transform: translateX(-22%); filter: brightness(0.94); }
:root[data-look="tile"] .scroll { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; padding-bottom: 120px; }
:root[data-look="tile"] .scroll::-webkit-scrollbar { display: none; }

/* 大标题：滚动后顶上出现一条小标题栏 */
/* 工具按钮占顶上一行，大标题独占下一行，长机器名也不用折行 */
:root[data-look="tile"] .hero { display: flex; flex-direction: column-reverse; gap: 6px; padding: 48px 16px 14px 20px; }
:root[data-look="tile"] .hero-text { min-width: 0; }
:root[data-look="tile"] .hero .tools { align-self: flex-end; padding-top: 0; min-height: 44px; }
:root[data-look="tile"] .h1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
:root[data-look="tile"] .h1 { margin: 0; font-size: 30px; line-height: 1.15; font-weight: 700; letter-spacing: -0.02em; }
:root[data-look="tile"] .h1-sub { margin-top: 6px; color: var(--c-fg2); font-size: 13px; display: flex; align-items: center; gap: 6px; }
:root[data-look="tile"] .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c-fg3); display: inline-block; flex: none; }
:root[data-look="tile"] .dot.ok { background: var(--c-ok); }
:root[data-look="tile"] .tools { display: flex; gap: 8px; padding-top: 4px; }
:root[data-look="tile"] .pillgroup { display: flex; background: var(--c-card); border-radius: 999px; padding: 0 4px; }
:root[data-look="tile"] .ibtn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; transition: background var(--d-s); }
:root[data-look="tile"] .ibtn:active { background: var(--c-well); }
:root[data-look="tile"] .round { background: var(--c-card); }
:root[data-look="tile"] .minibar { position: absolute; inset: 0 0 auto; height: 96px; padding: 44px 12px 0 20px; display: flex; align-items: center; gap: 8px; background: var(--c-bg); z-index: 5;
  opacity: 0; pointer-events: none; transition: opacity var(--d-s); border-bottom: 1px solid var(--c-line); }
:root[data-look="tile"] .minibar b { flex: 1; font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
:root[data-look="tile"] .page.scrolled .minibar { opacity: 1; pointer-events: auto; }

/* 目标机条：两台以上才出现 */
:root[data-look="tile"] .machines { display: flex; gap: 8px; padding: 2px 16px 14px; overflow-x: auto; scrollbar-width: none; }
:root[data-look="tile"] .machines::-webkit-scrollbar { display: none; }
:root[data-look="tile"] .mchip { flex: none; display: flex; align-items: center; gap: 10px; background: var(--c-card); border-radius: 18px; padding: 8px 10px 8px 14px; min-height: 52px; text-align: left; transition: transform var(--d-s) var(--ease); }
:root[data-look="tile"] .mchip:active { transform: scale(0.97); }
:root[data-look="tile"] .mchip b { display: block; font-size: 14px; font-weight: 600; line-height: 1.25; }
:root[data-look="tile"] .mchip span { display: block; font-size: 12px; color: var(--c-fg2); line-height: 1.3; }
:root[data-look="tile"] .mchip .chk { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: transparent; color: transparent; transform: scale(0.4); opacity: 0; transition: transform var(--d-m) var(--spring), opacity var(--d-s); }
:root[data-look="tile"] .mchip.on .chk { background: var(--c-acc); color: var(--c-on-acc); transform: scale(1); opacity: 1; }
:root[data-look="tile"] .mchip .chk .ms { font-size: 16px; font-weight: 700; }
:root[data-look="tile"] .mchip.off b { color: var(--c-fg2); }
:root[data-look="tile"] .mchip.add { background: var(--c-well); color: var(--c-fg2); padding-right: 14px; }
:root[data-look="tile"] .machines-wrap { display: grid; grid-template-rows: 1fr; transition: grid-template-rows var(--d-m) var(--ease), opacity var(--d-m); }
:root[data-look="tile"] .machines-wrap > div { overflow: hidden; }
:root[data-look="tile"] .machines-wrap.gone { grid-template-rows: 0fr; opacity: 0; }

/* 便当卡：单排两张，随列表滚走 */
:root[data-look="tile"] .bento { display: grid; grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr); gap: 10px; padding: 0 16px 6px; }
:root[data-look="tile"] .tile { background: var(--c-card); border-radius: var(--r-card); padding: 14px 14px 14px 16px; position: relative; min-height: 116px; min-width: 0; }
:root[data-look="tile"] .tile-h { display: flex; align-items: center; gap: 6px; color: var(--c-fg2); font-size: 13px; }
:root[data-look="tile"] .tile-h .ms { font-size: 17px; }
:root[data-look="tile"] .big { font-size: 34px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; display: inline-flex; overflow: hidden; height: 38px; align-items: flex-end; }
:root[data-look="tile"] .big-unit { font-size: 13px; color: var(--c-fg2); margin-left: 4px; font-weight: 500; }
:root[data-look="tile"] .t-pending { cursor: pointer; display: flex; flex-direction: column; }
:root[data-look="tile"] .t-pending .num { margin-top: 10px; display: flex; align-items: baseline; }
:root[data-look="tile"] .t-pending .next { margin-top: auto; font-size: 13px; color: var(--c-fg2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
:root[data-look="tile"] .t-pending .next b { color: var(--c-fg); font-weight: 500; }
:root[data-look="tile"] .cookie { position: absolute; right: 10px; top: 12px; width: 64px; height: 64px; }
:root[data-look="tile"] .cookie svg { width: 100%; height: 100%; overflow: visible; }
:root[data-look="tile"] .cookie .ms { position: absolute; inset: 0; width: 100%; height: 100%; display: grid; place-items: center; color: var(--c-on-acc); font-size: 26px; pointer-events: none; transition: transform var(--d-m) var(--spring); }
:root[data-look="tile"] .cookie-bg { fill: var(--c-acc-soft); }
:root[data-look="tile"] .cookie-fg { fill: var(--c-acc); }
/* git 和设置页右上角：有待确认时一颗小号多瓣圆写着个数，一点进下一个 */
:root[data-look="tile"] .pchip { width: 44px; height: 44px; position: relative; display: grid; place-items: center; animation: tile-nextIn var(--d-l) var(--spring) both; }
:root[data-look="tile"] .pchip svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
:root[data-look="tile"] .pchip svg path { fill: var(--c-acc); }
:root[data-look="tile"] .pchip b { position: relative; color: var(--c-on-acc); font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
:root[data-look="tile"] .t-usage .u { margin-top: 9px; }
:root[data-look="tile"] .t-usage .u + .u { margin-top: 10px; }
:root[data-look="tile"] .u-top { display: flex; align-items: baseline; gap: 6px; }
:root[data-look="tile"] .u-top b { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
:root[data-look="tile"] .u-top span { font-size: 12px; color: var(--c-fg2); }
:root[data-look="tile"] .u-top i { margin-left: auto; font-style: normal; font-size: 12px; color: var(--c-fg3); font-variant-numeric: tabular-nums; }
:root[data-look="tile"] .bar { height: 6px; border-radius: 3px; background: var(--c-well); margin-top: 6px; overflow: hidden; }
:root[data-look="tile"] .bar > i { display: block; height: 100%; border-radius: 3px; background: var(--c-acc); transform-origin: left; transition: width var(--d-l) var(--ease); }
:root[data-look="tile"] .roll { display: inline-block; position: relative; }
:root[data-look="tile"] .roll.up { animation: tile-rollUp var(--d-l) var(--spring); }

/* 会话：档位是小标题，每个目录一张白卡 */
:root[data-look="tile"] .sec { display: flex; align-items: baseline; gap: 8px; margin: 18px 20px 8px; font-size: 13px; font-weight: 600; color: var(--c-fg2); }
:root[data-look="tile"] .sec span { font-weight: 400; color: var(--c-fg3); }
:root[data-look="tile"] .sec .ibtn { width: 28px; height: 28px; margin-left: auto; color: var(--c-fg3); }
:root[data-look="tile"] .sec .ibtn .ms { font-size: 17px; }
:root[data-look="tile"] .card { background: var(--c-card); border-radius: var(--r-card); margin: 0 16px 10px; overflow: hidden; }
:root[data-look="tile"] .dir-head { display: flex; align-items: center; gap: 10px; padding: 14px 10px 10px 16px; cursor: pointer; }
:root[data-look="tile"] .dir-head .ms.f { font-size: 20px; color: var(--c-fg2); }
:root[data-look="tile"] .dir-name { font-weight: 600; font-size: 15px; }
:root[data-look="tile"] .dir-branch { font-family: var(--mono); font-size: 12px; color: var(--c-fg3); white-space: nowrap; }
:root[data-look="tile"] .dir-head .fold { margin-left: auto; color: var(--c-fg3); transition: transform var(--d-m) var(--ease); }
:root[data-look="tile"] .card.folded .fold { transform: rotate(-90deg); }
:root[data-look="tile"] .dir-rows { display: grid; grid-template-rows: 1fr; transition: grid-template-rows var(--d-m) var(--ease); }
:root[data-look="tile"] .dir-rows > div { overflow: hidden; }
:root[data-look="tile"] .card.folded .dir-rows { grid-template-rows: 0fr; }
:root[data-look="tile"] .swipe { position: relative; touch-action: pan-y; }
:root[data-look="tile"] .swipe-acts { position: absolute; inset: 0 0 0 auto; width: 64px; display: grid; place-items: center; }
:root[data-look="tile"] .act { width: 40px; height: 40px; border-radius: 50%; background: var(--c-well); display: grid; place-items: center; color: var(--c-fg); transform: scale(calc(0.5 + var(--swipe, 0) * 0.5)); opacity: var(--swipe, 0); }
:root[data-look="tile"] .act.danger { color: var(--c-del); }
:root[data-look="tile"] .act .ms { font-size: 20px; }
:root[data-look="tile"] .swipe-body { background: var(--c-card); transition: transform var(--d-m) var(--ease); position: relative; }
:root[data-look="tile"] .row { display: flex; align-items: flex-start; gap: 12px; padding: 11px 16px 11px 18px; cursor: pointer; position: relative; }
:root[data-look="tile"] .row::after { content: ""; position: absolute; left: 40px; right: 0; bottom: 0; border-bottom: 1px solid var(--c-line); }
:root[data-look="tile"] .dir-rows .swipe:last-child .row::after { display: none; }
:root[data-look="tile"] .row:active { background: var(--c-well); }
:root[data-look="tile"] .row-text { flex: 1; min-width: 0; }
:root[data-look="tile"] .row-title { font-size: 16px; font-weight: 500; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
:root[data-look="tile"] .row-sub { font-size: 13px; color: var(--c-fg2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.4; margin-top: 1px; }
:root[data-look="tile"] .row-sub b { font-weight: 500; color: var(--c-fg); }
:root[data-look="tile"] .row-sub .mono { font-size: 12px; }
:root[data-look="tile"] .glyph { width: 10px; height: 10px; border-radius: 50%; flex: none; margin-top: 7px; position: relative; border: 1.5px solid var(--c-fg3); }
:root[data-look="tile"] .g-need { border: 0; background: var(--c-acc); box-shadow: 0 0 0 3px var(--c-acc-soft); }
:root[data-look="tile"] .g-reply { border: 2px solid var(--c-acc); }
:root[data-look="tile"] .g-work { border: 2px solid var(--c-acc-soft); border-top-color: var(--c-acc); animation: tile-spin calc(900ms * var(--slow)) linear infinite; }
:root[data-look="tile"] .g-stop { border-radius: 2px; background: var(--c-fg3); border: 0; width: 9px; height: 9px; }
:root[data-look="tile"] .row.fork { padding-left: 36px; }
:root[data-look="tile"] .row.fork::after { left: 58px; }
/* 连线从来源的圆点正下方出发，拐到 fork 的圆点左边：来源圆点中心在行左 23px，fork 圆点左缘在 36px */
:root[data-look="tile"] .row.fork .glyph::before { content: ""; position: absolute; left: -14.5px; bottom: 3px; width: 11px; height: 58px; border-left: 1.5px solid var(--c-line); border-bottom: 1.5px solid var(--c-line); border-bottom-left-radius: 8px; }
:root[data-look="tile"] .swipe:has(.agents) .row::after { display: none; }
:root[data-look="tile"] .agents { position: relative; padding: 0 0 8px; }
:root[data-look="tile"] .dir-rows .swipe:not(:last-child) .agents::after { content: ""; position: absolute; left: 40px; right: 0; bottom: 0; border-bottom: 1px solid var(--c-line); }
:root[data-look="tile"] .agent { position: relative; display: flex; align-items: center; gap: 10px; padding: 4px 16px 4px 37px; font-size: 13px; color: var(--c-fg2); }
:root[data-look="tile"] .agent::before { content: ""; position: absolute; left: 22.25px; top: -14px; width: 11px; height: calc(50% + 14px); border-left: 1.5px dashed color-mix(in srgb, var(--c-fg3) 50%, transparent); border-bottom: 1.5px dashed color-mix(in srgb, var(--c-fg3) 50%, transparent); border-bottom-left-radius: 7px; pointer-events: none; }
:root[data-look="tile"] .agent:first-child::before { top: -28px; height: calc(50% + 28px); }
:root[data-look="tile"] .agent .glyph { margin-top: 0; width: 8px; height: 8px; }
:root[data-look="tile"] .agent > i:last-child { font-style: normal; color: var(--c-fg3); margin-left: auto; white-space: nowrap; flex: none; }
:root[data-look="tile"] .agent span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
:root[data-look="tile"] .swap-in { animation: tile-swapIn var(--d-l) var(--ease) both; }

/* 底栏：居中悬浮圆角药丸，选中项为浅主题色胶囊，底层内容可从四周透出 */

<style>
/* ==================== 印版（data-look="plate"） ==================== */
/* 印版：高对比度单色活字印刷品，默认碳黑油墨配素白棉纸（深色为深黑纸配亮白墨），直角几何与利落机械压印动效。
   统一动效语言：机械压印落章、油墨滚筒扫填、印刷纸页利落推入；特定按钮按层级差异化（主确认落章投影、危险朱红反向扫墨、新建旋转印框、发送箭矢上推、方章盖印）。 */
:root[data-look="plate"] {
  --paper: #F9F8F3;
  --ink: #0B0B0D;
  --c-bg: var(--paper);
  --c-fg: var(--ink);
  --c-fg2: color-mix(in srgb, var(--ink) 84%, var(--paper));
  --c-fg3: color-mix(in srgb, var(--ink) 64%, var(--paper));
  --c-line: color-mix(in srgb, var(--ink) 32%, transparent);
  --c-tint: color-mix(in srgb, var(--ink) 9%, var(--paper));
  --c-danger: #CC111F;
  --c-on-danger: #FFFFFF;
  --c-add-ink: #0B6E3B;
  --font: "Archivo", "Noto Sans SC", "PingFang SC", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --slow: 1;
  --d-xs: calc(110ms * var(--slow));
  --d-s: calc(150ms * var(--slow));
  --d-m: calc(260ms * var(--slow));
  --d-l: calc(360ms * var(--slow));
  --ease: cubic-bezier(0.2, 0.88, 0.24, 1);
  --ease-press: cubic-bezier(0.18, 0.92, 0.26, 1);
  --ease-in: cubic-bezier(0.5, 0, 0.85, 0.35);
  --desk: #E2E0D6;
  --desk-fg: #0D0D10;
  --desk-fg2: #4A4A52;
  --desk-line: #B6B3A6;
}
:root[data-look="plate"][data-theme="dark"] {
  --paper: #0A0A0C;
  --ink: #F5F4EE;
  --c-line: color-mix(in srgb, var(--ink) 36%, transparent);
  --c-tint: color-mix(in srgb, var(--ink) 12%, var(--paper));
  --c-danger: #FF6B6B;
  --c-on-danger: #0A0A0C;
  --c-add-ink: #5EE69D;
  --desk: #050507;
  --desk-fg: #F3F3F7;
  --desk-fg2: #9A9BA6;
  --desk-line: #323440;
  color-scheme: dark;
}
:root[data-look="plate"] body { background: var(--desk); color: var(--desk-fg); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
:root[data-look="plate"] .ms { font-family: "Material Symbols Sharp"; font-weight: normal; font-style: normal; font-size: 22px; line-height: 1; letter-spacing: normal; white-space: nowrap; direction: ltr; font-variation-settings: "FILL" 0, "wght" 500, "opsz" 24; user-select: none; display: inline-block; }

:root[data-look="plate"] code, :root[data-look="plate"] .mono { font-family: var(--mono); font-size: 0.9em; }

:root[data-look="plate"] .desk { display: flex; gap: 48px; align-items: center; justify-content: center; min-height: 100%; padding: 32px; }

:root[data-look="plate"] .review .lead { color: var(--desk-fg2); margin: 4px 0 0; }
:root[data-look="plate"] .review h2 { font-size: 12px; font-weight: 800; color: var(--desk-fg2); margin: 0 0 8px; letter-spacing: 0.05em; }
:root[data-look="plate"] .rrow { display: flex; flex-wrap: wrap; gap: 8px; }
:root[data-look="plate"] .rbtn { border: 1.5px solid var(--desk-fg); padding: 5px 12px; font-size: 13px; font-weight: 700; color: var(--desk-fg);
  background: linear-gradient(var(--desk-fg), var(--desk-fg)) left / 0 100% no-repeat;
  transition: background-size var(--d-m) var(--ease-press), color var(--d-xs), transform var(--d-xs) var(--ease-press), box-shadow var(--d-xs) var(--ease-press); }

:root[data-look="plate"] .rbtn:active { background-size: 100% 100%; color: var(--desk); transform: translate(1.5px, 1.5px); box-shadow: none; }
:root[data-look="plate"] .rbtn.on { background: var(--desk-fg); color: var(--desk); border-color: var(--desk-fg); box-shadow: 2px 2px 0 0 var(--desk), 3.5px 3.5px 0 0 var(--desk-fg); }
:root[data-look="plate"] .rbtn.on:active { transform: translate(2px, 2px); box-shadow: none; }
:root[data-look="plate"] .rsw { width: 24px; height: 24px; outline: 1.5px solid transparent; outline-offset: 3px; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--desk-fg) 26%, transparent); transition: outline-color var(--d-s), transform var(--d-xs) var(--ease-press); }
:root[data-look="plate"] .rsw:active { transform: translate(1px, 1px); }
:root[data-look="plate"] .rsw.on { outline-color: var(--desk-fg); outline-width: 2px; }
:root[data-look="plate"] .review ol { margin: 0; padding-left: 18px; color: var(--desk-fg2); }
:root[data-look="plate"] .review ol li { margin: 3px 0; }
:root[data-look="plate"] .review a { color: inherit; }

:root[data-look="plate"] .phone { position: relative; width: 390px; height: 844px; border-radius: 52px; background: var(--c-bg); overflow: hidden; color: var(--c-fg);
  box-shadow: 0 0 0 10px #111, 0 0 0 11px #2a2a2e, 0 40px 80px -30px rgba(0,0,0,.45); view-transition-name: phone; isolation: isolate; }
:root[data-look="plate"] .status { position: absolute; inset: 0 0 auto; height: 44px; padding: 14px 30px 0; display: flex; justify-content: space-between; font: 700 15px var(--font); z-index: 60; pointer-events: none; }
:root[data-look="plate"] .status .ms { font-size: 17px; margin-left: 4px; }
:root[data-look="plate"] .screen { position: absolute; inset: 0; }
/* 印版整页切页：以 2px 实墨裁切边推入，无软阴影模糊，底层纸页轻退保留清晰阅读层次 */
:root[data-look="plate"] .page { position: absolute; inset: 0; background: var(--c-bg); isolation: isolate; overflow: hidden; transition: transform var(--d-l) var(--ease-press), opacity var(--d-l) var(--ease-press); will-change: transform; }
:root[data-look="plate"] .page:not(:first-child) { box-shadow: -2px 0 0 0 var(--c-fg), -10px 0 0 0 color-mix(in srgb, var(--paper) 45%, transparent); }
:root[data-look="plate"] .page-in { transform: translateX(100%); }
:root[data-look="plate"] .page-out { transform: translateX(100%); transition-timing-function: var(--ease-in); transition-duration: calc(250ms * var(--slow)); }
:root[data-look="plate"] .page-under { transform: translateX(-16%); opacity: 0.86; }
:root[data-look="plate"] .scroll { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; padding-bottom: 112px; }
:root[data-look="plate"] .scroll::-webkit-scrollbar { display: none; }

/* 动画：线条只写起点，终点就是元素本来的样子 */
:root[data-look="plate"] .print { animation: plate-print-in calc(420ms * var(--slow)) var(--ease-press) backwards; }

/* 裁切线：刊头和面板四角各两道短线，高对比实墨从角落向外画出 */
:root[data-look="plate"] .crop { position: absolute; inset: 0; pointer-events: none; color: color-mix(in srgb, var(--ink) 74%, transparent); }
:root[data-look="plate"] .crop i { position: absolute; width: 12px; height: 12px; }
:root[data-look="plate"] .crop i:nth-child(1) { top: -1px; left: -1px; }
:root[data-look="plate"] .crop i:nth-child(2) { top: -1px; right: -1px; transform: scaleX(-1); --dl: 60ms; }
:root[data-look="plate"] .crop i:nth-child(3) { bottom: -1px; left: -1px; transform: scaleY(-1); --dl: 120ms; }
:root[data-look="plate"] .crop i:nth-child(4) { bottom: -1px; right: -1px; transform: scale(-1); --dl: 180ms; }
:root[data-look="plate"] .crop i::before, :root[data-look="plate"] .crop i::after { content: ""; position: absolute; background: currentColor; }
:root[data-look="plate"] .crop i::before { top: 0; right: 100%; width: 10px; height: 1.5px; transform-origin: right; animation: plate-draw-x calc(540ms * var(--slow)) calc(var(--dl, 0ms) * var(--slow)) var(--ease-press) backwards; }
:root[data-look="plate"] .crop i::after { bottom: 100%; left: 0; width: 1.5px; height: 10px; transform-origin: bottom; animation: plate-draw-y calc(540ms * var(--slow)) calc(var(--dl, 0ms) * var(--slow)) var(--ease-press) backwards; }

/* 刊头 */
:root[data-look="plate"] .mast { position: relative; margin: 54px 18px 6px; padding: 14px 14px 16px; }
:root[data-look="plate"] .mast-top { display: flex; align-items: center; gap: 8px; }
:root[data-look="plate"] .wordmark { display: inline-flex; align-items: center; gap: 8px; font-weight: 800; font-size: 15px; min-width: 0; padding: 4px 6px 4px 0; transition: transform var(--d-xs) var(--ease-press), background var(--d-xs); }
:root[data-look="plate"] .wordmark:hover { background: var(--c-tint); }

:root[data-look="plate"] .wordmark .ms { font-size: 20px; transition: transform var(--d-m) var(--ease-press); }
:root[data-look="plate"] .wordmark.open .ms { transform: rotate(180deg); }
:root[data-look="plate"] .box { width: 22px; height: 22px; border: 1.5px solid currentColor; display: inline-grid; place-items: center; font-size: 12px; font-weight: 800; flex: none; line-height: 1; transition: background var(--d-xs), color var(--d-xs); }
:root[data-look="plate"] .box.dash { border-style: dashed; }
:root[data-look="plate"] .box.solid { background: var(--c-fg); color: var(--c-bg); border-color: var(--c-fg); }

/* 差异化按钮 A：方框印章钮（新建会话 + / git 刷新），带硬朗实墨偏移投影，按下压平+墨色扫填，+ 号同步 90° 机械旋印 */
:root[data-look="plate"] .sqbtn { width: 36px; height: 36px; border: 1.5px solid var(--c-fg); background-color: var(--c-bg); color: var(--c-fg); display: grid; place-items: center; flex: none; margin-left: auto;
  box-shadow: 2px 2px 0 0 var(--c-fg);
  background-image: linear-gradient(var(--c-fg), var(--c-fg)); background-position: left; background-size: 0 100%; background-repeat: no-repeat;
  transition: background-size var(--d-m) var(--ease-press), color var(--d-xs), transform var(--d-xs) var(--ease-press), box-shadow var(--d-xs) var(--ease-press), background-color var(--d-xs); }
:root[data-look="plate"] .sqbtn:hover { background-color: var(--c-tint); }
:root[data-look="plate"] .sqbtn:active { background-size: 100% 100%; color: var(--c-bg); transform: translate(2px, 2px); box-shadow: 0 0 0 0 var(--c-fg); }
:root[data-look="plate"] .sqbtn .ms { font-size: 20px; transition: transform var(--d-m) var(--ease-press); }
:root[data-look="plate"] .sqbtn[data-act="new"]:hover .ms, :root[data-look="plate"] .sqbtn[data-act="new"]:active .ms { transform: rotate(90deg); }

/* 差异化按钮 B：刊头待确认块（巨号活字数字 + 右侧推进箭头，整体可点并带油墨底纹与箭头推印反馈） */
:root[data-look="plate"] .headline { display: flex; align-items: flex-end; gap: 14px; margin: 14px -8px 0; padding: 8px; cursor: pointer; position: relative;
  transition: background var(--d-s) var(--ease-press), transform var(--d-xs) var(--ease-press); }
:root[data-look="plate"] .headline:hover { background: var(--c-tint); }
:root[data-look="plate"] .headline:active { background: color-mix(in srgb, var(--ink) 14%, var(--paper)); transform: translate(1px, 1px); }
:root[data-look="plate"] .bignum { position: relative; font-size: 58px; font-weight: 800; line-height: 0.86; letter-spacing: -0.045em; font-variant-numeric: tabular-nums; padding-right: 2px; }
:root[data-look="plate"] .bignum.zero { color: var(--c-fg3); }
:root[data-look="plate"] .bignum sup { position: absolute; top: -2px; left: calc(100% + 4px); font-size: 11px; font-weight: 800; letter-spacing: 0.02em; line-height: 1; color: var(--c-fg2); white-space: nowrap; }
:root[data-look="plate"] .bignum .d { display: inline-block; }

:root[data-look="plate"] .nextl { flex: 1; min-width: 0; padding-bottom: 2px; border-left: 2px solid var(--c-fg); padding-left: 12px; margin-left: 46px; }

:root[data-look="plate"] .nextl b { display: block; font-size: 15.5px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
:root[data-look="plate"] .nextl span:not(.ms) { display: flex; align-items: center; gap: 4px; font-family: var(--mono); font-size: 11.5px; color: var(--c-fg2); white-space: nowrap; overflow: hidden; }
:root[data-look="plate"] .nextl span .ms { font-size: 16px; color: var(--c-fg); transition: transform var(--d-m) var(--ease-press); }
:root[data-look="plate"] .headline:hover .nextl span .ms { transform: translateX(3px); }
:root[data-look="plate"] .headline:active .nextl span .ms { transform: translateX(7px); }

/* 用量条：高对比度直角实墨框条，1.5px 实墨边框 + 细斜纹空槽 + 实心油墨填充 */
:root[data-look="plate"] .ruler { margin: 11px -6px 0; padding: 4px 6px; cursor: pointer; transition: background var(--d-xs), transform var(--d-xs) var(--ease-press); }
:root[data-look="plate"] .ruler:hover { background: var(--c-tint); }
:root[data-look="plate"] .ruler:active { background: color-mix(in srgb, var(--ink) 14%, var(--paper)); transform: translate(1px, 1px); }
:root[data-look="plate"] .ruler-h { display: flex; align-items: baseline; gap: 8px; font-size: 12px; font-weight: 800; }
:root[data-look="plate"] .ruler-h span:not(.ms) { margin-left: auto; font-family: var(--mono); font-size: 11.5px; font-weight: 600; color: var(--c-fg2); }
:root[data-look="plate"] .ruler-h b { font-family: var(--mono); font-weight: 800; color: var(--c-fg); }
:root[data-look="plate"] .pbar { position: relative; height: 9px; margin-top: 6px; border: 1.5px solid var(--c-fg);
  background: repeating-linear-gradient(-45deg, color-mix(in srgb, var(--ink) 14%, transparent) 0 2px, transparent 2px 5px), var(--c-bg); overflow: hidden; }
:root[data-look="plate"] .pbar > i { position: absolute; inset: 0 auto 0 0; width: var(--pct); display: block; background: var(--c-fg); transition: width var(--d-l) var(--ease-press); animation: plate-print-in calc(680ms * var(--slow)) calc(140ms * var(--slow)) var(--ease-press) backwards; }

/* 索引表 */
:root[data-look="plate"] .sec { display: flex; align-items: center; gap: 8px; margin: 22px 18px 0; padding-bottom: 6px; font-size: 12px; font-weight: 800; letter-spacing: 0.04em; position: relative; }
:root[data-look="plate"] .sec::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--c-fg); transform-origin: left; animation: plate-draw-x calc(640ms * var(--slow)) var(--ease-press) backwards; }
:root[data-look="plate"] .sec span:not(.ms) { font-weight: 600; color: var(--c-fg2); font-family: var(--mono); letter-spacing: 0; }
:root[data-look="plate"] .sec .ibtn { margin-left: auto; width: 28px; height: 28px; }
:root[data-look="plate"] .sec .ibtn .ms { font-size: 16px; }
/* 统一工具图标钮：平时安静无框，悬停显细框底纹，按下反墨压印 */
:root[data-look="plate"] .ibtn { width: 40px; height: 40px; display: grid; place-items: center; flex: none; border: 1.5px solid transparent; color: var(--c-fg);
  transition: background var(--d-xs), color var(--d-xs), border-color var(--d-xs), transform var(--d-xs) var(--ease-press); }
:root[data-look="plate"] .ibtn:hover { background: var(--c-tint); border-color: var(--c-line); }
:root[data-look="plate"] .ibtn:active { background: var(--c-fg); color: var(--c-bg); border-color: var(--c-fg); transform: translate(1px, 1px); }

:root[data-look="plate"] .dir { display: flex; align-items: baseline; gap: 10px; padding: 14px 12px 6px 18px; cursor: pointer; position: relative; transition: background var(--d-xs); }
:root[data-look="plate"] .dir:hover { background: var(--c-tint); }
:root[data-look="plate"] .dir:active { background: color-mix(in srgb, var(--ink) 14%, var(--paper)); }
:root[data-look="plate"] .dir::before { content: ""; position: absolute; left: 18px; right: 18px; top: 4px; height: 1.5px; background: var(--c-fg); transform-origin: left; animation: plate-draw-x calc(640ms * var(--slow)) var(--ease-press) backwards; }
/* 紧跟在档位标题下面的第一个目录不再画上方的线，避免和标题的粗线叠成双线 */
:root[data-look="plate"] .sec + .grp .dir::before { display: none; }
:root[data-look="plate"] .dir .no { font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--c-fg2); }
:root[data-look="plate"] .dir b { font-size: 15px; font-weight: 800; }
:root[data-look="plate"] .dir span:not(.ms) { font-family: var(--mono); font-size: 11.5px; font-weight: 600; color: var(--c-fg2); }
:root[data-look="plate"] .dir .fold { margin-left: auto; font-size: 18px; color: var(--c-fg); transition: transform var(--d-m) var(--ease-press); align-self: center; }
:root[data-look="plate"] .grp.folded .fold { transform: rotate(-90deg); }
:root[data-look="plate"] .rows { display: grid; grid-template-rows: 1fr; transition: grid-template-rows var(--d-m) var(--ease-press); }
:root[data-look="plate"] .rows > div { overflow: hidden; }
:root[data-look="plate"] .grp.folded .rows { grid-template-rows: 0fr; }
:root[data-look="plate"] .swipe { position: relative; touch-action: pan-y; }
:root[data-look="plate"] .swipe-acts { position: absolute; inset: 0 18px 0 auto; width: 56px; display: grid; place-items: center end; }
:root[data-look="plate"] .act { width: 38px; height: 38px; border: 1.5px solid currentColor; display: grid; place-items: center; background: var(--c-bg); color: var(--c-fg);
  box-shadow: 2px 2px 0 0 currentColor; transform: scale(calc(0.6 + var(--swipe, 0) * 0.4)); opacity: var(--swipe, 0);
  transition: background var(--d-xs), color var(--d-xs), box-shadow var(--d-xs); }
:root[data-look="plate"] .act:active { background: var(--c-fg); color: var(--c-bg); box-shadow: none; }
:root[data-look="plate"] .act.danger { color: var(--c-danger); }
:root[data-look="plate"] .act.danger:active { background: var(--c-danger); color: var(--c-on-danger); box-shadow: none; }
:root[data-look="plate"] .act .ms { font-size: 19px; }
:root[data-look="plate"] .swipe-body { background: var(--c-bg); transition: transform var(--d-m) var(--ease-press); }
:root[data-look="plate"] .row { display: flex; align-items: flex-start; gap: 12px; margin: 0 18px; padding: 10px 4px 10px 4px; cursor: pointer; position: relative; border-bottom: 1px solid var(--c-line);
  transition: background var(--d-xs), padding-left var(--d-xs) var(--ease-press), box-shadow var(--d-xs); }
:root[data-look="plate"] .row:hover { background: var(--c-tint); }
:root[data-look="plate"] .row:active { background: color-mix(in srgb, var(--ink) 14%, var(--paper)); box-shadow: inset 3px 0 0 0 var(--c-fg); padding-left: 8px; }
:root[data-look="plate"] .row::before { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--c-fg); transform: scaleX(0); }
:root[data-look="plate"] .row.inkin { animation: plate-ink-in calc(420ms * var(--slow)) calc(var(--i) * 20ms * var(--slow)) var(--ease-press) backwards; }
:root[data-look="plate"] .row.inkin::before { animation: plate-line-pass calc(600ms * var(--slow)) calc(var(--i) * 20ms * var(--slow)) var(--ease-press) backwards; }
:root[data-look="plate"] .row-text { flex: 1; min-width: 0; }
:root[data-look="plate"] .row-title { font-size: 16px; font-weight: 700; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.005em; }
:root[data-look="plate"] .row-sub { font-size: 13px; color: var(--c-fg2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
:root[data-look="plate"] .row-sub .mono { font-size: 12px; }
:root[data-look="plate"] .row-sub b { color: var(--c-fg); font-weight: 800; }
/* 状态记号：高对比实墨方框，靠实、空、虚框、描边转动区分 */
:root[data-look="plate"] .mark { width: 11px; height: 11px; flex: none; margin-top: 6px; border: 1.5px solid var(--c-fg); position: relative; }
:root[data-look="plate"] .m-need { background: var(--c-fg); border-color: var(--c-fg); }
:root[data-look="plate"] .m-reply { border: 1.5px solid var(--c-fg); }
:root[data-look="plate"] .m-reply::after { content: ""; position: absolute; inset: 2px; background: var(--c-fg); }
:root[data-look="plate"] .m-work { border: 1.5px solid var(--c-fg); }
:root[data-look="plate"] .m-work::after { content: ""; position: absolute; left: 1px; right: 1px; top: 3.5px; height: 1.5px; background: var(--c-fg); animation: plate-spin calc(1.2s * var(--slow)) steps(8) infinite; }
:root[data-look="plate"] .m-stop { background: transparent; border: 1.5px dashed var(--c-fg3); }
:root[data-look="plate"] .row.fork { padding-left: 24px; }
:root[data-look="plate"] .row.fork:active { padding-left: 28px; }
:root[data-look="plate"] .row.fork .mark::before { content: ""; position: absolute; left: -15.5px; bottom: 4px; width: 12px; height: 52px; border-left: 1.5px solid var(--c-fg2); border-bottom: 1.5px solid var(--c-fg2); }
:root[data-look="plate"] .swipe:has(.agents) .row { border-bottom: 0; }
:root[data-look="plate"] .agents { position: relative; padding-bottom: 8px; margin: 0 18px; border-bottom: 1px solid var(--c-line); }
:root[data-look="plate"] .agent { position: relative; display: flex; align-items: center; gap: 10px; padding: 4px 4px 4px 25.5px; font-size: 12.5px; color: var(--c-fg2); transition: background var(--d-xs), box-shadow var(--d-xs); }
:root[data-look="plate"] .agent:hover { background: var(--c-tint); }
:root[data-look="plate"] .agent:active { opacity: 1; background: color-mix(in srgb, var(--ink) 14%, var(--paper)); box-shadow: inset 2px 0 0 0 var(--c-fg); }
:root[data-look="plate"] .agent::before { content: ""; position: absolute; left: 9px; top: -14px; width: 13.5px; height: calc(50% + 14px); border-left: 1.5px dashed var(--c-fg2); border-bottom: 1.5px dashed var(--c-fg2); pointer-events: none; }
:root[data-look="plate"] .agent:first-child::before { top: -26px; height: calc(50% + 26px); }
:root[data-look="plate"] .agent .mark { margin-top: 0; width: 8px; height: 8px; }
:root[data-look="plate"] .agent .mark.m-work::after { top: 2px; }
:root[data-look="plate"] .agent span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
:root[data-look="plate"] .agent > i:last-child { font-style: normal; margin-left: auto; white-space: nowrap; flex: none; font-family: var(--mono); font-size: 11px; }

/* 差异化组件：底栏（方形悬浮默认带机械滑动实墨印块 .nav-ind；贴底通栏保留中出画线） */
:root[data-look="plate"] .nav { position: absolute; inset: auto 0 0; height: 82px; background: var(--c-bg); border-top: 2px solid var(--c-fg); display: flex; padding: 6px 18px 0; z-index: 20;
  transition: transform var(--d-l) var(--ease-press), opacity var(--d-m), left var(--d-m) var(--ease-press), right var(--d-m) var(--ease-press), bottom var(--d-m) var(--ease-press), box-shadow var(--d-m) var(--ease-press); }
:root[data-look="plate"] .nav.hide { transform: translateY(115%); opacity: 0; pointer-events: none; }
:root[data-look="plate"] .nav-ind { display: none; }
:root[data-look="plate"] .tab { flex: 1; height: 46px; font-size: 15px; font-weight: 800; color: var(--c-fg2); position: relative; z-index: 1; transition: color var(--d-s), background var(--d-xs), transform var(--d-xs) var(--ease-press); }
:root[data-look="plate"] .tab:hover:not(.on) { color: var(--c-fg); background: var(--c-tint); }
:root[data-look="plate"] .tab:active { transform: translateY(1px); }
:root[data-look="plate"] .tab span { position: relative; padding: 6px 2px 8px; }
:root[data-look="plate"] .tab span::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2.5px; background: currentColor; transform: scaleX(0); transition: transform calc(340ms * var(--slow)) var(--ease-press); }
:root[data-look="plate"] .tab.on { color: var(--c-fg); }
:root[data-look="plate"] .tab.on span::after { transform: scaleX(1); }
:root[data-look="plate"] .tab .pd { position: absolute; top: 2px; right: -9px; width: 6px; height: 6px; background: var(--c-fg); transform: scale(0); transition: transform var(--d-m) var(--ease-press), background var(--d-s); }
:root[data-look="plate"] .tab .pd.on { transform: scale(1); }
:root[data-look="plate"][data-plate-nav="float"] .nav { inset: auto 24px 20px; height: 54px; padding: 4px; gap: 4px; border: 2px solid var(--c-fg); box-shadow: 4px 4px 0 0 var(--c-fg); align-items: stretch; }
:root[data-look="plate"][data-plate-nav="float"] .nav.hide { transform: translateY(110px); }
:root[data-look="plate"][data-plate-nav="float"] .nav-ind { display: block; position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc((100% - 16px) / 3); background: var(--c-fg); z-index: 0; pointer-events: none;
  transform: translateX(calc(var(--tab-i, 0) * 100% + var(--tab-i, 0) * 4px));
  transition: transform calc(280ms * var(--slow)) var(--ease-press); }
:root[data-look="plate"][data-plate-nav="float"] .tab { height: auto; font-size: 14px; display: flex; align-items: center; justify-content: center; background: transparent; }
:root[data-look="plate"][data-plate-nav="float"] .tab:hover:not(.on) { background: var(--c-tint); }
:root[data-look="plate"][data-plate-nav="float"] .tab span { padding: 2px 4px; }
:root[data-look="plate"][data-plate-nav="float"] .tab span::after { display: none; }
:root[data-look="plate"][data-plate-nav="float"] .tab.on { color: var(--c-bg); }
:root[data-look="plate"][data-plate-nav="float"] .tab.on .pd { background: var(--c-bg); }
:root[data-look="plate"][data-plate-nav="float"] .toast { bottom: 90px; }
:root[data-look="plate"] .sw-in { animation: plate-ink-in var(--d-m) var(--ease-press) backwards; }
:root[data-look="plate"] .sw-in-r { animation: plate-tab-r var(--d-m) var(--ease-press) backwards; }
:root[data-look="plate"] .sw-in-l { animation: plate-tab-l var(--d-m) var(--ease-press) backwards; }

/* 差异化按钮 C：git 与设置页右上角的实墨方章（双层偏移印版投影 + 盖印压平 + 箭头右冲） */
:root[data-look="plate"] .stamp { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px 0 12px; background: var(--c-fg); color: var(--c-bg); border: 1.5px solid var(--c-fg); font-weight: 800; font-size: 13px; margin-left: auto;
  box-shadow: 2.5px 2.5px 0 0 var(--c-bg), 4px 4px 0 0 var(--c-fg);
  animation: plate-print-in calc(440ms * var(--slow)) var(--ease-press) backwards;
  transition: transform var(--d-xs) var(--ease-press), box-shadow var(--d-xs) var(--ease-press); }
:root[data-look="plate"] .stamp:hover .ms { transform: translateX(3px); }
:root[data-look="plate"] .stamp:active { transform: translate(2.5px, 2.5px); box-shadow: 0 0 0 0 var(--c-bg), 0 0 0 0 var(--c-fg); }
:root[data-look="plate"] .stamp:active .ms { transform: translateX(6px); }
:root[data-look="plate"] .stamp b { font-family: var(--mono); font-size: 14px; }
:root[data-look="plate"] .stamp .ms { font-size: 17px; transition: transform var(--d-m) var(--ease-press); }
:root[data-look="plate"] .phead { display: flex; align-items: center; gap: 10px; padding: 54px 18px 0; min-height: 96px; }
:root[data-look="plate"] .ptitle { padding: 6px 18px 4px; }
:root[data-look="plate"] .ptitle h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.025em; line-height: 1.1; }
:root[data-look="plate"] .ptitle .where { display: inline-flex; align-items: center; gap: 2px; margin-top: 6px; padding: 2px 4px 2px 0; font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--c-fg2); cursor: pointer;
  border-bottom: 1.5px solid transparent; transition: color var(--d-xs), border-color var(--d-xs), background var(--d-xs); }
:root[data-look="plate"] .ptitle .where:hover { color: var(--c-fg); border-bottom-color: var(--c-fg); }
:root[data-look="plate"] .ptitle .where:active { background: var(--c-fg); color: var(--c-bg); padding: 2px 6px; }
:root[data-look="plate"] .ptitle .where .ms { font-size: 16px; }

/* 纸条弹窗：从左印出、向右抹掉，带 5px 硬朗实墨投影与高对比斜纹遮罩 */
:root[data-look="plate"] .scrim { position: absolute; inset: 0; z-index: 40; opacity: 0; transition: opacity var(--d-m);
  background: repeating-linear-gradient(-45deg, color-mix(in srgb, var(--ink) 20%, transparent) 0 1px, transparent 1px 7px), color-mix(in srgb, var(--paper) 86%, transparent); }
:root[data-look="plate"] .scrim.on { opacity: 1; }
:root[data-look="plate"] .slip { position: absolute; left: 14px; right: 14px; bottom: 18px; z-index: 41; background: var(--c-bg); border: 2px solid var(--c-fg); box-shadow: 5px 5px 0 0 var(--c-fg); padding: 16px 0 10px;
  clip-path: inset(-20px calc(100% + 20px) -20px -20px); transition: clip-path calc(440ms * var(--slow)) var(--ease-press); }
:root[data-look="plate"] .slip.on { clip-path: inset(-20px); }
:root[data-look="plate"] .slip.out { clip-path: inset(-20px -20px -20px calc(100% + 20px)); transition: clip-path calc(220ms * var(--slow)) var(--ease-in); }
:root[data-look="plate"] .slip h4 { position: relative; margin: 0 16px 6px; padding-bottom: 10px; font-size: 18px; font-weight: 800; letter-spacing: -0.01em; }
:root[data-look="plate"] .slip h4::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--c-fg); transform-origin: left; transform: scaleX(0); transition: transform calc(560ms * var(--slow)) calc(100ms * var(--slow)) var(--ease-press); }
:root[data-look="plate"] .slip.on h4::after { transform: none; }
:root[data-look="plate"] .slip .crop i { width: 12px; height: 12px; }
:root[data-look="plate"] .pmr { display: flex; align-items: center; gap: 12px; margin: 0 16px; padding: 11px 4px; border-bottom: 1px solid var(--c-line); cursor: pointer;
  transition: background var(--d-xs), padding-left var(--d-xs) var(--ease-press), box-shadow var(--d-xs); }
:root[data-look="plate"] .pmr:last-child { border-bottom: 0; }
:root[data-look="plate"] .pmr:hover { background: var(--c-tint); }
:root[data-look="plate"] .pmr:active { background: color-mix(in srgb, var(--ink) 14%, var(--paper)); box-shadow: inset 3px 0 0 0 var(--c-fg); padding-left: 8px; }
:root[data-look="plate"] .pmr .t { flex: 1; min-width: 0; }
:root[data-look="plate"] .pmr b { display: block; font-weight: 800; font-size: 15px; }
:root[data-look="plate"] .pmr span:not(.ms) { display: block; font-size: 12px; color: var(--c-fg2); font-family: var(--mono); }
:root[data-look="plate"] .pmr em { font-style: normal; font-size: 12px; font-weight: 800; }
:root[data-look="plate"] .slip .lines > * { animation: plate-ink-in calc(380ms * var(--slow)) calc((var(--i, 0) * 28ms + 90ms) * var(--slow)) var(--ease-press) backwards; }

/* 聊天 */
:root[data-look="plate"] .cbar { position: absolute; inset: 0 0 auto; z-index: 6; padding: 44px 6px 0 2px; background: var(--c-bg); }
:root[data-look="plate"] .cbar-in { display: flex; align-items: center; gap: 2px; height: 52px; }
:root[data-look="plate"] .cbar .t { flex: 1; min-width: 0; padding: 4px 6px; transition: background var(--d-xs); }
:root[data-look="plate"] .cbar .t[data-act="ctl"]:hover { background: var(--c-tint); }
:root[data-look="plate"] .cbar .t[data-act="ctl"]:active { background: color-mix(in srgb, var(--ink) 14%, var(--paper)); }
:root[data-look="plate"] .cbar .t b { display: flex; align-items: center; gap: 3px; font-size: 17px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.3; min-width: 0; }
:root[data-look="plate"] .cbar .t b > span:not(.ms) { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
:root[data-look="plate"] .cbar .t > span { display: block; font-size: 11.5px; color: var(--c-fg2); font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* 顶栏下沿这道线就是上下文的比例尺：实墨占上下文用掉的比例 */
:root[data-look="plate"] .ctxrule { position: relative; height: 2px; background: var(--c-line); }
:root[data-look="plate"] .ctxrule i { position: absolute; left: 0; top: 0; bottom: 0; width: var(--ctx); background: var(--c-fg); transform-origin: left; animation: plate-draw-x calc(700ms * var(--slow)) calc(140ms * var(--slow)) var(--ease-press) backwards; }
:root[data-look="plate"] .msgs { padding: 116px 18px 20px; display: flex; flex-direction: column; gap: 14px; }
:root[data-look="plate"] .day { align-self: center; font-size: 11px; font-weight: 600; color: var(--c-fg2); font-family: var(--mono); }
:root[data-look="plate"] .me { align-self: flex-end; max-width: 82%; border: 1.5px solid var(--c-fg); box-shadow: 3px 3px 0 0 var(--c-fg); background: var(--c-bg); padding: 9px 13px; font-size: 15.5px; line-height: 1.5; white-space: pre-wrap; font-weight: 600;
  transition: transform var(--d-xs) var(--ease-press), box-shadow var(--d-xs) var(--ease-press), background var(--d-xs); }
:root[data-look="plate"] .me[data-mi]:hover { background: var(--c-tint); }
:root[data-look="plate"] .me[data-mi]:active { opacity: 1; transform: translate(2px, 2px); box-shadow: 1px 1px 0 0 var(--c-fg); }
:root[data-look="plate"] .ai { font-size: 16px; line-height: 1.7; }
:root[data-look="plate"] .ai code { font-family: var(--mono); font-size: 0.86em; border-bottom: 1.5px solid var(--c-line); padding: 0 2px; }
:root[data-look="plate"] .tline { font-size: 13px; color: var(--c-fg2); }
:root[data-look="plate"] .tline-h { display: inline-flex; align-items: center; gap: 6px; padding: 2px 4px 2px 0; cursor: pointer; font-weight: 700; color: var(--c-fg); transition: background var(--d-xs); }
:root[data-look="plate"] .tline-h:hover { background: var(--c-tint); }
:root[data-look="plate"] .tline-h .diff { font-family: var(--mono); font-size: 12px; color: var(--c-fg); font-weight: 700; }
:root[data-look="plate"] .tline-h .ms { font-size: 17px; transition: transform var(--d-m) var(--ease-press); }
:root[data-look="plate"] .tline.open .tline-h .ms { transform: rotate(90deg); }
:root[data-look="plate"] .tline-list { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--d-m) var(--ease-press); }
:root[data-look="plate"] .tline-list > div { overflow: hidden; }
:root[data-look="plate"] .tline.open .tline-list { grid-template-rows: 1fr; }
:root[data-look="plate"] .tline-item { display: flex; gap: 10px; padding: 5px 4px; border-bottom: 1px solid var(--c-line); transition: background var(--d-xs), box-shadow var(--d-xs); }
:root[data-look="plate"] .tline-item:first-child { margin-top: 6px; }
:root[data-look="plate"] .tline-item[data-ti]:hover { background: var(--c-tint); }
:root[data-look="plate"] .tline-item[data-ti]:active { opacity: 1; background: color-mix(in srgb, var(--ink) 14%, var(--paper)); box-shadow: inset 2px 0 0 0 var(--c-fg); }
:root[data-look="plate"] .tline-item b { font-weight: 800; flex: none; color: var(--c-fg); }
:root[data-look="plate"] .tline-item span:not(.ms) { font-family: var(--mono); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
:root[data-look="plate"] .code { border: 1px solid var(--c-line); border-left: 3px solid var(--c-fg); background: var(--c-tint); padding: 8px 0 10px; }
:root[data-look="plate"] .code-h { display: flex; align-items: center; padding: 0 6px 2px 14px; font-size: 11.5px; font-weight: 700; color: var(--c-fg2); font-family: var(--mono); }
:root[data-look="plate"] .copy { margin-left: auto; width: 32px; height: 32px; display: grid; place-items: center; position: relative; border: 1.5px solid transparent; transition: border-color var(--d-xs), background var(--d-xs), color var(--d-xs); }
:root[data-look="plate"] .copy:hover { border-color: var(--c-line); background: var(--c-bg); }
:root[data-look="plate"] .copy:active { border-color: var(--c-fg); background: var(--c-fg); color: var(--c-bg); }
:root[data-look="plate"] .copy .ms { position: absolute; font-size: 18px; transition: opacity var(--d-s), clip-path var(--d-m) var(--ease-press); }
:root[data-look="plate"] .copy .ok { opacity: 0; clip-path: inset(0 100% 0 0); }
:root[data-look="plate"] .copy.done .cp { opacity: 0; clip-path: inset(0 0 0 100%); }
:root[data-look="plate"] .copy.done .ok { opacity: 1; clip-path: inset(0); }
:root[data-look="plate"] .code pre { margin: 0; padding: 0 14px; font: 12.5px/1.65 var(--mono); overflow-x: auto; tab-size: 4; }
:root[data-look="plate"] .cap { align-self: center; font-size: 11.5px; font-weight: 600; color: var(--c-fg2); font-family: var(--mono); }

/* 聊天底部：2px 线封顶的纸面，任务清单、工作中、输入行分行，行间清晰细线 */
:root[data-look="plate"] .dock { position: absolute; inset: auto 0 0; z-index: 8; background: var(--c-bg); }
:root[data-look="plate"] .next-slot { position: absolute; left: 18px; right: 18px; bottom: 100%; padding-bottom: 10px; display: flex; justify-content: flex-end; pointer-events: none; }
:root[data-look="plate"] .nextbar { pointer-events: auto; display: flex; align-items: center; gap: 10px; border: 2px solid var(--c-fg); background: var(--c-bg); box-shadow: 3px 3px 0 0 var(--c-fg); padding: 8px 10px 8px 12px; font-size: 13.5px; font-weight: 700; cursor: pointer; max-width: 100%;
  animation: plate-print-in calc(420ms * var(--slow)) var(--ease-press) backwards;
  transition: transform var(--d-xs) var(--ease-press), box-shadow var(--d-xs) var(--ease-press), background var(--d-xs); }
:root[data-look="plate"] .nextbar:hover { background: var(--c-tint); }
:root[data-look="plate"] .nextbar:hover .ms { transform: translateX(3px); }
:root[data-look="plate"] .nextbar:active { transform: translate(2.5px, 2.5px); box-shadow: 0 0 0 0 var(--c-fg); }
:root[data-look="plate"] .nextbar:active .ms { transform: translateX(6px); }
:root[data-look="plate"] .nextbar::before { content: ""; width: 7px; height: 7px; background: var(--c-fg); flex: none; }
:root[data-look="plate"] .nextbar span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
:root[data-look="plate"] .nextbar em { font-style: normal; color: var(--c-fg2); font-weight: 600; }
:root[data-look="plate"] .nextbar .ms { font-size: 17px; transition: transform var(--d-m) var(--ease-press); }
:root[data-look="plate"] .plate { border-top: 2px solid var(--c-fg); padding: 0 18px 22px; transition: border-top-width var(--d-s); }
:root[data-look="plate"] .plate.pending { border-top-width: 2.5px; }
:root[data-look="plate"] .isec { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--d-m) var(--ease-press); }
:root[data-look="plate"] .isec > div { overflow: hidden; }
:root[data-look="plate"] .isec.on { grid-template-rows: 1fr; }
:root[data-look="plate"] .isec.on + .isec.on > div { border-top: 1px solid var(--c-line); }
:root[data-look="plate"] .tasks-h { display: flex; align-items: center; gap: 10px; padding: 10px 4px; font-size: 13.5px; font-weight: 700; cursor: pointer; transition: background var(--d-xs); }
:root[data-look="plate"] .tasks-h:hover { background: var(--c-tint); }
:root[data-look="plate"] .tasks-h .mark { margin-top: 0; }
:root[data-look="plate"] .tasks-h span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
:root[data-look="plate"] .tasks-h i { font-style: normal; font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--c-fg2); }
:root[data-look="plate"] .tasks-h .ms { font-size: 18px; transition: transform var(--d-m) var(--ease-press); }
:root[data-look="plate"] .tasks.open .tasks-h .ms { transform: rotate(180deg); }
:root[data-look="plate"] .task-list { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--d-m) var(--ease-press); }
:root[data-look="plate"] .task-list > div { overflow: hidden; }
:root[data-look="plate"] .tasks.open .task-list { grid-template-rows: 1fr; }
:root[data-look="plate"] .task { display: flex; align-items: center; gap: 10px; padding: 7px 4px; font-size: 13.5px; border-bottom: 1px solid var(--c-line); transition: background var(--d-xs), box-shadow var(--d-xs); }
:root[data-look="plate"] .task:first-child { padding-top: 10px; }
:root[data-look="plate"] .task[data-task-i]:hover { background: var(--c-tint); }
:root[data-look="plate"] .task[data-task-i]:active { opacity: 1; background: color-mix(in srgb, var(--ink) 14%, var(--paper)); box-shadow: inset 2px 0 0 0 var(--c-fg); }
:root[data-look="plate"] .task .mark { margin-top: 0; width: 10px; height: 10px; }
:root[data-look="plate"] .task.done { color: var(--c-fg3); }
:root[data-look="plate"] .task.done .mark { border-color: var(--c-fg3); background: none; }
:root[data-look="plate"] .task.done .mark::after { content: ""; position: absolute; left: -2px; right: -2px; top: 3.5px; height: 1.5px; background: var(--c-fg3); transform: rotate(-45deg); }
:root[data-look="plate"] .working { display: flex; align-items: center; gap: 8px; padding: 9px 4px 9px 0; font-size: 13.5px; font-weight: 700; }
:root[data-look="plate"] .working .spark { display: inline-block; animation: plate-spin calc(2.4s * var(--slow)) steps(12) infinite; }
:root[data-look="plate"] .working i { font-style: normal; font-family: var(--mono); font-size: 12px; color: var(--c-fg2); font-weight: 600; }
/* 差异化按钮 D：工作中中断钮（朱红警戒框 + 脉冲外框 + 按下朱红反墨压印） */
:root[data-look="plate"] .working .stop { margin-left: auto; width: 32px; height: 32px; border: 1.5px solid var(--c-danger); background: var(--c-bg); display: grid; place-items: center; position: relative;
  box-shadow: 2px 2px 0 0 var(--c-danger);
  transition: background var(--d-xs), transform var(--d-xs) var(--ease-press), box-shadow var(--d-xs) var(--ease-press); }
:root[data-look="plate"] .working .stop::before { content: ""; position: absolute; inset: -4px; border: 1px solid var(--c-danger); opacity: 0; animation: plate-danger-pulse calc(1.8s * var(--slow)) ease-out infinite; pointer-events: none; }
:root[data-look="plate"] .working .stop::after { content: ""; width: 10px; height: 10px; background: var(--c-danger); transition: background var(--d-xs); }
:root[data-look="plate"] .working .stop:hover { background: color-mix(in srgb, var(--c-danger) 10%, var(--c-bg)); }
:root[data-look="plate"] .working .stop:active { background: var(--c-danger); transform: translate(2px, 2px); box-shadow: 0 0 0 0 var(--c-danger); }
:root[data-look="plate"] .working .stop:active::after { background: var(--c-on-danger); }

/* 差异化按钮 E：输入区附图 +（自下而上墨色扫填+旋转）与发送 ↑（实墨落章+箭矢上冲） */
:root[data-look="plate"] .input { display: flex; align-items: flex-end; gap: 12px; padding: 12px 4px 4px 0; }
:root[data-look="plate"] .input .plus { width: 36px; height: 36px; border: 1.5px solid var(--c-fg); background-color: var(--c-bg); color: var(--c-fg); display: grid; place-items: center; flex: none;
  background-image: linear-gradient(var(--c-fg), var(--c-fg)); background-position: bottom; background-size: 100% 0; background-repeat: no-repeat;
  transition: background-size var(--d-m) var(--ease-press), color var(--d-xs), transform var(--d-xs) var(--ease-press), background-color var(--d-xs); }
:root[data-look="plate"] .input .plus:hover { background-color: var(--c-tint); }
:root[data-look="plate"] .input .plus:active { background-size: 100% 100%; color: var(--c-bg); transform: translate(1px, 1px); }
