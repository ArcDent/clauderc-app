<!doctype html>
<html lang="zh-CN" data-look="tile" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clauderc 可操作 demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300..400,0..1,0&family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@24,500,0..1,0&display=block">
<style>
/* 第十四轮：四套样式并进一个 demo。每套的规则都挂在 <html data-look> 上：清玻 clear、印版 plate、素卡 tile、浮墨 ink；
   深浅色挂在 <html data-theme> 上，只有 light 和 dark 两个值，选「跟随系统」时由脚本算好再写上去。
   各套的动画名都带上自己的前缀（tile-spin、plate-print-in），互相不串。下面先是四套共用的几条。 */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
/* 换外观：只给手机屏幕起名，新画面按圆形从点的位置露出来，旧画面留在底下 */
::view-transition-old(phone), ::view-transition-new(phone) { animation: none; mix-blend-mode: normal; }
/* 刚换上新样式的头两帧不播过渡，开着的聊天页直接停在原位，不从右边滑进来 */
.phone.settling, .phone.settling * { transition: none !important; }
</style>
<style>
/* ==================== 素卡（data-look="tile"） ==================== */
/* 素卡：暖灰底上放白色大圆角块，不描边、几乎不投影；数字放大加粗；强调色只上填充，不上文字。
   --c- 开头的变量对应以后 Compose 主题里的颜色，--r- 是圆角，--d- 是时长。 */
:root[data-look="tile"] {
  --c-bg: #EEEDF0;
  --c-card: #FFFFFF;
  --c-well: #F4F4F6;
  --c-line: #E7E6EA;
  --c-fg: #121214;
  --c-fg2: #67666D;
  --c-fg3: #A09FA6;
  --c-acc: #007AFF;
  --c-on-acc: #FFFFFF;
  --c-acc-soft: color-mix(in srgb, var(--c-acc) 14%, var(--c-card));
  --c-ok: #1F9D57;
  --c-add: #1F8A4C;
  --c-del: #D93A3F;
  --c-scrim: rgba(20, 20, 24, 0.28);
  --r-card: 24px;
  --r-inner: 14px;
  --r-tray: 26px;
  --font: "Geist", "Noto Sans SC", "PingFang SC", sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --slow: 1;
  --d-s: calc(160ms * var(--slow));
  --d-m: calc(280ms * var(--slow));
  --d-l: calc(380ms * var(--slow));
  --ease: cubic-bezier(0.2, 0.9, 0.25, 1);
  --spring: cubic-bezier(0.34, 1.4, 0.64, 1);
  --desk: #E4E3E7;
  --desk-fg: #1B1B1F;
  --desk-fg2: #6F6E75;
  --desk-line: #D5D4D9;
}
:root[data-look="tile"][data-theme="dark"] {
  --c-bg: #0F0F11;
  --c-card: #1B1B1F;
  --c-well: #25252A;
  --c-line: #2B2B30;
  --c-fg: #F3F3F5;
  --c-fg2: #A3A2AA;
  --c-fg3: #67666E;
  --c-ok: #3FCB7E;
  --c-add: #5BD08C;
  --c-del: #FF7A7E;
  --c-scrim: rgba(0, 0, 0, 0.55);
  --desk: #08080A;
  --desk-fg: #EDEDF0;
  --desk-fg2: #8B8A92;
  --desk-line: #222227;
  color-scheme: dark;
}
:root[data-look="tile"] body { background: var(--desk); color: var(--desk-fg); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
:root[data-look="tile"] .ms { font-family: "Material Symbols Rounded"; font-weight: normal; font-style: normal; font-size: 22px; line-height: 1; letter-spacing: normal; text-transform: none; white-space: nowrap; direction: ltr; font-variation-settings: "FILL" 0, "wght" 400, "opsz" 24; user-select: none; display: inline-block; }
:root[data-look="tile"] .ms.fill { font-variation-settings: "FILL" 1, "wght" 400, "opsz" 24; }
:root[data-look="tile"] code, :root[data-look="tile"] .mono { font-family: var(--mono); font-size: 0.92em; }

/* 审阅台 */
:root[data-look="tile"] .desk { display: flex; gap: 48px; align-items: center; justify-content: center; min-height: 100%; padding: 32px; }
:root[data-look="tile"] .review { width: 300px; align-self: stretch; display: flex; flex-direction: column; gap: 22px; padding-top: 24px; }
:root[data-look="tile"] .review h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
:root[data-look="tile"] .review .lead { color: var(--desk-fg2); margin: 4px 0 0; }
:root[data-look="tile"] .review h2 { font-size: 12px; font-weight: 600; color: var(--desk-fg2); margin: 0 0 8px; letter-spacing: 0.04em; }
:root[data-look="tile"] .review .rrow { display: flex; flex-wrap: wrap; gap: 8px; }
:root[data-look="tile"] .rbtn { border: 1px solid var(--desk-line); border-radius: 999px; padding: 6px 12px; font-size: 13px; }
:root[data-look="tile"] .rbtn.on { background: var(--desk-fg); color: var(--desk); border-color: var(--desk-fg); }
:root[data-look="tile"] .rsw { width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent; outline: 2px solid transparent; outline-offset: 1px; }
:root[data-look="tile"] .rsw.on { outline-color: var(--desk-fg); }
:root[data-look="tile"] .review ol { margin: 0; padding-left: 18px; color: var(--desk-fg2); }
:root[data-look="tile"] .review ol li { margin: 3px 0; }
:root[data-look="tile"] .review a { color: inherit; }

/* 手机 */
:root[data-look="tile"] .phone { position: relative; width: 390px; height: 844px; border-radius: 52px; background: var(--c-bg); overflow: hidden; color: var(--c-fg);
  box-shadow: 0 0 0 10px #111, 0 0 0 11px #2a2a2e, 0 40px 80px -30px rgba(0,0,0,.45); view-transition-name: phone; isolation: isolate; }
:root[data-look="tile"] .status { position: absolute; inset: 0 0 auto; height: 44px; padding: 14px 30px 0; display: flex; justify-content: space-between; font: 600 15px var(--font); z-index: 50; pointer-events: none; }
:root[data-look="tile"] .status .ms { font-size: 17px; margin-left: 4px; }
:root[data-look="tile"] .screen { position: absolute; inset: 0; }
:root[data-look="tile"] .page { position: absolute; inset: 0; background: var(--c-bg); transition: transform var(--d-l) var(--ease), filter var(--d-l) var(--ease); will-change: transform; }
:root[data-look="tile"] .page-in { transform: translateX(100%); }
:root[data-look="tile"] .page-out { transform: translateX(100%); transition-timing-function: cubic-bezier(0.4, 0, 1, 1); transition-duration: calc(300ms * var(--slow)); }
:root[data-look="tile"] .page-under { transform: translateX(-22%); filter: brightness(0.94); }
:root[data-look="tile"] .scroll { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; padding-bottom: 120px; }
:root[data-look="tile"] .scroll::-webkit-scrollbar { display: none; }

/* 大标题：滚动后顶上出现一条小标题栏 */
/* 工具按钮占顶上一行，大标题独占下一行，长机器名也不用折行 */
:root[data-look="tile"] .hero { display: flex; flex-direction: column-reverse; gap: 6px; padding: 48px 16px 14px 20px; }
:root[data-look="tile"] .hero-text { min-width: 0; }
:root[data-look="tile"] .hero .tools { align-self: flex-end; padding-top: 0; min-height: 44px; }
:root[data-look="tile"] .h1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
:root[data-look="tile"] .h1 { margin: 0; font-size: 30px; line-height: 1.15; font-weight: 700; letter-spacing: -0.02em; }
:root[data-look="tile"] .h1-sub { margin-top: 6px; color: var(--c-fg2); font-size: 13px; display: flex; align-items: center; gap: 6px; }
:root[data-look="tile"] .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c-fg3); display: inline-block; flex: none; }
:root[data-look="tile"] .dot.ok { background: var(--c-ok); }
:root[data-look="tile"] .tools { display: flex; gap: 8px; padding-top: 4px; }
:root[data-look="tile"] .pillgroup { display: flex; background: var(--c-card); border-radius: 999px; padding: 0 4px; }
:root[data-look="tile"] .ibtn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; transition: background var(--d-s); }
:root[data-look="tile"] .ibtn:active { background: var(--c-well); }
:root[data-look="tile"] .round { background: var(--c-card); }
:root[data-look="tile"] .minibar { position: absolute; inset: 0 0 auto; height: 96px; padding: 44px 12px 0 20px; display: flex; align-items: center; gap: 8px; background: var(--c-bg); z-index: 5;
  opacity: 0; pointer-events: none; transition: opacity var(--d-s); border-bottom: 1px solid var(--c-line); }
:root[data-look="tile"] .minibar b { flex: 1; font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
:root[data-look="tile"] .page.scrolled .minibar { opacity: 1; pointer-events: auto; }

/* 目标机条：两台以上才出现 */
:root[data-look="tile"] .machines { display: flex; gap: 8px; padding: 2px 16px 14px; overflow-x: auto; scrollbar-width: none; }
:root[data-look="tile"] .machines::-webkit-scrollbar { display: none; }
:root[data-look="tile"] .mchip { flex: none; display: flex; align-items: center; gap: 10px; background: var(--c-card); border-radius: 18px; padding: 8px 10px 8px 14px; min-height: 52px; text-align: left; transition: transform var(--d-s) var(--ease); }
:root[data-look="tile"] .mchip:active { transform: scale(0.97); }
:root[data-look="tile"] .mchip b { display: block; font-size: 14px; font-weight: 600; line-height: 1.25; }
:root[data-look="tile"] .mchip span { display: block; font-size: 12px; color: var(--c-fg2); line-height: 1.3; }
:root[data-look="tile"] .mchip .chk { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: transparent; color: transparent; transform: scale(0.4); opacity: 0; transition: transform var(--d-m) var(--spring), opacity var(--d-s); }
:root[data-look="tile"] .mchip.on .chk { background: var(--c-acc); color: var(--c-on-acc); transform: scale(1); opacity: 1; }
:root[data-look="tile"] .mchip .chk .ms { font-size: 16px; font-weight: 700; }
:root[data-look="tile"] .mchip.off b { color: var(--c-fg2); }
:root[data-look="tile"] .mchip.add { background: var(--c-well); color: var(--c-fg2); padding-right: 14px; }
:root[data-look="tile"] .machines-wrap { display: grid; grid-template-rows: 1fr; transition: grid-template-rows var(--d-m) var(--ease), opacity var(--d-m); }
:root[data-look="tile"] .machines-wrap > div { overflow: hidden; }
:root[data-look="tile"] .machines-wrap.gone { grid-template-rows: 0fr; opacity: 0; }

/* 便当卡：单排两张，随列表滚走 */
:root[data-look="tile"] .bento { display: grid; grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr); gap: 10px; padding: 0 16px 6px; }
:root[data-look="tile"] .tile { background: var(--c-card); border-radius: var(--r-card); padding: 14px 14px 14px 16px; position: relative; min-height: 116px; min-width: 0; }
:root[data-look="tile"] .tile-h { display: flex; align-items: center; gap: 6px; color: var(--c-fg2); font-size: 13px; }
:root[data-look="tile"] .tile-h .ms { font-size: 17px; }
:root[data-look="tile"] .big { font-size: 34px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; display: inline-flex; overflow: hidden; height: 38px; align-items: flex-end; }
:root[data-look="tile"] .big-unit { font-size: 13px; color: var(--c-fg2); margin-left: 4px; font-weight: 500; }
:root[data-look="tile"] .t-pending { cursor: pointer; display: flex; flex-direction: column; }
:root[data-look="tile"] .t-pending .num { margin-top: 10px; display: flex; align-items: baseline; }
:root[data-look="tile"] .t-pending .next { margin-top: auto; font-size: 13px; color: var(--c-fg2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
:root[data-look="tile"] .t-pending .next b { color: var(--c-fg); font-weight: 500; }
:root[data-look="tile"] .cookie { position: absolute; right: 10px; top: 12px; width: 64px; height: 64px; }
:root[data-look="tile"] .cookie svg { width: 100%; height: 100%; overflow: visible; }
:root[data-look="tile"] .cookie .ms { position: absolute; inset: 0; display: grid; place-items: center; color: var(--c-on-acc); font-size: 26px; pointer-events: none; transition: transform var(--d-m) var(--spring); }
:root[data-look="tile"] .cookie-bg { fill: var(--c-acc-soft); }
:root[data-look="tile"] .cookie-fg { fill: var(--c-acc); }
/* git 和设置页右上角：有待确认时一颗小号多瓣圆写着个数，一点进下一个 */
:root[data-look="tile"] .pchip { width: 44px; height: 44px; position: relative; display: grid; place-items: center; animation: tile-nextIn var(--d-l) var(--spring) both; }
:root[data-look="tile"] .pchip svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
:root[data-look="tile"] .pchip svg path { fill: var(--c-acc); }
:root[data-look="tile"] .pchip b { position: relative; color: var(--c-on-acc); font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
:root[data-look="tile"] .t-usage .u { margin-top: 9px; }
:root[data-look="tile"] .t-usage .u + .u { margin-top: 10px; }
:root[data-look="tile"] .u-top { display: flex; align-items: baseline; gap: 6px; }
:root[data-look="tile"] .u-top b { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
:root[data-look="tile"] .u-top span { font-size: 12px; color: var(--c-fg2); }
:root[data-look="tile"] .u-top i { margin-left: auto; font-style: normal; font-size: 12px; color: var(--c-fg3); font-variant-numeric: tabular-nums; }
:root[data-look="tile"] .bar { height: 6px; border-radius: 3px; background: var(--c-well); margin-top: 6px; overflow: hidden; }
:root[data-look="tile"] .bar > i { display: block; height: 100%; border-radius: 3px; background: var(--c-acc); transform-origin: left; transition: width var(--d-l) var(--ease); }
:root[data-look="tile"] .roll { display: inline-block; position: relative; }
:root[data-look="tile"] .roll.up { animation: tile-rollUp var(--d-l) var(--spring); }

/* 会话：档位是小标题，每个目录一张白卡 */
:root[data-look="tile"] .sec { display: flex; align-items: baseline; gap: 8px; margin: 18px 20px 8px; font-size: 13px; font-weight: 600; color: var(--c-fg2); }
:root[data-look="tile"] .sec span { font-weight: 400; color: var(--c-fg3); }
:root[data-look="tile"] .sec .ibtn { width: 28px; height: 28px; margin-left: auto; color: var(--c-fg3); }
:root[data-look="tile"] .sec .ibtn .ms { font-size: 17px; }
:root[data-look="tile"] .card { background: var(--c-card); border-radius: var(--r-card); margin: 0 16px 10px; overflow: hidden; }
:root[data-look="tile"] .dir-head { display: flex; align-items: center; gap: 10px; padding: 14px 10px 10px 16px; cursor: pointer; }
:root[data-look="tile"] .dir-head .ms.f { font-size: 20px; color: var(--c-fg2); }
:root[data-look="tile"] .dir-name { font-weight: 600; font-size: 15px; }
:root[data-look="tile"] .dir-branch { font-family: var(--mono); font-size: 12px; color: var(--c-fg3); white-space: nowrap; }
:root[data-look="tile"] .dir-head .fold { margin-left: auto; color: var(--c-fg3); transition: transform var(--d-m) var(--ease); }
:root[data-look="tile"] .card.folded .fold { transform: rotate(-90deg); }
:root[data-look="tile"] .dir-rows { display: grid; grid-template-rows: 1fr; transition: grid-template-rows var(--d-m) var(--ease); }
:root[data-look="tile"] .dir-rows > div { overflow: hidden; }
:root[data-look="tile"] .card.folded .dir-rows { grid-template-rows: 0fr; }
:root[data-look="tile"] .swipe { position: relative; touch-action: pan-y; }
:root[data-look="tile"] .swipe-acts { position: absolute; inset: 0 0 0 auto; width: 64px; display: grid; place-items: center; }
:root[data-look="tile"] .act { width: 40px; height: 40px; border-radius: 50%; background: var(--c-well); display: grid; place-items: center; color: var(--c-fg); transform: scale(calc(0.5 + var(--swipe, 0) * 0.5)); opacity: var(--swipe, 0); }
:root[data-look="tile"] .act.danger { color: var(--c-del); }
:root[data-look="tile"] .act .ms { font-size: 20px; }
:root[data-look="tile"] .swipe-body { background: var(--c-card); transition: transform var(--d-m) var(--ease); position: relative; }
:root[data-look="tile"] .row { display: flex; align-items: flex-start; gap: 12px; padding: 11px 16px 11px 18px; cursor: pointer; position: relative; }
:root[data-look="tile"] .row::after { content: ""; position: absolute; left: 40px; right: 0; bottom: 0; border-bottom: 1px solid var(--c-line); }
:root[data-look="tile"] .dir-rows .swipe:last-child .row::after { display: none; }
:root[data-look="tile"] .row:active { background: var(--c-well); }
:root[data-look="tile"] .row-text { flex: 1; min-width: 0; }
:root[data-look="tile"] .row-title { font-size: 16px; font-weight: 500; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
:root[data-look="tile"] .row-sub { font-size: 13px; color: var(--c-fg2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.4; margin-top: 1px; }
:root[data-look="tile"] .row-sub b { font-weight: 500; color: var(--c-fg); }
:root[data-look="tile"] .row-sub .mono { font-size: 12px; }
:root[data-look="tile"] .glyph { width: 10px; height: 10px; border-radius: 50%; flex: none; margin-top: 7px; position: relative; border: 1.5px solid var(--c-fg3); }
:root[data-look="tile"] .g-need { border: 0; background: var(--c-acc); box-shadow: 0 0 0 3px var(--c-acc-soft); }
:root[data-look="tile"] .g-reply { border: 2px solid var(--c-acc); }
:root[data-look="tile"] .g-work { border: 2px solid var(--c-acc-soft); border-top-color: var(--c-acc); animation: tile-spin calc(900ms * var(--slow)) linear infinite; }
:root[data-look="tile"] .g-stop { border-radius: 2px; background: var(--c-fg3); border: 0; width: 9px; height: 9px; }
:root[data-look="tile"] .row.fork { padding-left: 36px; }
:root[data-look="tile"] .row.fork::after { left: 58px; }
/* 连线从来源的圆点正下方出发，拐到 fork 的圆点左边：来源圆点中心在行左 23px，fork 圆点左缘在 36px */
:root[data-look="tile"] .row.fork .glyph::before { content: ""; position: absolute; left: -14.5px; bottom: 3px; width: 11px; height: 58px; border-left: 1.5px solid var(--c-line); border-bottom: 1.5px solid var(--c-line); border-bottom-left-radius: 8px; }
:root[data-look="tile"] .agents { padding: 0 0 6px; }
:root[data-look="tile"] .agent { display: flex; align-items: center; gap: 10px; padding: 4px 16px 4px 40px; font-size: 13px; color: var(--c-fg2); }
:root[data-look="tile"] .agent .glyph { margin-top: 0; width: 8px; height: 8px; }
:root[data-look="tile"] .agent i { font-style: normal; color: var(--c-fg3); margin-left: auto; white-space: nowrap; }
:root[data-look="tile"] .agent span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
:root[data-look="tile"] .swap-in { animation: tile-swapIn var(--d-l) var(--ease) both; }

/* 底栏：贴底白栏，选中项是浅色指示块 */
:root[data-look="tile"] .tabbar { position: absolute; inset: auto 0 0; height: 84px; background: var(--c-card); display: flex; padding: 10px 6px 0; z-index: 20; transition: transform var(--d-l) var(--ease); }
:root[data-look="tile"] .tabbar.hide { transform: translateY(100%); }
:root[data-look="tile"] .tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; color: var(--c-fg2); position: relative; }
:root[data-look="tile"] .tab .ind { width: 60px; height: 32px; border-radius: 16px; display: grid; place-items: center; position: relative; }
:root[data-look="tile"] .tab .ind::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--c-acc-soft); transform: scaleX(0.3); opacity: 0; transition: transform var(--d-m) var(--ease), opacity var(--d-s); }
:root[data-look="tile"] .tab.on { color: var(--c-fg); }
:root[data-look="tile"] .tab.on .ind::before { transform: none; opacity: 1; }
:root[data-look="tile"] .tab .ms { position: relative; }

  --r-panel: 30px;
  --font: "Onest", "Noto Sans SC", "PingFang SC", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --slow: 1;
  --d-s: calc(160ms * var(--slow));
  --d-m: calc(300ms * var(--slow));
  --d-l: calc(380ms * var(--slow));
  --d-morph: calc(520ms * var(--slow));
  --ease: cubic-bezier(0.2, 0.9, 0.25, 1);
  --ease-in: cubic-bezier(0.45, 0, 0.8, 0.4);
  --spring: cubic-bezier(0.34, 1.4, 0.64, 1);
  --goo: cubic-bezier(0.3, 1.32, 0.45, 1);
  --desk: #050506;
  --desk-fg: #EDEDF0;
  --desk-fg2: #85848B;
  --desk-line: #222226;
  color-scheme: dark;
}
:root[data-look="ink"][data-theme="light"] {
  --c-bg: #F5F4F0;
  --c-s1: #FFFFFF;
  --c-float: #FFFFFF;
  --c-s3: #ECEAE4;
  --c-edge: rgba(0, 0, 0, 0.07);
  --c-fg: #161615;
  --c-fg2: #6D6B66;
  --c-fg3: #A6A39C;
  --c-acc: #C9653F;
  --c-inv: #161615;
  --c-on-inv: #F5F4F0;
  --c-ok: #2E9E5B;
  --c-add: #2C8A4E;
  --c-del: #D2453B;
  --c-scrim: rgba(40, 30, 20, 0.22);
  --c-shadow: 0 0 0 1px var(--c-edge), 0 8px 24px -12px rgba(60, 45, 30, 0.28);
  --desk: #E7E5E0;
  --desk-fg: #1A1A19;
  --desk-fg2: #77746E;
  --desk-line: #D6D3CC;
  color-scheme: light;
}
:root[data-look="ink"] body { background: var(--desk); color: var(--desk-fg); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
:root[data-look="ink"] .ms { font-family: "Material Symbols Outlined"; font-weight: normal; font-style: normal; font-size: 22px; line-height: 1; letter-spacing: normal; white-space: nowrap; direction: ltr; font-variation-settings: "FILL" 0, "wght" 300, "opsz" 24; user-select: none; display: inline-block; }
:root[data-look="ink"] .ms.fill { font-variation-settings: "FILL" 1, "wght" 300, "opsz" 24; }
:root[data-look="ink"] code, :root[data-look="ink"] .mono { font-family: var(--mono); font-size: 0.9em; }

:root[data-look="ink"] .desk { display: flex; gap: 48px; align-items: center; justify-content: center; min-height: 100%; padding: 32px; }
:root[data-look="ink"] .review { width: 300px; align-self: stretch; display: flex; flex-direction: column; gap: 22px; padding-top: 24px; }
:root[data-look="ink"] .review h1 { font-size: 22px; margin: 0; font-weight: 600; }
:root[data-look="ink"] .review .lead { color: var(--desk-fg2); margin: 4px 0 0; }
:root[data-look="ink"] .review h2 { font-size: 12px; font-weight: 600; color: var(--desk-fg2); margin: 0 0 8px; letter-spacing: 0.04em; }
:root[data-look="ink"] .rrow { display: flex; flex-wrap: wrap; gap: 8px; }
:root[data-look="ink"] .rbtn { border: 1px solid var(--desk-line); border-radius: 999px; padding: 6px 12px; font-size: 13px; }
:root[data-look="ink"] .rbtn.on { background: var(--desk-fg); color: var(--desk); border-color: var(--desk-fg); }
:root[data-look="ink"] .rsw { width: 24px; height: 24px; border-radius: 50%; outline: 2px solid transparent; outline-offset: 2px; }
:root[data-look="ink"] .rsw.on { outline-color: var(--desk-fg); }
:root[data-look="ink"] .review ol { margin: 0; padding-left: 18px; color: var(--desk-fg2); }
:root[data-look="ink"] .review ol li { margin: 3px 0; }
:root[data-look="ink"] .review a { color: inherit; }

/* 手机：侧栏在下面一层，打开时主页缩成卡片推到右边 */
:root[data-look="ink"] .phone { position: relative; width: 390px; height: 844px; border-radius: 52px; background: var(--c-bg); overflow: hidden; color: var(--c-fg);
  box-shadow: 0 0 0 10px #111, 0 0 0 11px #2a2a2e, 0 40px 80px -30px rgba(0,0,0,.5); view-transition-name: phone; isolation: isolate; }
:root[data-look="ink"] .status { position: absolute; inset: 0 0 auto; height: 44px; padding: 14px 30px 0; display: flex; justify-content: space-between; font: 600 15px var(--font); z-index: 60; pointer-events: none; }
:root[data-look="ink"] .status .ms { font-size: 17px; margin-left: 4px; }
:root[data-look="ink"] .app { position: absolute; inset: 0; background: var(--c-bg); transform-origin: 0 50%; transition: transform var(--d-l) var(--ease), border-radius var(--d-l) var(--ease), box-shadow var(--d-l); overflow: hidden; z-index: 2; }
:root[data-look="ink"] .phone.drawer-open .app { transform: translateX(300px) scale(0.84); border-radius: 40px; box-shadow: 0 0 0 1px var(--c-edge), -20px 0 60px -20px rgba(0,0,0,.5); cursor: pointer; }
:root[data-look="ink"] .phone.drawer-open .app > * { pointer-events: none; }
:root[data-look="ink"] .drawer { position: absolute; inset: 0; padding: 72px 0 0; z-index: 1; opacity: 0; transform: translateX(-24px); transition: opacity var(--d-l), transform var(--d-l) var(--ease); }
:root[data-look="ink"] .phone.drawer-open .drawer { opacity: 1; transform: none; }
:root[data-look="ink"] .dr-head { display: flex; align-items: center; gap: 12px; padding: 0 28px 18px; font-size: 26px; font-weight: 500; letter-spacing: -0.01em; }
:root[data-look="ink"] .dr-mark { width: 30px; height: 30px; border-radius: 50%; background: var(--c-acc); position: relative; }
:root[data-look="ink"] .dr-mark::after { content: ""; position: absolute; left: 7px; right: 7px; top: 13px; height: 4px; border-radius: 2px; background: var(--c-bg); transform: rotate(-8deg); }
:root[data-look="ink"] .dr-line { height: 1px; background: var(--c-edge); margin: 0 24px 14px; width: 252px; }
:root[data-look="ink"] .dr-sec { font-size: 12px; color: var(--c-fg3); padding: 12px 28px 6px; }
:root[data-look="ink"] .dr-item { display: flex; align-items: center; gap: 14px; width: 270px; margin: 2px 14px; padding: 10px 14px; border-radius: 22px; text-align: left; border: 1px solid transparent; transition: background var(--d-s), border-color var(--d-s); }
:root[data-look="ink"] .dr-item.on { background: var(--c-s1); border-color: var(--c-edge); }
:root[data-look="ink"] .dr-item .ms { font-size: 22px; color: var(--c-fg2); }
:root[data-look="ink"] .dr-item.on .ms { color: var(--c-acc); }
:root[data-look="ink"] .dr-item b { display: block; font-weight: 500; font-size: 16px; }
:root[data-look="ink"] .dr-item span { display: block; font-size: 13px; color: var(--c-fg2); }
:root[data-look="ink"] .dr-orb { position: absolute; left: 24px; bottom: 30px; width: 56px; height: 56px; border-radius: 50%; background: var(--c-float); box-shadow: var(--c-shadow); display: grid; place-items: center; }

:root[data-look="ink"] .screen { position: absolute; inset: 0; }
:root[data-look="ink"] .page { position: absolute; inset: 0; background: var(--c-bg); transition: transform var(--d-l) var(--ease), filter var(--d-l) var(--ease); }
:root[data-look="ink"] .page-in { transform: translateX(100%); }
:root[data-look="ink"] .page-out { transform: translateX(100%); transition-timing-function: cubic-bezier(0.4, 0, 1, 1); transition-duration: calc(300ms * var(--slow)); }
:root[data-look="ink"] .page-under { transform: translateX(-22%); filter: brightness(0.7); }
:root[data-look="ink"] .scroll { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; padding: 108px 0 130px; }
:root[data-look="ink"] .scroll::-webkit-scrollbar { display: none; }

/* 悬浮圆钮：背后一层渐隐的底，内容从下面滚过去字不糊 */
:root[data-look="ink"] .top { position: absolute; inset: 0 0 auto; height: 112px; padding: 50px 16px 0; display: flex; align-items: center; gap: 10px; z-index: 6; pointer-events: none;
  background: linear-gradient(to bottom, var(--c-bg) 62%, transparent); }
:root[data-look="ink"] .top > * { pointer-events: auto; }
:root[data-look="ink"] .orb { width: 48px; height: 48px; border-radius: 50%; background: var(--c-float); box-shadow: var(--c-shadow); display: grid; place-items: center; flex: none; transition: transform var(--d-s) var(--ease); }
:root[data-look="ink"] .orb:active, :root[data-look="ink"] .pill:active { transform: scale(0.94); }
:root[data-look="ink"] .pill { height: 40px; border-radius: 20px; background: var(--c-float); box-shadow: var(--c-shadow); display: flex; align-items: center; gap: 8px; padding: 0 12px 0 14px; margin: 0 auto; min-width: 0; max-width: 220px; font-size: 14px; font-weight: 500; transition: transform var(--d-s) var(--ease); }
:root[data-look="ink"] .pill span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
:root[data-look="ink"] .pill .ms { font-size: 18px; color: var(--c-fg2); }
:root[data-look="ink"] .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c-ok); flex: none; }
:root[data-look="ink"] .burger { display: flex; flex-direction: column; gap: 5px; align-items: flex-start; }
:root[data-look="ink"] .burger i { display: block; height: 1.6px; border-radius: 1px; background: var(--c-fg); }
:root[data-look="ink"] .burger i:nth-child(1) { width: 20px; } :root[data-look="ink"] .burger i:nth-child(2) { width: 15px; } :root[data-look="ink"] .burger i:nth-child(3) { width: 10px; }
:root[data-look="ink"] .spacer { width: 48px; flex: none; }

/* 「活跃 / 全部」：选中的字下面压一笔刷出来的色块 */
:root[data-look="ink"] .brush-tabs { position: relative; display: flex; gap: 22px; padding: 6px 24px 14px; align-items: baseline; }
:root[data-look="ink"] .brush-tabs button { font-size: 30px; font-weight: 500; letter-spacing: -0.01em; color: var(--c-fg3); position: relative; z-index: 1; transition: color var(--d-m); line-height: 1.25; }
:root[data-look="ink"] .brush-tabs button.on { color: var(--c-fg); }
:root[data-look="ink"] .brush-tabs button i { font-style: normal; font-size: 15px; color: var(--c-fg3); margin-left: 4px; vertical-align: 4px; }
:root[data-look="ink"] .brush { position: absolute; top: 20px; height: 26px; left: 0; width: 0; z-index: 0; transition: left var(--d-m) var(--goo), width var(--d-m) var(--goo); }
:root[data-look="ink"] .brush svg { width: 100%; height: 100%; display: block; overflow: visible; }
:root[data-look="ink"] .brush path { fill: var(--c-s3); }
:root[data-look="ink"] .filter-note { display: flex; align-items: center; gap: 6px; margin: -6px 24px 10px; font-size: 13px; color: var(--c-fg2); }
:root[data-look="ink"] .filter-note button { color: var(--c-fg3); display: grid; place-items: center; }
:root[data-look="ink"] .filter-note .ms { font-size: 16px; }

:root[data-look="ink"] .grp-h { display: flex; gap: 8px; align-items: baseline; padding: 16px 24px 4px; font-size: 13px; color: var(--c-fg3); }
:root[data-look="ink"] .grp-h b { color: var(--c-fg2); font-weight: 500; }
:root[data-look="ink"] .grp-h span:not(.ms) { font-family: var(--mono); font-size: 12px; }
:root[data-look="ink"] .swipe { position: relative; touch-action: pan-y; }
:root[data-look="ink"] .swipe-acts { position: absolute; inset: 0 0 0 auto; width: 72px; display: grid; place-items: center; }
:root[data-look="ink"] .act { width: 42px; height: 42px; border-radius: 50%; background: var(--c-float); box-shadow: var(--c-shadow); display: grid; place-items: center; transform: scale(calc(0.4 + var(--swipe, 0) * 0.6)); opacity: var(--swipe, 0); }
:root[data-look="ink"] .act.danger { color: var(--c-del); }
:root[data-look="ink"] .act .ms { font-size: 20px; }
:root[data-look="ink"] .swipe-body { background: var(--c-bg); transition: transform var(--d-m) var(--ease); position: relative; }
:root[data-look="ink"] .row { display: flex; align-items: flex-start; gap: 14px; padding: 12px 24px; cursor: pointer; border-radius: 0; transition: background var(--d-s); }
:root[data-look="ink"] .row:active { background: var(--c-s1); }
:root[data-look="ink"] .row-text { flex: 1; min-width: 0; }
:root[data-look="ink"] .row-title { font-size: 17px; font-weight: 500; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
:root[data-look="ink"] .row-sub { font-size: 14px; color: var(--c-fg2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
:root[data-look="ink"] .row-sub .mono { font-size: 12.5px; }
:root[data-look="ink"] .row-sub b { font-weight: 500; color: var(--c-fg); }
:root[data-look="ink"] .glyph { width: 10px; height: 10px; border-radius: 50%; flex: none; margin-top: 8px; position: relative; border: 1.5px solid var(--c-fg3); }
:root[data-look="ink"] .g-need { border: 0; background: var(--c-acc); }
:root[data-look="ink"] .g-reply { border: 2px solid var(--c-acc); }
:root[data-look="ink"] .g-work { border: 2px solid var(--c-s3); border-top-color: var(--c-fg); animation: ink-spin calc(900ms * var(--slow)) linear infinite; }
:root[data-look="ink"] .g-stop { border-radius: 2px; background: var(--c-fg3); border: 0; width: 9px; height: 9px; }
:root[data-look="ink"] .row.fork { padding-left: 46px; }
:root[data-look="ink"] .row.fork .glyph::before { content: ""; position: absolute; left: -16.5px; bottom: 3px; width: 13px; height: 62px; border-left: 1.5px solid var(--c-s3); border-bottom: 1.5px solid var(--c-s3); border-bottom-left-radius: 9px; }
:root[data-look="ink"] .agent { display: flex; align-items: center; gap: 10px; padding: 3px 24px 3px 48px; font-size: 13px; color: var(--c-fg2); }
:root[data-look="ink"] .agent .glyph { margin-top: 0; width: 8px; height: 8px; }
:root[data-look="ink"] .agent span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
:root[data-look="ink"] .agent i { font-style: normal; color: var(--c-fg3); margin-left: auto; white-space: nowrap; }
:root[data-look="ink"] .agents { padding-bottom: 8px; }
:root[data-look="ink"] .swap-in { animation: ink-swapIn var(--d-l) var(--ease) both; }
:root[data-look="ink"] .panes { display: grid; }
:root[data-look="ink"] .panes > * { grid-area: 1 / 1; transition: opacity var(--d-m) var(--ease), transform var(--d-m) var(--ease); }
:root[data-look="ink"] .panes > .off { opacity: 0; pointer-events: none; transform: translateY(10px); }

/* 底栏：悬浮药丸三格，右边单独一颗圆钮管目标机和待确认 */
:root[data-look="ink"] .nav { position: absolute; left: 16px; right: 16px; bottom: 22px; height: 64px; display: flex; gap: 10px; z-index: 20; transition: transform var(--d-l) var(--ease), opacity var(--d-m); }
:root[data-look="ink"] .nav.hide { transform: translateY(120px); }
:root[data-look="ink"] .tabs { position: relative; flex: 1; border-radius: 32px; background: var(--c-float); box-shadow: var(--c-shadow); display: flex; padding: 6px; }
:root[data-look="ink"] .tab { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; color: var(--c-fg2); position: relative; z-index: 1; transition: color var(--d-m); }
:root[data-look="ink"] .tab .ms { font-size: 23px; width: 24px; overflow: hidden; }
:root[data-look="ink"] .tab.on { color: var(--c-fg); }
/* 指示块整块弹过去、略冲过头再落回，像一团墨；「一边先走一边跟上」的拉伸是清玻独有的，这里不用 */
:root[data-look="ink"] .tab-ind { position: absolute; top: 6px; bottom: 6px; border-radius: 26px; background: var(--c-s3); box-shadow: inset 0 0 0 1px var(--c-edge); transition-property: left, right; transition-duration: calc(460ms * var(--slow)); transition-timing-function: var(--goo); }
:root[data-look="ink"] .orb-machine { width: 64px; height: 64px; border-radius: 50%; background: var(--c-float); box-shadow: var(--c-shadow); position: relative; flex: none; display: grid; place-items: center; transition: background var(--d-m), transform var(--d-s) var(--ease); }
:root[data-look="ink"] .orb-machine:active { transform: scale(0.94); }
:root[data-look="ink"] .orb-machine > * { grid-area: 1 / 1; transition: transform var(--d-m) var(--spring), opacity var(--d-s); }
:root[data-look="ink"] .orb-icon { font-size: 26px; }
:root[data-look="ink"] .orb-count { font-size: 22px; font-weight: 600; color: var(--c-on-acc); opacity: 0; transform: scale(0.4); font-variant-numeric: tabular-nums; }
:root[data-look="ink"] .orb-machine.has { background: var(--c-acc); }
:root[data-look="ink"] .orb-machine.has .orb-icon { opacity: 0; transform: scale(0.4) rotate(-20deg); }
:root[data-look="ink"] .orb-machine.has .orb-count { opacity: 1; transform: none; }
:root[data-look="ink"] .orb-machine::after { content: ""; position: absolute; inset: 0; border-radius: 50%; box-shadow: 0 0 0 0 var(--c-acc); opacity: 0; pointer-events: none; }
:root[data-look="ink"] .orb-machine.pulse::after { animation: ink-pulse calc(900ms * var(--slow)) var(--ease) 2; }
:root[data-look="ink"] .bump { animation: ink-bump var(--d-m) var(--spring); }

/* 长出来的面板：按最终尺寸排好，只动裁剪框；盒子比看到的大一圈，弹簧冲过头时边缘会鼓出去 */
:root[data-look="ink"] .scrim { position: absolute; inset: 0; background: var(--c-scrim); z-index: 40; opacity: 0; transition: opacity var(--d-m); }
:root[data-look="ink"] .scrim.on { opacity: 1; }
:root[data-look="ink"] .morph { position: absolute; z-index: 41; padding: 12px; }
:root[data-look="ink"] .morph-in { background: var(--c-float); border-radius: var(--r-panel); box-shadow: var(--c-shadow); height: 100%; overflow: hidden; }
:root[data-look="ink"] .morph-body { opacity: 0; transform: translateY(var(--from-y, 10px)); transition: opacity var(--d-m) var(--ease), transform var(--d-l) var(--ease); }
:root[data-look="ink"] .morph.on .morph-body { opacity: 1; transform: none; transition-delay: calc(110ms * var(--slow)); }
:root[data-look="ink"] .morph-ghost { position: absolute; z-index: 42; pointer-events: none; transition: opacity calc(140ms * var(--slow)), transform var(--d-m) var(--ease); }
:root[data-look="ink"] .pn-sec { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--c-fg2); padding: 18px 22px 8px; }
:root[data-look="ink"] .pn-sec .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c-acc); }
:root[data-look="ink"] .pq, :root[data-look="ink"] .pm { display: flex; align-items: center; gap: 14px; padding: 10px 14px 10px 22px; cursor: pointer; transition: background var(--d-s); }
:root[data-look="ink"] .pq:active, :root[data-look="ink"] .pm:active { background: var(--c-s3); }
:root[data-look="ink"] .pq .glyph { margin-top: 0; }
:root[data-look="ink"] .pq .t, :root[data-look="ink"] .pm .t { flex: 1; min-width: 0; }
:root[data-look="ink"] .pq b, :root[data-look="ink"] .pm b { display: block; font-weight: 500; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
:root[data-look="ink"] .pq span, :root[data-look="ink"] .pm span { display: block; font-size: 13px; color: var(--c-fg2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
:root[data-look="ink"] .pq .ms, :root[data-look="ink"] .pm .chev { color: var(--c-fg3); font-size: 20px; }
:root[data-look="ink"] .pm > .ms:first-child { font-size: 24px; color: var(--c-fg2); }
:root[data-look="ink"] .pm .ok { color: var(--c-fg); }
:root[data-look="ink"] .pn-line { height: 1px; background: var(--c-edge); margin: 8px 22px; }
:root[data-look="ink"] .pn-foot { font-size: 13px; color: var(--c-fg3); padding: 6px 22px 4px; }
:root[data-look="ink"] .pn-foot button { color: var(--c-acc); }
:root[data-look="ink"] .dashed { width: 34px; height: 34px; border-radius: 50%; border: 1.5px dashed var(--c-fg3); display: grid; place-items: center; flex: none; margin-left: -4px; }
:root[data-look="ink"] .dashed .ms { font-size: 18px; color: var(--c-fg2); }
:root[data-look="ink"] .st-head { padding: 22px 22px 6px; }
:root[data-look="ink"] .st-head b { display: block; font-size: 22px; font-weight: 500; }
:root[data-look="ink"] .st-head span { display: block; color: var(--c-fg2); font-size: 13px; margin-top: 2px; }
:root[data-look="ink"] .us { padding: 12px 22px 2px; }
:root[data-look="ink"] .us-top { display: flex; align-items: baseline; gap: 8px; }
:root[data-look="ink"] .us-top b { font-size: 24px; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
:root[data-look="ink"] .us-top span { color: var(--c-fg2); font-size: 13px; }
:root[data-look="ink"] .us-top i { margin-left: auto; font-style: normal; font-size: 12px; color: var(--c-fg3); }
:root[data-look="ink"] .bar { height: 5px; border-radius: 3px; background: var(--c-s3); margin-top: 8px; overflow: hidden; }
:root[data-look="ink"] .bar > i { display: block; height: 100%; border-radius: 3px; background: var(--c-fg); }
:root[data-look="ink"] .ctl { display: flex; align-items: center; gap: 14px; padding: 12px 22px; cursor: pointer; }
:root[data-look="ink"] .ctl:active { background: var(--c-s3); }

<style>
/* ==================== 印版（data-look="plate"） ==================== */
/* 印版：一张单色印刷品，全页只有纸和一种油墨。直角；线宽只有三种：2px 强调线、1.5px 边框和底线、22% 油墨的细线。
   等宽字只给数字、路径、命令和 hash。东西出现是从左往右印出，离开是向右抹掉；换页仍是整页右滑。 */
:root[data-look="plate"] {
  --paper: #F3F2EC;
  --ink: #2340A8;
  --c-bg: var(--paper);
  --c-fg: var(--ink);
  --c-fg2: color-mix(in srgb, var(--ink) 78%, var(--paper));
  --c-fg3: color-mix(in srgb, var(--ink) 55%, var(--paper));
  --c-line: color-mix(in srgb, var(--ink) 22%, transparent);
  --c-tint: color-mix(in srgb, var(--ink) 6%, var(--paper));
  --c-danger: #C5121F;
  --font: "Archivo", "Noto Sans SC", "PingFang SC", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --slow: 1;
  --d-s: calc(160ms * var(--slow));
  --d-m: calc(300ms * var(--slow));
  --d-l: calc(420ms * var(--slow));
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --ease-in: cubic-bezier(0.45, 0, 0.8, 0.4);
  --desk: #E8E7E0;
  --desk-fg: #1B1B22;
  --desk-fg2: #6E6D74;
  --desk-line: #D3D1C7;
}
:root[data-look="plate"][data-theme="dark"] {
  --paper: #11141F;
  --ink: #B9C6F5;
  --c-danger: #FFB4A8;
  --desk: #07080D;
  --desk-fg: #E7E8EF;
  --desk-fg2: #85868F;
  --desk-line: #23252F;
  color-scheme: dark;
}
:root[data-look="plate"] body { background: var(--desk); color: var(--desk-fg); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
:root[data-look="plate"] .ms { font-family: "Material Symbols Sharp"; font-weight: normal; font-style: normal; font-size: 22px; line-height: 1; letter-spacing: normal; white-space: nowrap; direction: ltr; font-variation-settings: "FILL" 0, "wght" 500, "opsz" 24; user-select: none; display: inline-block; }

:root[data-look="plate"] .review ol li { margin: 3px 0; }

:root[data-look="plate"] .phone { position: relative; width: 390px; height: 844px; border-radius: 52px; background: var(--c-bg); overflow: hidden; color: var(--c-fg);
  box-shadow: 0 0 0 10px #111, 0 0 0 11px #2a2a2e, 0 40px 80px -30px rgba(0,0,0,.45); view-transition-name: phone; isolation: isolate; }
:root[data-look="plate"] .status { position: absolute; inset: 0 0 auto; height: 44px; padding: 14px 30px 0; display: flex; justify-content: space-between; font: 700 15px var(--font); z-index: 60; pointer-events: none; }
:root[data-look="plate"] .status .ms { font-size: 17px; margin-left: 4px; }
:root[data-look="plate"] .screen { position: absolute; inset: 0; }
:root[data-look="plate"] .page { position: absolute; inset: 0; background: var(--c-bg); transition: transform var(--d-l) var(--ease), filter var(--d-l) var(--ease); }
:root[data-look="plate"] .page-in { transform: translateX(100%); }
:root[data-look="plate"] .page-out { transform: translateX(100%); transition-timing-function: var(--ease-in); transition-duration: calc(300ms * var(--slow)); }
:root[data-look="plate"] .page-under { transform: translateX(-22%); filter: brightness(0.94); }
:root[data-look="plate"] .scroll { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; padding-bottom: 110px; }
:root[data-look="plate"] .scroll::-webkit-scrollbar { display: none; }

/* 动画：线条只写起点，终点就是元素本来的样子 */
:root[data-look="plate"] .print { animation: plate-print-in calc(520ms * var(--slow)) var(--ease) backwards; }

/* 裁切线：刊头和面板四角各两道短线，从角落向外画出 */
:root[data-look="plate"] .crop { position: absolute; inset: 0; pointer-events: none; color: color-mix(in srgb, var(--ink) 50%, transparent); }
:root[data-look="plate"] .crop i { position: absolute; width: 12px; height: 12px; }
:root[data-look="plate"] .crop i:nth-child(1) { top: -1px; left: -1px; }
:root[data-look="plate"] .crop i:nth-child(2) { top: -1px; right: -1px; transform: scaleX(-1); --dl: 80ms; }
:root[data-look="plate"] .crop i:nth-child(3) { bottom: -1px; left: -1px; transform: scaleY(-1); --dl: 160ms; }
:root[data-look="plate"] .crop i:nth-child(4) { bottom: -1px; right: -1px; transform: scale(-1); --dl: 240ms; }
:root[data-look="plate"] .crop i::before, :root[data-look="plate"] .crop i::after { content: ""; position: absolute; background: currentColor; }
:root[data-look="plate"] .crop i::before { top: 0; right: 100%; width: 10px; height: 1px; transform-origin: right; animation: plate-draw-x calc(700ms * var(--slow)) calc(var(--dl, 0ms) * var(--slow)) var(--ease) backwards; }
:root[data-look="plate"] .crop i::after { bottom: 100%; left: 0; width: 1px; height: 10px; transform-origin: bottom; animation: plate-draw-y calc(700ms * var(--slow)) calc(var(--dl, 0ms) * var(--slow)) var(--ease) backwards; }

/* 刊头 */
:root[data-look="plate"] .mast { position: relative; margin: 54px 18px 6px; padding: 14px 14px 16px; }
:root[data-look="plate"] .mast-top { display: flex; align-items: center; gap: 8px; }

:root[data-look="plate"] .wordmark span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
:root[data-look="plate"] .wordmark .ms { font-size: 20px; transition: transform var(--d-m) var(--ease); }
:root[data-look="plate"] .wordmark.open .ms { transform: rotate(180deg); }
:root[data-look="plate"] .box { width: 22px; height: 22px; border: 1.5px solid currentColor; display: inline-grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; line-height: 1; }
:root[data-look="plate"] .box.dash { border-style: dashed; }
:root[data-look="plate"] .box.solid { background: var(--c-fg); color: var(--c-bg); border-color: var(--c-fg); }
:root[data-look="plate"] .sqbtn { width: 36px; height: 36px; border: 1.5px solid var(--c-fg); display: grid; place-items: center; flex: none; margin-left: auto;
  background: linear-gradient(var(--c-fg), var(--c-fg)) right / 0 100% no-repeat; transition: background-size var(--d-m) var(--ease), color var(--d-s); }
:root[data-look="plate"] .sqbtn:active { background-position: left; background-size: 100% 100%; color: var(--c-bg); }

:root[data-look="plate"] .bignum .d { display: inline-block; }

/* 用量刻度尺：51 道刻线，每 10% 一道长线；底下一层浅尺，上面一层按百分比裁出实墨 */
:root[data-look="plate"] .ruler { margin-top: 14px; }

:root[data-look="plate"] .ticks i:first-child { opacity: 0.3; }
:root[data-look="plate"] .ticks i:last-child { clip-path: inset(0 calc(100% - var(--pct)) 0 0); transition: clip-path var(--d-l) var(--ease); animation: plate-print-in calc(900ms * var(--slow)) calc(200ms * var(--slow)) var(--ease) backwards; }

/* 四套样式共用的小工具：页面栈、浮层栈、行左滑、换主题的圆形扩散、慢放。只管行为，不管长相。 */
(function () {
  var K = {};
  K.slow = 1;
  K.dur = function (ms) { return ms * K.slow; };
  K.setSlow = function (on) {
    K.slow = on ? 5 : 1;
    document.documentElement.style.setProperty("--slow", K.slow);
  };
  K.esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  // 回复里只认行内代码和加粗
  K.md = function (s) {
    return K.esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  };
  K.icon = function (name, cls) { return '<span class="ms' + (cls ? " " + cls : "") + '">' + name + "</span>"; };
  K.h = function (html) { var t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };
  K.wait = function (ms) { return new Promise(function (r) { setTimeout(r, K.dur(ms)); }); };

  // 多瓣圆：半径随角度起伏，amp 为 0 时就是正圆。按下时把 amp 收到 0，就是 Material 3 Expressive 那种形状变化
  K.cookie = function (cx, cy, r, amp, lobes, rot) {
    var n = 96, d = "";
    for (var i = 0; i <= n; i++) {
      var t = (i / n) * Math.PI * 2;
      var rr = r * (1 + amp * Math.cos(lobes * (t + rot)));
      var x = cx + rr * Math.cos(t), y = cy + rr * Math.sin(t);
      d += (i ? "L" : "M") + x.toFixed(2) + " " + y.toFixed(2);
    }
    return d + "Z";
  };
  // 把一个数从 a 动到 b，弹簧手感：先冲过头一点再回来
  K.tween = function (from, to, ms, step, ease) {
    var t0 = performance.now(), d = K.dur(ms);
    ease = ease || function (p) { var c = 1.6; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
    return new Promise(function (done) {
      function f(now) {
        var p = Math.min(1, (now - t0) / d);
        step(from + (to - from) * ease(p));
        if (p < 1) requestAnimationFrame(f); else done();
      }
      requestAnimationFrame(f);
    });
  };

  // 页面栈：进下一层从右边整页滑进来，返回整页滑出去，和 APP 现在的转场一致
  K.Stack = function (host, opts) {
    var self = { pages: [], host: host, lockUntil: 0 };
    opts = opts || {};
    // 新页面还在滑入时不再压新页；同一个会话的聊天页不压两层，否则返回一次看到的还是它
    function refused(el) {
      if (performance.now() < self.lockUntil) return true;
      var top = self.top();
      return !!(top && el.dataset.s && top.dataset.s === el.dataset.s && top.classList.contains("chat") === el.classList.contains("chat"));
    }
    self.top = function () { return self.pages[self.pages.length - 1]; };
    self.root = function (el) {
      self.pages.forEach(function (p) { p.remove(); });
      self.pages = [el];
      el.classList.add("page");
      host.appendChild(el);
      if (opts.onChange) opts.onChange(self);
    };
    self.push = function (el, replacing) {
      if (!replacing && refused(el)) return null;
      self.lockUntil = performance.now() + K.dur(420);
      history.pushState({ rc: self.pages.length }, "");
      var below = self.top();
      el.classList.add("page", "page-in");
      host.appendChild(el);
      self.pages.push(el);
      el.getBoundingClientRect();
      el.classList.remove("page-in");
      if (below) below.classList.add("page-under");
      if (opts.onChange) opts.onChange(self);
      return el;
    };
    self.replace = function (el) {
      if (refused(el)) return null;
      var old = self.pages.pop();
      self.push(el, true);
      if (old) setTimeout(function () { old.remove(); }, K.dur(400));
      return el;
    };
    // 首页换成新的一份但不动上面压着的页面（切目标机时用），聊天页还在、返回照常
    self.swapRoot = function (el) {
      var old = self.pages[0];
      el.classList.add("page");
      if (self.pages.length > 1) el.classList.add("page-under");
      if (old) old.replaceWith(el); else host.appendChild(el);
      self.pages[0] = el;
    };
    self.pop = function () {
      if (self.pages.length < 2) return false;
      var el = self.pages.pop(), below = self.top();
      el.classList.add("page-out");
      below.classList.remove("page-under");
      setTimeout(function () { el.remove(); }, K.dur(380));
      if (opts.onChange) opts.onChange(self);
      return true;
    };
    return self;
  };

  // 浮层栈：Esc 和返回先关最上面的浮层
  var overlays = [];
  K.pushOverlay = function (close) { overlays.push(close); };
  K.dropOverlay = function (close) { var i = overlays.indexOf(close); if (i >= 0) overlays.splice(i, 1); };
  K.back = function (stack) {
    if (overlays.length) { overlays[overlays.length - 1](); return; }
    if (K.closeSwipes()) return;
    stack.pop();
  };

  // 行左滑：露出右边的小圆钮；同一时间只开一行
  var openRow = null;
  K.closeSwipes = function () {
    if (!openRow) return false;
    openRow.style.transform = "";
    openRow.closest(".swipe").classList.remove("open");
    openRow = null;
    return true;
  };
  K.swipe = function (wrap, reveal) {
    var body = wrap.querySelector(".swipe-body");
    var sx = 0, sy = 0, dx = 0, drag = false, decided = false, horiz = false, base = 0;
    wrap.addEventListener("pointerdown", function (e) {
      if (e.button) return;
      sx = e.clientX; sy = e.clientY; dx = 0; drag = true; decided = false; horiz = false;
      base = wrap.classList.contains("open") ? -reveal : 0;
      if (openRow && openRow !== body) K.closeSwipes();
    });
    wrap.addEventListener("pointermove", function (e) {
      if (!drag) return;
      var mx = e.clientX - sx, my = e.clientY - sy;
      if (!decided && (Math.abs(mx) > 6 || Math.abs(my) > 6)) { decided = true; horiz = Math.abs(mx) > Math.abs(my); if (horiz) { wrap.setPointerCapture(e.pointerId); body.style.transition = "none"; } }
      if (!horiz) return;
      dx = Math.max(-reveal * 1.25, Math.min(0, base + mx));
      body.style.transform = "translateX(" + dx + "px)";
      wrap.style.setProperty("--swipe", Math.min(1, -dx / reveal));
    });
    function end() {
      if (!drag) return;
      drag = false;
      if (!horiz) return;
      body.style.transition = "";
      var open = dx < -reveal / 2;
      body.style.transform = open ? "translateX(" + -reveal + "px)" : "";
      wrap.style.setProperty("--swipe", open ? 1 : 0);
      wrap.classList.toggle("open", open);
      openRow = open ? body : null;
      wrap.dataset.swiped = "1";
      setTimeout(function () { delete wrap.dataset.swiped; }, 50);
    }
    wrap.addEventListener("pointerup", end);
    wrap.addEventListener("pointercancel", end);
  };
  // 点开行之前先看这一下是不是刚滑过
  K.wasSwipe = function (el) { var w = el.closest(".swipe"); return !!(w && (w.dataset.swiped || w.classList.contains("open"))); };

  // 换外观：新样子从点的位置画圆扩散出来（浏览器支持 View Transitions 时）
  K.reveal = function (x, y, apply, frame) {
    if (!document.startViewTransition) { apply(); return; }
    var r = frame.getBoundingClientRect();
    var cx = x - r.left, cy = y - r.top;
    var far = Math.hypot(Math.max(cx, r.width - cx), Math.max(cy, r.height - cy));
    var vt = document.startViewTransition(apply);
    // 页面在后台时浏览器会放弃这次扩散，直接换上新样子就行，不当成错误
    vt.finished.catch(function () {});
    vt.ready.then(function () {
      // 圆心按手机框自己的坐标算，伪元素的裁剪以它自己的左上角为原点
      document.documentElement.animate(
        { clipPath: ["circle(0px at " + cx + "px " + cy + "px)", "circle(" + (far + 40) + "px at " + cx + "px " + cy + "px)"] },
        { duration: K.dur(650), easing: "cubic-bezier(0.65, 0, 0.35, 1)", pseudoElement: "::view-transition-new(phone)" }
      );
    }).catch(function () {});
  };

  // 这一版不做的页面：点了弹一句提示，不让按钮看起来像坏了
  K.todo = function (root, toast) {
    root.addEventListener("click", function (e) { var t = e.target.closest("[data-todo]"); if (t) toast(t.dataset.todo); });
  };
  // 聊天输入：能打字，回车或点发送把消息加进聊天；没写字时提示一句
  K.composer = function (page, toast) {
    function send() {
      var input = page.querySelector(".field input"); if (!input) return;
      var text = input.value.trim();
      if (!text) { toast("先写点什么"); input.focus(); return; }
      var msgs = page.querySelector(".msgs"), sc = page.querySelector(".scroll");
      msgs.insertAdjacentHTML("beforeend", '<div class="me">' + K.esc(text) + "</div>");
      input.value = "";
      sc.scrollTo({ top: sc.scrollHeight, behavior: "smooth" });
      setTimeout(function () {
        if (!page.isConnected) return;
        msgs.insertAdjacentHTML("beforeend", '<div class="ai">收到。</div>');
        sc.scrollTo({ top: sc.scrollHeight, behavior: "smooth" });
      }, K.dur(700));
    }
    page.addEventListener("click", function (e) { if (e.target.closest('[data-act="send"]')) send(); });
    page.addEventListener("keydown", function (e) { if (e.key === "Enter" && e.target.matches(".field input")) { e.preventDefault(); send(); } });
  };
  K.inputHTML = '<label class="field"><input placeholder="发消息" enterkeyhint="send" autocomplete="off"></label>';

  // 待确认从哪里算：权限请求、提问，加上 Claude Code 自己说在等回复的
  K.needsYou = function (s) { return s.state === "need" || s.state === "reply"; };
  K.pendingAll = function (RC) {
    var online = {};
    RC.machines.forEach(function (m) { online[m.id] = m.online; });
    return RC.sessions.filter(function (s) { return online[s.machine] && K.needsYou(s); });
  };
  // 先排会卡住会话的（权限请求、提问），再排等回复的；同一类里当前目标机在前
  K.sortPending = function (list, machine) {
    return list.slice().sort(function (a, b) {
      return ((a.state === "need" ? 0 : 2) + (a.machine === machine ? 0 : 1)) - ((b.state === "need" ? 0 : 2) + (b.machine === machine ? 0 : 1));
    });
  };
  K.machine = function (RC, id) { return RC.machines.filter(function (m) { return m.id === id; })[0]; };
  K.session = function (RC, id) { return RC.sessions.filter(function (s) { return s.id === id; })[0]; };
  K.stateWord = function (s) {
    if (s.state === "need") return s.pending === "question" ? "等你选" : "等你允许";
    if (s.state === "reply") return "等你回复";
    if (s.state === "work") return "工作中";
    if (s.state === "stop") return "已停止";
    return "空闲";
  };

  // 换外观时手机里整个重搭，旧的浮层和左滑状态一起作废
  K.resetOverlays = function () { overlays.length = 0; openRow = null; };

  window.K = K;
})();
</script>
<script>
(function () {
  // 四套外观各是一个模块：挂上时自己搭手机里的外壳（顶栏、底栏、首页头部、弹层），返回页面栈和几个钩子。
  // 目标机、标签页、深浅色、折叠和筛选这些状态放在 S 里四套共用，换外观时原样带过去；主题色每套各记各的。
  var RC = window.RC, root = document.documentElement, phone = document.getElementById("phone");
  var LOOK_LIST = [["clear", "清玻"], ["plate", "印版"], ["tile", "素卡"], ["ink", "浮墨"]];
  var ACC_DEFAULT = { tile: "#007AFF", ink: "#D97757", clear: "#2A45E0" };
  var S = { look: "tile", machine: "m1", tab: "sessions", themePref: "light", theme: "light",
    accs: { tile: "#007AFF", ink: "#D97757", clear: "#2A45E0" }, acc: "#007AFF", ink: "ultra",
    one: false, folded: {}, gitPane: "log", list: "active", dir: null };
  var api = null, LOOKS = {};
  var A = {
    S: S, phone: phone, LOOK_LIST: LOOK_LIST,
    ACCENTS: { ink: [{ v: "#D97757", name: "陶土" }].concat(RC.accents), clear: [{ v: "#2A45E0", name: "钴蓝" }].concat(RC.accents) },
    statusHTML: '<div class="status"><span>15:12</span><span><span class="ms">signal_cellular_alt</span><span class="ms">wifi</span><span class="ms">battery_full</span></span></div>',
    // 「只有一台目标机」打开时，四套都只认第一台
    machines: function () { return RC.machines.filter(function (m) { return !S.one || m.id === "m1"; }); },
    pendingAll: function () { return K.pendingAll(RC).filter(function (s) { return !S.one || s.machine === "m1"; }); },
    mini: mini, setAcc: setAcc, revealTheme: revealTheme, switchLook: switchLook, drawReview: drawReview
  };

  /* ==================== 素卡 ==================== */
  LOOKS.tile = function (A) {
    var RC = window.RC, h = K.h, ic = K.icon, esc = K.esc, S = A.S, phone = A.phone;
    phone.innerHTML = A.statusHTML + '<div class="screen" id="screen"></div><nav class="tabbar" id="tabbar"></nav><div id="layer"></div>';
    var screen = document.getElementById("screen"), tabbar = document.getElementById("tabbar"), layer = document.getElementById("layer");
    var stack = K.Stack(screen, { onChange: function (st) { tabbar.classList.toggle("hide", st.pages.length > 1); } });

    function machines() { return RC.machines.filter(function (m) { return !S.one || m.id === "m1"; }); }
    function pending() { return K.sortPending(K.pendingAll(RC).filter(function (s) { return !S.one || s.machine === "m1"; }), S.machine); }
    function cur() { return K.machine(RC, S.machine); }

    /* ---------- 会话页 ---------- */
    function homePage() {
      var m = cur(), list = machines();
      var el = h('<div class="page" data-tab="sessions"><div class="minibar"><b>' + esc(m.name) + '</b><button class="ibtn" data-act="new">' + ic("add") + '</button></div><div class="scroll"></div></div>');
      var sc = el.querySelector(".scroll");
      sc.innerHTML =
        '<header class="hero"><div class="hero-text"><h1 class="h1">' + esc(m.name) + '</h1><div class="h1-sub"><i class="dot ok"></i>在线 · Claude Code ' + m.ver + '</div></div>' +
        '<div class="tools"><div class="pillgroup"><button class="ibtn" data-act="refresh">' + ic("refresh") + '</button><button class="ibtn" data-act="scan">' + ic("qr_code_scanner") + '</button></div>' +
        '<button class="ibtn round" data-act="new">' + ic("add") + "</button></div></header>" +
        '<div class="machines-wrap' + (list.length > 1 ? "" : " gone") + '"><div><div class="machines">' + machineChips() + "</div></div></div>" +
        '<div class="bento">' + pendingTile() + usageTile(m) + "</div>" +
        '<div class="lists">' + sessionLists() + "</div>";
      wireHome(el);
      return el;
    }
    function machineChips() {
      return machines().map(function (m) {
        var n = RC.sessions.filter(function (s) { return s.machine === m.id && K.needsYou(s); }).length;
        var sub = !m.online ? "离线 · " + m.seen : n ? n + " 个等你" : RC.sessions.filter(function (s) { return s.machine === m.id; }).length + " 个会话";
        return '<button class="mchip' + (m.id === S.machine ? " on" : "") + (m.online ? "" : " off") + '" data-m="' + m.id + '"><div><b>' + esc(m.name) + "</b><span>" + sub + '</span></div><i class="chk">' + ic("check") + "</i></button>";
      }).join("") + '<button class="mchip add" data-act="scan">' + ic("add") + "<div><b>配对</b></div></button>";
    }
    function pendingTile() {
      var p = pending(), n = p.length, first = p[0];
      var next = first ? "<b>" + esc(first.title) + "</b> · " + esc(K.machine(RC, first.machine).name) : "没有等你处理的会话";
      var working = RC.sessions.filter(function (s) { return s.machine === S.machine && s.state === "work"; }).length;
      return '<div class="tile t-pending" data-act="next">' +
        '<div class="tile-h">' + ic(n ? "front_hand" : "bolt") + "<span>" + (n ? "待确认" : "工作中") + "</span></div>" +
        '<div class="num"><span class="big"><span class="roll" id="pnum">' + (n || working) + '</span></span><span class="big-unit">' + (n ? "个等你" : "个会话在跑") + "</span></div>" +
        '<div class="next">' + next + "</div>" +
        '<div class="cookie" data-act="cookie"><svg viewBox="0 0 64 64"><path class="cookie-bg" d="' + K.cookie(32, 32, 31, 0.06, 5, 0.3) + '"/><path class="cookie-fg" d="' + K.cookie(32, 32, 23, 0.085, 8, 0) + '"/></svg>' + ic(n ? "arrow_forward" : "add") + "</div></div>";
    }
    function pendChip() {
      var n = pending().length;
      return n ? '<button class="pchip" data-act="next" title="下一个待确认"><svg viewBox="0 0 44 44"><path d="' + K.cookie(22, 22, 19, 0.08, 8, 0) + '"/></svg><b>' + n + "</b></button>" : "";
    }
    function usageTile(m) {
      if (!m.usage) return '<div class="tile t-usage"><div class="tile-h">' + ic("speed") + "<span>用量</span></div><div class=\"big-unit\" style=\"margin:10px 0 0\">这一档读不到用量</div></div>";
      var u = m.usage;
      function row(label, v, reset) { return '<div class="u"><div class="u-top"><b>' + v + '%</b><span>' + label + "</span><i>" + reset + '</i></div><div class="bar"><i style="width:' + v + '%"></i></div></div>'; }
      return '<div class="tile t-usage"><div class="tile-h">' + ic("speed") + "<span>用量</span></div>" + row("5 小时", u.five, u.fiveReset) + row("每周", u.week, u.weekReset.replace(" 11:00", "")) + "</div>";
    }
    function sessionLists() {
      var mine = RC.sessions.filter(function (s) { return s.machine === S.machine; });
      var profs = []; mine.forEach(function (s) { if (profs.indexOf(s.profile) < 0) profs.push(s.profile); });
      return profs.map(function (pid) {
        var p = RC.profiles[pid], ss = mine.filter(function (s) { return s.profile === pid; });
        var dirs = []; ss.forEach(function (s) { if (dirs.indexOf(s.dir) < 0) dirs.push(s.dir); });
        var head = profs.length > 1 ? '<h3 class="sec">' + esc(p.name) + "<span>" + (p.host ? esc(p.host) + " · " : "") + ss.length + ' 个会话</span><button class="ibtn" data-act="rename">' + ic("edit") + "</button></h3>" : '<div style="height:10px"></div>';
        return head + dirs.map(function (d) { return dirCard(d, ss.filter(function (s) { return s.dir === d; })); }).join("");
      }).join("");
    }
    function dirCard(d, ss) {
      var g = RC.dirs[d] || {}, key = S.machine + d;
      var br = g.branch ? g.branch + (g.ahead ? " ↑" + g.ahead : "") + (g.behind ? " ↓" + g.behind : "") : "";
      var ordered = [];
      ss.forEach(function (s) { if (!s.forkOf) { ordered.push(s); ss.forEach(function (f) { if (f.forkOf === s.id) ordered.push(f); }); } });
      ss.forEach(function (s) { if (ordered.indexOf(s) < 0) ordered.push(s); });
      return '<div class="card' + (S.folded[key] ? " folded" : "") + '" data-dir="' + key + '"><div class="dir-head" data-act="fold">' + ic("folder", "f") + '<span class="dir-name">' + esc(d) + '</span><span class="dir-branch">' + esc(br) + "</span>" + ic("expand_more", "fold") + "</div>" +
        '<div class="dir-rows"><div>' + ordered.map(sessionRow).join("") + "</div></div></div>";
    }
    function sub(s) {
      if (s.state === "need") return "<b>" + K.stateWord(s) + "</b> · " + (s.pending === "permission" ? '<span class="mono">' + esc(s.detail) + "</span>" : esc(s.detail));
      if (s.state === "reply") return "<b>等你回复</b> · " + esc(s.detail);
      if (s.state === "work") return "<b>工作中</b> · " + esc(s.detail);
      var bits = [];
      if (s.wt) bits.push('<span class="mono">⑂ ' + esc(s.branch) + "</span>");
      if (s.state === "stop") bits.push("已停止");
      if (s.ctx) bits.push("上下文 " + s.ctx + "%");
      bits.push(s.time);
      return bits.join(" · ");
    }
    function sessionRow(s) {
      var stop = s.state === "work";
      var agents = s.agents ? '<div class="agents">' + s.agents.map(function (a) { return '<div class="agent"><i class="glyph g-work"></i><span>' + esc(a.desc) + "</span><i>" + a.type + " · " + a.ago + "</i></div>"; }).join("") + "</div>" : "";
      return '<div class="swipe" data-s="' + s.id + '"><div class="swipe-acts"><button class="act' + (stop ? "" : " danger") + '" data-act="' + (stop ? "stop" : "remove") + '">' + ic(stop ? "stop" : "delete") + "</button></div>" +
        '<div class="swipe-body"><div class="row' + (s.forkOf ? " fork" : "") + '" data-open="' + s.id + '"><i class="glyph g-' + s.state + '"></i><div class="row-text"><div class="row-title">' + esc(s.title) + '</div><div class="row-sub">' + sub(s) + "</div></div></div>" + agents + "</div></div>";
    }
    function wireHome(el) {
      var sc = el.querySelector(".scroll");
      sc.addEventListener("scroll", function () { el.classList.toggle("scrolled", sc.scrollTop > 70); });
      el.querySelectorAll(".swipe").forEach(function (w) { K.swipe(w, 64); });
      el.addEventListener("click", onHomeClick);
      wireCookie(el);
    }
    function onHomeClick(e) {
      var t = e.target.closest("[data-act],[data-m],[data-open]");
      if (!t) return;
      if (t.dataset.m) return switchMachine(t.dataset.m);
      if (t.dataset.open) { if (K.wasSwipe(t)) { K.closeSwipes(); return; } return openChat(t.dataset.open); }
      var a = t.dataset.act;
      if (a === "fold") { var c = t.closest(".card"); c.classList.toggle("folded"); S.folded[c.dataset.dir] = c.classList.contains("folded"); }
      else if (a === "next" || a === "cookie") goNext();
      else if (a === "new") toast("新建会话页这一版不改");
      else if (a === "scan") toast("扫码配对");
      else if (a === "refresh") toast("已刷新");
      else if (a === "rename") toast("改档位名");
      else if (a === "stop" || a === "remove") { var w = t.closest(".swipe"); K.closeSwipes(); w.style.transition = "opacity " + K.dur(200) + "ms, transform " + K.dur(200) + "ms"; w.style.opacity = 0; setTimeout(function () { toast(a === "stop" ? "已停止" : "已移出"); }, K.dur(150)); }
    }
    // 多瓣圆：按下收成圆并转一点，松手弹回
    function wireCookie(el) {
      var ck = el.querySelector(".cookie"); if (!ck) return;
      var fg = ck.querySelector(".cookie-fg"), icon = ck.querySelector(".ms"), amp = 0.085, rot = 0;
      function draw() { fg.setAttribute("d", K.cookie(32, 32, 23 - (0.085 - amp) * 18, amp, 8, rot)); }
      ck.addEventListener("pointerdown", function () { K.tween(amp, 0, 180, function (v) { amp = v; rot += 0.01; draw(); }, function (p) { return 1 - Math.pow(1 - p, 3); }); icon.style.transform = "scale(0.9)"; });
      function up() { K.tween(amp, 0.085, 520, function (v) { amp = v; draw(); }); icon.style.transform = ""; }
      ck.addEventListener("pointerup", up); ck.addEventListener("pointerleave", function () { if (amp < 0.08) up(); });
    }
    function switchMachine(id) {
      if (id === S.machine) return;
      var m = K.machine(RC, id);
      if (!m.online) { toast(m.name + " 离线"); return; }
      S.machine = id;
      var page = stack.pages[0];
      if (!page || page.dataset.tab !== "sessions") return;
      page.querySelectorAll(".mchip").forEach(function (c) { c.classList.toggle("on", c.dataset.m === id); });

        setTimeout(function () { scrim.remove(); d.remove(); if (typeof after === "function") after(); }, K.dur(300));
      }

    function onChat(e, el, s) {

      return el;
    }
    function mini(k) { return A.mini(k); }
    function inks() {
      return INKS.map(function (k) { return '<button class="inkc' + (k.id === S.ink ? " on" : "") + '" data-ink="' + k.id + '"><i style="background:' + (S.theme === "dark" ? k.dark : k.light) + '"></i>' + k.name + "</button>"; }).join("");
    }

    /* ---------- 通用 ---------- */
    function applyInk() {
      var k = INKS.filter(function (x) { return x.id === S.ink; })[0], dark = S.theme === "dark", st = document.documentElement.style;
      st.setProperty("--ink", dark ? k.dark : k.light);
      st.setProperty("--paper", dark ? k.darkPaper : "#F3F2EC");
      document.querySelectorAll("#inks").forEach(function (x) { x.innerHTML = inks(); });
      A.drawReview();
    }
    function setInk(id) { S.ink = id; applyInk(); }
    var toastT;
    function toast(text) {
      var t = layer.querySelector(".toast") || layer.appendChild(h('<div class="toast"></div>'));
      t.textContent = text; t.classList.add("enter"); t.classList.remove("on"); void t.offsetWidth; t.classList.remove("enter"); t.classList.add("on");
      clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove("on"); }, 1800);
    }

    drawNav();
    applyInk();
    stack.root(S.tab === "git" ? gitPage(false) : S.tab === "settings" ? settingsPage() : homePage());
    return {
      stack: stack, toast: toast, openChat: openChat,
      refresh: function () { refreshHome(); },
      onOne: function () { if (S.one && S.machine !== "m1") setMachine("m1"); refreshHome(); },
      swatches: function () { return INKS.map(function (x) { return { v: x.id, name: x.name, color: S.theme === "dark" ? x.dark : x.light }; }); },
      accNow: function () { return S.ink; }, pickAcc: setInk, syncAccent: applyInk
    };
  };

  /* ---------- 四套共用：设置里的样式缩略图 ---------- */
  function mini(k) {
    var parts = {
      tile: '<i style="left:12%;right:12%;top:14%;height:9%"></i><i style="left:12%;width:36%;top:27%;height:15%"></i><i style="left:52%;right:12%;top:27%;height:15%"></i><i style="left:12%;right:12%;top:46%;height:30%"></i>',
      ink: '<i style="left:10%;width:16%;top:7%;aspect-ratio:1"></i><i style="left:36%;width:28%;top:8%;height:6%"></i><i style="left:12%;width:52%;bottom:6%;height:8%"></i><i style="right:10%;width:17%;bottom:6%;aspect-ratio:1;background:' + S.accs.ink + '"></i>',
      clear: '<i style="left:12%;width:50%;top:16%;height:5%;background:#111"></i><i style="left:12%;right:12%;top:32%"></i><i style="left:12%;right:24%;top:42%"></i><i style="left:12%;right:12%;top:52%"></i><i style="left:22%;right:22%;bottom:6%;height:7%;border-radius:99px"></i>',
      plate: '<i style="left:10%;width:34%;top:12%;height:12%"></i><i style="left:10%;right:10%;top:30%;height:1px"></i><i style="left:10%;right:10%;top:44%;height:1px;opacity:.4"></i><i style="left:10%;right:10%;top:56%;height:1px;opacity:.4"></i><i style="left:10%;right:10%;bottom:10%;height:1.5px"></i>'
    };
    return '<div class="mini mini-' + k + '">' + parts[k] + "</div>";
  }

  /* ---------- 主题色和深浅色 ---------- */
  // 选的就是这一套的默认色时不写行内变量，深色下各套自己配的那一档（清玻的浅钴蓝、浮墨的浅陶土）才生效
  function applyAccentVars() {
    var st = root.style;
    ["--c-acc", "--c-on-acc", "--ink", "--paper"].forEach(function (p) { st.removeProperty(p); });
    if (S.look === "plate") return;
    var hex = S.accs[S.look];
    if (hex === ACC_DEFAULT[S.look]) return;
    var c = hex.replace("#", ""), r = parseInt(c.slice(0, 2), 16), g = parseInt(c.slice(2, 4), 16), b = parseInt(c.slice(4, 6), 16);
    st.setProperty("--c-acc", hex);
    st.setProperty("--c-on-acc", (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255 > 0.62 ? "#111111" : "#FFFFFF");
  }
  function setAcc(hex) {
    S.accs[S.look] = hex; S.acc = hex;
    applyAccentVars();
    if (api) api.syncAccent();
    drawReview();
  }
  var darkQuery = matchMedia("(prefers-color-scheme: dark)");
  function resolve(pref) { return pref === "system" ? (darkQuery.matches ? "dark" : "light") : pref; }
  function setTheme(pref) {
    S.themePref = pref; S.theme = resolve(pref);
    root.dataset.theme = S.theme;
    // 印版的油墨和纸每种都配了深浅两套，换深浅色时跟着换
    if (S.look === "plate" && api) api.syncAccent();
    phone.querySelectorAll("[data-mode]").forEach(function (b) { b.classList.toggle("on", b.dataset.mode === pref); });
    drawReview();
  }
  // 深浅色真的变了才画圆扩散；比如系统本来就是浅色时从「浅色」切到「跟随系统」，只换选中项
  function revealTheme(pref, x, y) {
    if (resolve(pref) === S.theme) { setTheme(pref); return; }
    K.reveal(x, y, function () { setTheme(pref); }, phone);
  }
  darkQuery.addEventListener("change", function () { if (S.themePref === "system") setTheme("system"); });

  /* ---------- 换外观 ---------- */
  function mount(k, reopen) {
    K.resetOverlays();
    S.look = k; S.acc = S.accs[k] || null;
    root.dataset.look = k; root.dataset.theme = S.theme;
    applyAccentVars();
    phone.className = "phone settling";
    api = null;
    api = LOOKS[k](A);
    if (reopen && K.session(RC, reopen)) api.openChat(reopen);
    phone.getBoundingClientRect();
    requestAnimationFrame(function () { requestAnimationFrame(function () { phone.classList.remove("settling"); }); });
    history.replaceState(history.state, "", "#" + k);
    drawReview();
  }
  // 换过去停在同一个标签页；聊天页开着时在新样式里重新打开同一个会话
  function switchLook(k, x, y) {
    if (k === S.look || !LOOKS[k]) return;
    var top = api && api.stack.top();
    var reopen = top && top.classList.contains("chat") ? top.dataset.s : null;
    if (x == null) { var r = phone.getBoundingClientRect(); x = r.right - 40; y = r.top + 60; }
    K.reveal(x, y, function () { mount(k, reopen); }, phone);
  }

  /* ---------- 审阅栏 ---------- */
  var LOOK_INFO = {
    tile: { name: "素卡", acc: "主题色", lead: "暖灰底上的白色大圆角块，打开就是这台目标机的概览和会话。", items: [
      "两张便当卡：左边点多瓣圆直接去下一个待确认，按下时形状收成圆",
      "两台以上目标机才出现的目标机条，点了原地切换",
      "聊天页批完待确认，托盘上方提示下一个",
      "托盘里的任务清单展开收起，待确认时托盘留着、只换输入框",
      "会话行左滑露出圆钮；fork 和子代理的画法",
      "git 的分段选择器；设置里换深浅色和主题色的扩散"] },
    ink: { name: "浮墨", acc: "点缀色", lead: "近黑的底，控件悬浮；面板从按下的那颗圆里长出来。", items: [
      "右下圆钮：有待确认时换成数字，点开长出面板，上半跨机待确认、下半目标机",
      "顶部中间的目标机胶囊长出用量和版本；左上圆钮开侧栏，主页缩成卡片推开",
      "「活跃 / 全部」的笔刷色块；底栏指示块整块弹过去，略冲过头再落回",
      "聊天页：输入岛里的任务清单，待确认时那一节长高，主按钮黑白反色",
      "聊天顶部「会话名 · 分支」胶囊长出会话控制；批完提示下一个",
      "设置里换深浅色和点缀色的扩散"] },
    clear: { name: "清玻", acc: "主题色", lead: "白纸面不套卡片，只有浮在内容上的操作层是玻璃。", items: [
      "大标题就是目标机名，点开从顶上落下玻璃面板切换",
      "有待确认时底栏上沿长出玻璃横条，三个首页都有，一点进下一个",
      "底栏保留一边先走一边跟上的拉伸；git 用玻璃分段透镜",
      "聊天底部是贴底整片玻璃，任务清单、工作中、输入框都在里面；待确认时任务清单还在",
      "「允许」是全 APP 唯一的实心钴蓝"] },
    plate: { name: "印版", acc: "油墨", lead: "一张单色印刷品：纸和一种油墨，直角，线条当主角。", items: [
      "刊头：字标切目标机，大数字是跨机待确认，点整块进下一个；两把 51 格用量尺；四角裁切线",
      "会话是索引表，状态是方框记号；切目标机时各行依次上墨、划过一道墨线",
      "底栏纯文字，选中项下方从中间画线；git 和设置页右上角的实墨方章",
      "聊天：顶栏下沿的线是上下文比例尺；底部 1.5px 线封顶，输入框只有一道底线",
      "待确认是从左印出的纸条，「允许」实墨；目标机面板背后盖斜纹纸",
      "设置里的油墨色：每种都配好了深浅两套"] }
  };
  var REVIEW_ORDER = ["tile", "ink", "clear", "plate"];
  function byId(id) { return document.getElementById(id); }
  function drawReview() {
    if (!api) return;
    var info = LOOK_INFO[S.look], now = api.accNow();
    byId("rv-look").innerHTML = REVIEW_ORDER.map(function (k) { return '<button class="rbtn' + (k === S.look ? " on" : "") + '" data-look="' + k + '">' + LOOK_INFO[k].name + "</button>"; }).join("");
    byId("rv-lead").textContent = info.lead;
    byId("rv-mode").innerHTML = [["system", "跟随系统"], ["light", "浅色"], ["dark", "深色"]].map(function (x) { return '<button class="rbtn' + (S.themePref === x[0] ? " on" : "") + '" data-rmode="' + x[0] + '">' + x[1] + "</button>"; }).join("");
    byId("rv-acc-h").textContent = info.acc;
    byId("rv-acc").innerHTML = api.swatches().map(function (a) { return '<button class="rsw' + (a.v === now ? " on" : "") + '" data-racc="' + a.v + '" title="' + a.name + '" style="background:' + a.color + '"></button>'; }).join("");
    byId("rv-new").classList.toggle("on", K.session(RC, "s8").state === "need");
    byId("rv-clear").textContent = cleared.length ? "恢复待确认" : "清空待确认";
    byId("rv-one").classList.toggle("on", S.one);
    byId("rv-slow").classList.toggle("on", K.slow > 1);
    byId("rv-list").innerHTML = info.items.map(function (x) { return "<li>" + K.esc(x) + "</li>"; }).join("");
  }
  var cleared = [];
  document.querySelector(".review").addEventListener("click", function (e) {
    var t = e.target.closest("button"); if (!t || !api) return;
    if (t.dataset.look) switchLook(t.dataset.look);
    else if (t.dataset.rmode) { var p = phone.getBoundingClientRect(); revealTheme(t.dataset.rmode, p.right - 40, p.top + 60); }
    else if (t.dataset.racc) api.pickAcc(t.dataset.racc);
    else if (t.id === "rv-new") {
      var s = K.session(RC, "s8");
      if (s.state === "need") { s.state = "idle"; s.pending = null; s.detail = ""; }
      else { s.state = "need"; s.pending = "question"; s.detail = "实验数据保留几位小数？"; RC.pendingDetail.s8 = { kind: "question", title: "实验数据保留几位小数？", options: [["两位", "和课本表格一致"], ["三位", "误差分析更细"], ["按原始精度", "不做取舍"]] }; }
      api.refresh(true);
      drawReview();
    }
    else if (t.id === "rv-clear") {
      if (cleared.length) { cleared.forEach(function (c) { K.session(RC, c[0]).state = c[1]; }); cleared = []; }
      else K.pendingAll(RC).forEach(function (s) { cleared.push([s.id, s.state]); s.state = "idle"; });
      api.refresh(true);
      drawReview();
    }
    else if (t.id === "rv-one") { S.one = !S.one; api.onOne(); drawReview(); }
    else if (t.id === "rv-slow") { K.setSlow(K.slow === 1); drawReview(); }
  });

  /* ---------- 启动 ---------- */
  // 四套的字体先都取回来，第一次换到某一套时字不会先用系统字顶着再跳
  [["Geist", "会话 abc"], ["Geist Mono", "abc"], ["Onest", "会话 abc"], ["JetBrains Mono", "abc"], ["Roboto", "会话 abc"], ["Roboto Mono", "abc"], ["Archivo", "会话 abc"], ["IBM Plex Mono", "abc"],
    ["Material Symbols Rounded", "forum"], ["Material Symbols Outlined", "forum"], ["Material Symbols Sharp", "forum"]].forEach(function (f) {
    document.fonts.load('16px "' + f[0] + '"', f[1]).catch(function () {});
  });
  // 这一版没换的页面点了弹提示；Esc 和浏览器后退都等于系统返回
  K.todo(phone, function (text) { if (api) api.toast(text); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && api) K.back(api.stack); });
  window.addEventListener("popstate", function () { if (api) K.back(api.stack); });
  var start = location.hash.slice(1);
  if (LOOK_INFO[start]) S.look = start;
  // 浮墨按深色设计，直接打开它时先给深色
  if (S.look === "ink") S.themePref = S.theme = "dark";
  mount(S.look);
})();
